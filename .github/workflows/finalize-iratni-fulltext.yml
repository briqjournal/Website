name: Finalize Iratni English full text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-iratni-fulltext.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PDF hierarchy and article render
        run: |
          git pull --rebase origin main
          python -m pip install --quiet pymupdf
          curl -L --fail --retry 3 'https://www.briqjournal.com/sites/default/files/yazi-ici-dosyalar/2025-06/Belkacem%20Iratni_ENG.pdf' -o /tmp/iratni.pdf
          python <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          import pymupdf as fitz

          root = Path('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine')
          p = root / 'fulltext' / 'en-archive.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          headings = [
              'Introduction',
              'The “Mecca” of the Revolutionaries',
              'Diplomatic support',
              'Arms and military training for African freedom fighters',
              'The Arduous Quest for a Militant Non-Aligned Movement',
              'Adapting the Non-Aligned Movement to an Evolving Global Landscape',
              'Conclusion',
          ]
          assert [s['title'] for s in data['sections']] == headings
          assert len(data.get('references', [])) == 32
          body = '\n'.join(x for s in data['sections'] for x in s.get('paragraphs', []))
          assert len(body.split()) > 7000
          for bad in ['pre-sence', 'effec- tively', 'colle- ctively', 'co-lonial', 're-volutionary', 'pro-viding', 'suscep- tible', 'ap- prove', 'mate- rials']:
              assert bad not in body, bad

          def canon(s):
              s = unicodedata.normalize('NFKD', s).replace('“','').replace('”','').replace('’', "'")
              return re.sub(r'[^a-z0-9]+', '', s.lower())

          doc = fitz.open('/tmp/iratni.pdf')
          found = {}
          targets = {canon(h): h for h in headings}
          for page in doc:
              for block in page.get_text('dict').get('blocks', []):
                  if 'lines' not in block:
                      continue
                  spans = [sp for ln in block['lines'] for sp in ln.get('spans', [])]
                  text = ' '.join(''.join(sp.get('text','') for sp in ln.get('spans', [])).strip() for ln in block['lines']).strip()
                  key = canon(text)
                  if key in targets:
                      found[targets[key]] = {
                          'size': max(float(sp.get('size', 0)) for sp in spans) if spans else 0,
                          'fonts': sorted({sp.get('font','') for sp in spans}),
                      }
          print('PDF_HEADING_STYLES', found)
          assert 'Diplomatic support' in found
          assert 'Arms and military training for African freedom fighters' in found

          # These two are subordinate headings within “The Mecca of the Revolutionaries” in the source layout.
          levels = ['section', 'section', 'subsection', 'subsection', 'section', 'section', 'section']
          for section, level in zip(data['sections'], levels):
              section['level'] = level
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('LEVELS', [(s['title'], s['level']) for s in data['sections']])
          PY

          npm ci
          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs
          npx vinext build
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';
          const workerUrl = pathToFileURL(`${process.cwd()}/dist/server/index.js`);
          workerUrl.searchParams.set('verify', `${Date.now()}`);
          const { default: worker } = await import(workerUrl.href);
          const env = { ASSETS: { fetch: async () => new Response('Not found', { status: 404 }) } };
          const context = { waitUntil() {}, passThroughOnException() {} };
          const path = '/en/articles/the-algerian-revolutionary-diplomacy-from-the-bandung-basic-initiation-to-a-new-concept-of-non-alignment/';
          const response = await worker.fetch(new Request(`https://briqjournal.com${path}`, { headers: { accept: 'text/html' } }), env, context);
          console.log('TARGET_STATUS', response.status);
          if (!response.ok) throw new Error(`target article render failed: ${response.status}`);
          const html = await response.text();
          for (const needle of ['The Algerian Revolutionary Diplomacy', 'The “Mecca” of the Revolutionaries', 'Diplomatic support', 'Conclusion']) {
            if (!html.includes(needle)) throw new Error(`target HTML missing: ${needle}`);
          }
          console.log('TARGET_RENDER_OK', html.length);
          NODE

          rm .github/workflows/finalize-iratni-fulltext.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json .github/workflows/finalize-iratni-fulltext.yml
          git commit -m 'Finalize Iratni full text hierarchy and validation'
          git pull --rebase origin main
          git push origin HEAD:main
