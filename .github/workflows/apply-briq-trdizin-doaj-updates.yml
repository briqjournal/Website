name: Apply BRIQ TR Dizin and DOAJ updates

on:
  push:
    paths:
      - '.github/workflows/apply-briq-trdizin-doaj-updates.yml'

permissions:
  contents: write

jobs:
  update-site:
    if: github.event.head_commit.message == 'Apply one-time BRIQ policy updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              if count == 0:
                  raise SystemExit(f'{path}: target not found: {old[:120]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          tr = 'app/[...slug]/page.tsx'
          en = 'app/en/[...slug]/page.tsx'
          chrome = 'app/components/SiteChrome.tsx'
          article = 'app/components/ArticlePlatform.tsx'
          data = 'app/site-data.ts'

          # 1) Peer-review wording: Turkish rich review-process page.
          replace(
              tr,
              '<p>e) Makaleden sorumlu editör, BRIQ kriterleri bakımından yeterli bulunan gönderileri ilgili alanda uzman hakemlere gönderir.</p><p>f)Hakem raporları yazara yollanır ve verilen süre içinde düzeltme isteklerini uygulayıp makaleyi yollaması istenir.</p>',
              '<p>e) Ön incelemeyi geçen her araştırma makalesi, çift kör hakemlik ilkesi doğrultusunda, ilgili alanda uzman en az iki bağımsız hakeme gönderilir. Hakemlerin mümkün olduğunca farklı kurumlardan seçilmesine özen gösterilir.</p><p>Hakem görüşlerinin esaslı biçimde ayrışması halinde editör değerlendirmesiyle karar verilebilir veya üçüncü bir hakem görüşüne başvurulabilir.</p><p>f)Hakem raporları yazara yollanır ve verilen süre içinde düzeltme isteklerini uygulayıp makaleyi yollaması istenir.</p>',
              1,
          )

          # 2) Peer-review wording: English rich review-process page and compact fallback record.
          replace(
              en,
              '<p>e) If the relevant BRIQ editors find the submission eligible for external and blind peer review based on the above criteria, the Editorial Team will contact potential peer-reviewers who have expertise in the relevant areas.</p><p>f) Upon receipt of peer-review reports, these reports are sent to the corresponding author and the corresponding author is expected to apply the changes suggested by reviewers.</p>',
              '<p>e) Every research article that passes the initial screening is sent, under the double-blind peer-review principle, to at least two independent reviewers with expertise in the relevant field. Reviewers are selected, as far as possible, from different institutions.</p><p>If the reviewers’ opinions diverge substantially, a decision may be reached through editorial assessment or the opinion of a third reviewer may be sought.</p><p>f) Upon receipt of peer-review reports, these reports are sent to the corresponding author and the corresponding author is expected to apply the changes suggested by reviewers.</p>',
              1,
          )
          replace(
              en,
              '["Peer review and revision", "Suitable academic manuscripts are sent to expert reviewers. Reports are shared with the author; substantial revisions may be returned to the reviewer."]',
              '["Peer review and revision", "Every research article that passes initial screening is sent under double-blind peer review to at least two independent subject experts, selected as far as possible from different institutions. If reviewer opinions diverge substantially, an editorial assessment may be made or a third reviewer may be consulted. Reports are shared with the author; substantial revisions may be returned to the reviewers."]',
              1,
          )

          # 3) Publisher: association is the publisher, in both languages and footer.
          replace(
              tr,
              'BRIQ, Çin İş Geliştirme ve Dostluk Derneği bünyesindeki Çin Araştırmaları Enstitüsü tarafından yayımlanmaktadır. Derginin sahibi, Çin İş Geliştirme ve Dostluk Derneği (Türk-Çin İş Der) adına Emine Sağlam’dır.',
              'BRIQ, Çin İş Geliştirme ve Dostluk Derneği tarafından yayımlanmaktadır. Derginin sahibi, Çin İş Geliştirme ve Dostluk Derneği (Türk-Çin İş Der) adına Emine Sağlam’dır.',
              1,
          )
          replace(
              en,
              'BRIQ is published by the China Research Institute of the China Business Development and Friendship Association.',
              'BRIQ is published by the Turkish-Chinese Business Development and Friendship Association.',
              3,
          )
          replace(
              chrome,
              '? "Published by the Institute for China Studies in Türkiye (ICST), which operates within the China Business Development and Friendship Association."\n              : "Çin İş Geliştirme ve Dostluk derneği bünyesinde yer alan Çin Araştırmaları Enstitüsü (ICST) tarafından yayımlanmaktadır."',
              '? "Published by the Turkish-Chinese Business Development and Friendship Association."\n              : "Çin İş Geliştirme ve Dostluk Derneği tarafından yayımlanmaktadır."',
              1,
          )

          # 4) Indexing & archiving: separate indexes from repository/preservation service.
          old_tr_indexes = '''function Indexes() {
            return (
              <>
                <PageHero
                  kicker="Dergi"
                  title="Endeksler"
                  intro="BRIQ’in doğrulanmış dizin ve akademik arşiv kayıtları aşağıda işlevleri birbirinden ayrılarak gösterilir."
                />
                <div className="site-shell page-section">
                  <IndexTicker />
                  <div className="index-detail-grid">
                    <article>
                      <span>01</span>
                      <h2>ERIH PLUS</h2>
                      <p>Beşerî ve sosyal bilimler için Avrupa referans dizini.</p>
                      <a className="underlined-link" href="https://erihplus.hkdir.no/">Resmî kayıtta ara ↗︎</a>
                    </article>
                    <article>
                      <span>02</span>
                      <h2>EuroPub</h2>
                      <p>BRIQ dergi profili ve makale kayıtlarının yer aldığı akademik dizin.</p>
                      <a className="underlined-link" href="https://europub.co.uk/journals/briq-belt-road-initiative-quarterly-J-33908">BRIQ profilini aç ↗︎</a>
                    </article>
                    <article>
                      <span>03</span>
                      <h2>SSOAR</h2>
                      <p>BRIQ yayınlarının tam metin kopyalarını kalıcı tanımlayıcılarla barındıran sosyal bilimler açık arşivi; dizin değildir.</p>
                      <a className="underlined-link" href="https://www.ssoar.info/ssoar/">SSOAR’ı aç ↗︎</a>
                    </article>
                  </div>
                </div>
              </>
            );
          }'''
          new_tr_indexes = '''function Indexes() {
            return (
              <>
                <PageHero
                  kicker="Dergi"
                  title="Dizinler ve Arşivler"
                  intro="BRIQ’in doğrulanmış dizin ve akademik arşiv kayıtları, işlevleri açıkça ayrılarak gösterilir."
                />
                <div className="site-shell page-section">
                  <p className="section-kicker">Dizinler · Abstracting &amp; Indexing</p>
                  <div className="index-detail-grid">
                    <article>
                      <span>01</span>
                      <h2>ERIH PLUS</h2>
                      <p>Beşerî ve sosyal bilimler için Avrupa referans dizini.</p>
                      <a className="underlined-link" href="https://erihplus.hkdir.no/">Resmî kayıtta ara ↗︎</a>
                    </article>
                    <article>
                      <span>02</span>
                      <h2>EuroPub</h2>
                      <p>BRIQ dergi profili ve makale kayıtlarının yer aldığı akademik dizin.</p>
                      <a className="underlined-link" href="https://europub.co.uk/journals/briq-belt-road-initiative-quarterly-J-33908">BRIQ profilini aç ↗︎</a>
                    </article>
                  </div>
                  <p className="section-kicker">Açık Erişim Depoları ve Arşivleme</p>
                  <div className="index-detail-grid">
                    <article>
                      <span>01</span>
                      <h2>SSOAR</h2>
                      <p>BRIQ yayınlarının tam metin kopyalarını kalıcı tanımlayıcılarla barındıran sosyal bilimler açık erişim deposu ve arşivleme hizmetidir; akademik dizin olarak sınıflandırılmaz.</p>
                      <a className="underlined-link" href="https://www.ssoar.info/ssoar/">SSOAR’ı aç ↗︎</a>
                    </article>
                  </div>
                </div>
              </>
            );
          }'''
          replace(tr, old_tr_indexes, new_tr_indexes, 1)
          replace(tr, '{ number: "04", title: "Endeksler", text: "BRIQ’in mevcut sitesinde beyan edilen dizin ve keşif hizmetleri.", href: "/dergi/endeksler" }', '{ number: "04", title: "Dizinler ve Arşivler", text: "BRIQ’in akademik dizin, açık erişim deposu ve arşivleme kayıtları.", href: "/dergi/endeksler" }', 1)
          replace(tr, '"dergi/endeksler": ["Endeksler ve açık arşivler", "BRIQ’in doğrulanmış endeks ve açık arşiv kayıtları."]', '"dergi/endeksler": ["Dizinler ve Arşivler", "BRIQ’in doğrulanmış akademik dizin ve açık arşiv kayıtları."]', 1)
          replace(data, '["Endeksler", "/dergi/endeksler"]', '["Dizinler ve Arşivler", "/dergi/endeksler"]', 1)

          old_en_indexes = '''function EnglishIndexes() {
            return (
              <>
                <EnglishHero kicker="Journal" title="Indexes" intro="Verified indexing and repository records, identified by their actual function." />
                <div className="site-shell page-section">
                  <IndexTicker locale="en" />
                  <div className="index-detail-grid">
                    <article><span>01</span><h2>ERIH PLUS</h2><p>European Reference Index for the Humanities and Social Sciences.</p><a className="underlined-link" href="https://erihplus.hkdir.no/">Search the official register ↗︎</a></article>
                    <article><span>02</span><h2>EuroPub</h2><p>Academic index containing BRIQ’s journal and article records.</p><a className="underlined-link" href="https://europub.co.uk/journals/briq-belt-road-initiative-quarterly-J-33908">Open the BRIQ profile ↗︎</a></article>
                    <article><span>03</span><h2>SSOAR</h2><p>Open social-science repository preserving full-text BRIQ publications; it is not presented as an index.</p><a className="underlined-link" href="https://www.ssoar.info/ssoar/">Open SSOAR ↗︎</a></article>
                  </div>
                </div>
              </>
            );
          }'''
          new_en_indexes = '''function EnglishIndexes() {
            return (
              <>
                <EnglishHero kicker="Journal" title="Indexing & Archiving" intro="BRIQ’s verified indexing and academic repository records, clearly separated by function." />
                <div className="site-shell page-section">
                  <p className="section-kicker">Abstracting &amp; Indexing</p>
                  <div className="index-detail-grid">
                    <article><span>01</span><h2>ERIH PLUS</h2><p>European Reference Index for the Humanities and Social Sciences.</p><a className="underlined-link" href="https://erihplus.hkdir.no/">Search the official register ↗︎</a></article>
                    <article><span>02</span><h2>EuroPub</h2><p>Academic index containing BRIQ’s journal and article records.</p><a className="underlined-link" href="https://europub.co.uk/journals/briq-belt-road-initiative-quarterly-J-33908">Open the BRIQ profile ↗︎</a></article>
                  </div>
                  <p className="section-kicker">Open Repositories &amp; Archiving</p>
                  <div className="index-detail-grid">
                    <article><span>01</span><h2>SSOAR</h2><p>Open social-science repository and archiving service preserving full-text BRIQ publications with persistent identifiers; it is not classified as an academic index.</p><a className="underlined-link" href="https://www.ssoar.info/ssoar/">Open SSOAR ↗︎</a></article>
                  </div>
                </div>
              </>
            );
          }'''
          replace(en, old_en_indexes, new_en_indexes, 1)
          replace(en, '"journal/indexes": ["Indexes and Repositories", "BRIQ’s verified index and open-repository records.", "/dergi/endeksler"]', '"journal/indexes": ["Indexing & Archiving", "BRIQ’s verified indexing and open-repository records.", "/dergi/endeksler"]', 1)
          replace(chrome, '["Indexes", "/en/journal/indexes"]', '["Indexing & Archiving", "/en/journal/indexes"]', 1)

          # 5) Standard article declarations: five collapsible fields for research articles, TR and EN.
          replace(
              article,
              '''  declarations?: {\n    acknowledgements?: string;\n    funding?: string;\n    competingInterests?: string;\n    ethicsApproval?: string;\n  };''',
              '''  declarations?: {\n    acknowledgements?: string;\n    authorContributions?: string;\n    funding?: string;\n    competingInterests?: string;\n    ethicsApproval?: string;\n    informedConsent?: string;\n  };''',
              1,
          )

          old_statement_fn = '''function researchStatementItems(fullText: LocalizedFullText | undefined, locale: "tr" | "en"): StatementItem[] {
            const ack = fullText?.acknowledgements?.trim();
            const declarations = fullText?.declarations;
            const inferredFunding = ack && /(destek|support|fund|grant|program)/i.test(ack) ? ack : "";
            const inferredAcknowledgement = ack && !inferredFunding ? ack : "";
            const values = {
              acknowledgements: declarations?.acknowledgements?.trim() || inferredAcknowledgement,
              funding: declarations?.funding?.trim() || inferredFunding,
              competingInterests: declarations?.competingInterests?.trim() || "",
              ethicsApproval: declarations?.ethicsApproval?.trim() || "",
            };
            const definitions = locale === "tr" ? [
              ["tesekkur", "Teşekkür", values.acknowledgements],
              ["finansman", "Finansman beyanı", values.funding],
              ["cikar-catismasi", "Çıkar çatışması beyanı", values.competingInterests],
              ["etik-kurul", "Etik kurul beyanı", values.ethicsApproval],
            ] : [
              ["acknowledgements", "Acknowledgements", values.acknowledgements],
              ["funding", "Funding / Financial support", values.funding],
              ["competing-interests", "Competing interests", values.competingInterests],
              ["ethics-approval", "Ethics approval", values.ethicsApproval],
            ];
            return definitions
              .filter(([, , value]) => Boolean(value))
              .map(([id, label, value]) => ({ id, label, value }));
          }

          function ResearchStatements({ items, locale }: { items: StatementItem[]; locale: "tr" | "en" }) {
            if (!items.length) return null;
            return (
              <div className="article-declaration-list">
                {items.map(({ id, label, value }) => <section className="article-declaration" id={id} key={id}><p className="section-kicker">{locale === "tr" ? "Beyan" : "Statement"}</p><h2>{label}</h2><p>{value}</p></section>)}
              </div>
            );
          }'''

          new_statement_fn = '''function researchStatementItems(fullText: LocalizedFullText | undefined, locale: "tr" | "en"): StatementItem[] {
            const ack = fullText?.acknowledgements?.trim();
            const declarations = fullText?.declarations;
            const inferredFunding = ack && /(destek|support|fund|grant|program)/i.test(ack) ? ack : "";
            const missing = locale === "tr"
              ? {
                  authorContributions: "Bu makale için yazar katkı beyanı kaynak kaydında ayrıca belirtilmemiştir.",
                  funding: "Bu makale için finansman veya destek beyanı kaynak kaydında ayrıca belirtilmemiştir.",
                  competingInterests: "Bu makale için çıkar çatışması beyanı kaynak kaydında ayrıca belirtilmemiştir.",
                  ethicsApproval: "Bu makale için etik kurul onayı beyanı kaynak kaydında ayrıca belirtilmemiştir.",
                  informedConsent: "Bu makale için bilgilendirilmiş onam beyanı kaynak kaydında ayrıca belirtilmemiştir.",
                }
              : {
                  authorContributions: "A separate author-contributions statement is not available in the source record for this article.",
                  funding: "A separate funding or financial-support statement is not available in the source record for this article.",
                  competingInterests: "A separate competing-interests statement is not available in the source record for this article.",
                  ethicsApproval: "A separate ethics-approval statement is not available in the source record for this article.",
                  informedConsent: "A separate informed-consent statement is not available in the source record for this article.",
                };
            const values = {
              authorContributions: declarations?.authorContributions?.trim() || missing.authorContributions,
              funding: declarations?.funding?.trim() || inferredFunding || missing.funding,
              competingInterests: declarations?.competingInterests?.trim() || missing.competingInterests,
              ethicsApproval: declarations?.ethicsApproval?.trim() || missing.ethicsApproval,
              informedConsent: declarations?.informedConsent?.trim() || missing.informedConsent,
            };
            const definitions = locale === "tr" ? [
              ["yazar-katkilari", "Yazar Katkıları", values.authorContributions],
              ["finansman", "Finansman / Destek", values.funding],
              ["cikar-catismasi", "Çıkar Çatışması", values.competingInterests],
              ["etik-kurul", "Etik Kurul Onayı", values.ethicsApproval],
              ["bilgilendirilmis-onam", "Bilgilendirilmiş Onam", values.informedConsent],
            ] : [
              ["author-contributions", "Author Contributions", values.authorContributions],
              ["funding", "Funding / Financial Support", values.funding],
              ["competing-interests", "Competing Interests", values.competingInterests],
              ["ethics-approval", "Ethics Approval", values.ethicsApproval],
              ["informed-consent", "Informed Consent", values.informedConsent],
            ];
            return definitions.map(([id, label, value]) => ({ id, label, value }));
          }

          function ResearchStatements({ items, locale }: { items: StatementItem[]; locale: "tr" | "en" }) {
            if (!items.length) return null;
            return (
              <>
                <p className="section-kicker">{locale === "tr" ? "Beyanlar" : "Declarations"}</p>
                {items.map(({ id, label, value }) => (
                  <details className="article-accordion article-declaration-accordion" id={id} key={id}>
                    <summary><span>{label}</span><b>{locale === "tr" ? "Beyan" : "Statement"}</b></summary>
                    <div className="accordion-copy"><p>{value}</p></div>
                  </details>
                ))}
              </>
            );
          }'''
          replace(article, old_statement_fn, new_statement_fn, 1)
          replace(
              article,
              'const statements = researchStatementItems(fullText, locale);',
              'const statements = articleType === (locale === "tr" ? "Araştırma Makalesi" : "Research Article") ? researchStatementItems(fullText, locale) : [];',
              1,
          )
          replace(
              article,
              '''    ...statements.map(({ id, label }) => ({ id, label, level: 1 })),\n    ...(fullText?.figures.length ? [{ id: locale === "tr" ? "gorseller" : "visuals", label: locale === "tr" ? "Görsel ve tablolar" : "Visuals and tables", level: 1 }] : []),\n    ...(supplementary.length ? [{ id: locale === "tr" ? "ek-materyaller" : "supplementary", label: locale === "tr" ? "Ek materyaller" : "Supplementary information", level: 1 }] : []),''',
              '''    ...(fullText?.figures.length ? [{ id: locale === "tr" ? "gorseller" : "visuals", label: locale === "tr" ? "Görsel ve tablolar" : "Visuals and tables", level: 1 }] : []),\n    ...(supplementary.length ? [{ id: locale === "tr" ? "ek-materyaller" : "supplementary", label: locale === "tr" ? "Ek materyaller" : "Supplementary information", level: 1 }] : []),\n    ...statements.map(({ id, label }) => ({ id, label, level: 1 })),''',
              1,
          )
          replace(
              article,
              '''          <ResearchStatements items={statements} locale={locale} />\n          <div className="article-disclosure-stack">\n            {fullText && <ArticleFigures figures={fullText.figures} locale={locale} />}\n            {supplementary.length ? <details className="article-accordion" id={locale === "tr" ? "ek-materyaller" : "supplementary"}><summary><span>{locale === "tr" ? "Ek materyaller" : "Supplementary information"}</span><b>{supplementary.length}</b></summary><div className="supplementary-links">{supplementary.map((item) => <a href={item.url} key={`${item.title}-${item.url}`} download>{item.title}<span>↓︎</span></a>)}</div></details> : null}\n\n            <details className="article-accordion article-citation-accordion"''',
              '''          <div className="article-disclosure-stack">\n            {fullText && <ArticleFigures figures={fullText.figures} locale={locale} />}\n            {supplementary.length ? <details className="article-accordion" id={locale === "tr" ? "ek-materyaller" : "supplementary"}><summary><span>{locale === "tr" ? "Ek materyaller" : "Supplementary information"}</span><b>{supplementary.length}</b></summary><div className="supplementary-links">{supplementary.map((item) => <a href={item.url} key={`${item.title}-${item.url}`} download>{item.title}<span>↓︎</span></a>)}</div></details> : null}\n\n            <ResearchStatements items={statements} locale={locale} />\n\n            <details className="article-accordion article-citation-accordion"''',
              1,
          )

          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit site updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply TR Dizin and DOAJ site updates"
          git push
