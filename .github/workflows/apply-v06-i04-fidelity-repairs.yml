name: Apply v06-i04 fidelity repairs

on:
  push:
    branches:
      - audit/v06-i04-fulltext-fidelity
    paths:
      - tmp/v06-i04-repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v06-i04-fulltext-fidelity
          fetch-depth: 0
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Apply verified figure and poem repairs
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          root=pathlib.Path('.')
          cfg=json.loads((root/'tmp/v06-i04-caption-config.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'tmp/v06-i04-extracted/manifest.json').read_text(encoding='utf-8'))
          locmap={(x['slug'],x['locale']):x for x in manifest['locales']}
          wef='dunya-ekonomik-forumunun-kuresellesme-surecindeki-etkisinin-ekonomi-politik-elestirisi'
          for slug, locales in cfg.items():
              for locale, entries in locales.items():
                  m=locmap[(slug,locale)]
                  bypage={}
                  for img in m['images']:
                      bypage.setdefault(img['page'],[]).append(img)
                  figures=[]
                  destdir=root/'public'/'assets'/'article-figures'/slug
                  destdir.mkdir(parents=True,exist_ok=True)
                  for idx,entry in enumerate(entries,1):
                      imgs=sorted(bypage.get(entry['page'],[]),key=lambda x:x['num'])
                      if not imgs:
                          raise SystemExit(f"No image for {slug}/{locale} page {entry['page']}")
                      if slug==wef and entry['page']==10:
                          if len(imgs)!=2:
                              raise SystemExit(f"Expected 2 WEF page-10 images, got {len(imgs)}")
                          ext='.jpg'
                          dest=destdir/f'figure-{idx:02d}-{locale}{ext}'
                          subprocess.run(['convert',imgs[0]['temp_path'],imgs[1]['temp_path'],'+append',str(dest)],check=True)
                      else:
                          if len(imgs)!=1:
                              raise SystemExit(f"Expected 1 image for {slug}/{locale} page {entry['page']}, got {len(imgs)}")
                          src=root/imgs[0]['temp_path']
                          ext=src.suffix.lower()
                          dest=destdir/f'figure-{idx:02d}-{locale}{ext}'
                          shutil.copy2(src,dest)
                      if dest.stat().st_size <= 5000:
                          raise SystemExit(f'Unexpectedly small asset: {dest}')
                      figures.append({'id':f'figure-{idx}','src':'/'+dest.as_posix().removeprefix('public/'),'caption':entry['caption']})
                  ft=root/'content'/'articles'/slug/'fulltext'/f'{locale}.json'
                  data=json.loads(ft.read_text(encoding='utf-8'))
                  data['figures']=figures
                  ft.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          poem_notes={
              ('hallac-siir','en'):'Translated from Turkish to English by BRIQ (Edited by Hüseyin Haydar and Latif Bolat)',
              ('hallac-siir','tr'):'Çeviri: M. Babek',
              ('doksan-yedinci-sonnet-siir','en'):'Translated from Turkish to English by BRIQ (Edited by Hüseyin Haydar and Latif Bolat)',
          }
          for (slug,locale),note in poem_notes.items():
              ft=root/'content'/'articles'/slug/'fulltext'/f'{locale}.json'
              data=json.loads(ft.read_text(encoding='utf-8'))
              paras=data['sections'][0]['paragraphs']
              if not paras:
                  raise SystemExit(f'No poem paragraphs: {slug}/{locale}')
              last=paras[-1].strip().strip('*')
              if last!=note:
                  raise SystemExit(f'Unexpected poem footer: {slug}/{locale}: {paras[-1]}')
              data['sections'][0]['paragraphs']=paras[:-1]
              data['footnotes']=[{'id':'1','text':note}]
              ft.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run focused regression
        run: node --test tests/v6i4-fidelity-regression.test.mjs
      - name: Commit verified repairs
        run: |
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add content/articles public/assets/article-figures tests/v6i4-fidelity-regression.test.mjs
          git commit -m "fix: repair v06-i04 canonical full-text fidelity"
          git push origin HEAD:audit/v06-i04-fulltext-fidelity
