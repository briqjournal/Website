name: Capture v05-i03 figure evidence

on:
  push:
    branches:
      - chore/v05-i03-fulltext-canonical
    paths:
      - '.github/workflows/v05-i03-figure-evidence.yml'

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF and image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Download authoritative EN article PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v05-i03.json").read_text())
          out=root/"tmp/v05-i03-figure-pdfs"
          out.mkdir(parents=True,exist_ok=True)
          for slug in issue["articles"][:8]:
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              url=meta["urls"]["pdfEn"]
              p=urllib.parse.urlparse(url)
              if p.scheme!="https" or p.hostname not in {"briqjournal.com","www.briqjournal.com"}:
                  raise SystemExit(f"bad pdf url: {url}")
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              target=out/f"{slug}.pdf"
              with urllib.request.urlopen(req,timeout=60) as r, target.open("wb") as f:
                  f.write(r.read())
          PY

      - name: Extract page-aware embedded image candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re, subprocess, tempfile
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v05-i03.json").read_text())
          evidence=root/"tmp/v05-i03-figure-evidence"
          evidence.mkdir(parents=True,exist_ok=True)
          for slug in issue["articles"][:8]:
              pdf=root/"tmp/v05-i03-figure-pdfs"/f"{slug}.pdf"
              out=evidence/slug
              images=out/"images"
              images.mkdir(parents=True,exist_ok=True)
              listing=subprocess.check_output(["pdfimages","-list",str(pdf)],text=True,errors="replace")
              (out/"pdfimages-list.txt").write_text(listing,encoding="utf-8")
              rows=[]
              for line in listing.splitlines():
                  parts=line.split()
                  if len(parts)<10 or not parts[0].isdigit() or not parts[1].isdigit():
                      continue
                  try:
                      rows.append({
                          "page":int(parts[0]),
                          "num":int(parts[1]),
                          "type":parts[2],
                          "width":int(parts[3]),
                          "height":int(parts[4]),
                          "color":parts[5],
                          "comp":int(parts[6]),
                          "bpc":int(parts[7]),
                          "enc":parts[8],
                          "interp":parts[9],
                      })
                  except Exception:
                      pass
              with tempfile.TemporaryDirectory() as td:
                  prefix=pathlib.Path(td)/"image"
                  subprocess.run(["pdfimages","-png",str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  files=sorted(pathlib.Path(td).glob("image-*.png"))
                  if len(files)!=len(rows):
                      # Preserve explicit evidence if masks/alternate objects make one-to-one numbering diverge.
                      for idx,p in enumerate(files):
                          dims=subprocess.check_output(["identify","-format","%w %h",str(p)],text=True).split()
                          w,h=map(int,dims)
                          rows.append({"page":None,"num":idx,"type":"unknown","width":w,"height":h,"color":"unknown","comp":None,"bpc":None,"enc":"unknown","interp":"unknown","fallback":True})
                      rows=rows[-len(files):]
                  selected=[]
                  for row,p in zip(rows,files):
                      w,h=row["width"],row["height"]
                      if w*h < 100000 or min(w,h)<180:
                          continue
                      name=f"p{row['page'] or 0:02d}-n{row['num']:03d}.jpg"
                      subprocess.run(["convert",str(p),"-strip","-quality","88",str(images/name)],check=True)
                      selected.append({**row,"file":name})
                  (out/"manifest.json").write_text(json.dumps(selected,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          rm -rf tmp/v05-i03-figure-pdfs

      - name: Commit figure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i03-figure-evidence
          git commit -m 'Capture v05-i03 page-aware figure evidence'
          git pull --rebase origin chore/v05-i03-fulltext-canonical
          git push origin HEAD:chore/v05-i03-fulltext-canonical
