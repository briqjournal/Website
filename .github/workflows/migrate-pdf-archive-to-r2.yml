name: Migrate PDF archive to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briq-r2-pdf-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy and verify PDF archive
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MANIFEST_PATH: public/assets/archive/pdfs/manifest.json
      MIGRATION_DIR: .r2-migration

    steps:
      - name: Check out repository and Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify configuration and materialize LFS files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          required = (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "R2_ENDPOINT",
              "R2_BUCKET",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required repository secrets: " + ", ".join(missing))
          print("All required R2 settings are available.")
          PY
          aws --version
          git lfs version
          git lfs pull --include="*.pdf" --exclude=""
          git lfs checkout

      - name: Validate repository PDFs against the manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MIGRATION_DIR"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path.cwd().resolve()
          public_root = (root / "public").resolve()
          manifest_path = (root / os.environ["MANIFEST_PATH"]).resolve()
          output_dir = (root / os.environ["MIGRATION_DIR"]).resolve()

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = manifest.get("files")
          if not isinstance(records, list):
              raise SystemExit("Manifest field 'files' is missing or is not a list.")

          declared_count = manifest.get("unique_files")
          if declared_count != len(records):
              raise SystemExit(
                  f"Manifest count mismatch: unique_files={declared_count}, files={len(records)}"
              )

          expected = {}
          errors = []

          for index, record in enumerate(records, start=1):
              local = record.get("local")
              expected_size = record.get("bytes")
              expected_hash = record.get("sha256")

              if not isinstance(local, str) or not local.startswith("/assets/"):
                  errors.append(f"Manifest row {index}: invalid local path: {local!r}")
                  continue

              key = local.lstrip("/")
              if not key.lower().endswith(".pdf"):
                  errors.append(f"Manifest row {index}: path is not a PDF: {local}")
                  continue

              source = (public_root / key).resolve()
              if source != public_root and public_root not in source.parents:
                  errors.append(f"Manifest row {index}: path escapes public/: {local}")
                  continue

              if key in expected:
                  errors.append(f"Duplicate manifest object key: {key}")
                  continue

              expected[key] = {
                  "source": source.relative_to(root).as_posix(),
                  "bytes": expected_size,
                  "sha256": expected_hash,
              }

          repository_pdfs = {
              path.relative_to(public_root).as_posix(): path
              for path in public_root.rglob("*")
              if path.is_file() and path.suffix.lower() == ".pdf"
          }

          missing_from_checkout = sorted(set(expected) - set(repository_pdfs))
          unmanifested_pdfs = sorted(set(repository_pdfs) - set(expected))

          for key in missing_from_checkout:
              errors.append(f"Manifest PDF missing from checkout: {key}")
          for key in unmanifested_pdfs:
              errors.append(f"Repository PDF missing from manifest: {key}")

          for key in sorted(set(expected) & set(repository_pdfs)):
              source = repository_pdfs[key]
              details = expected[key]

              with source.open("rb") as handle:
                  header = handle.read(1024)
              if b"%PDF-" not in header:
                  errors.append(f"Git LFS content was not materialized as a PDF: {key}")
                  continue

              actual_size = source.stat().st_size
              if not isinstance(details["bytes"], int) or actual_size != details["bytes"]:
                  errors.append(
                      f"Size mismatch for {key}: manifest={details['bytes']}, checkout={actual_size}"
                  )
                  continue

              digest = hashlib.sha256()
              with source.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual_hash = digest.hexdigest()
              if actual_hash != details["sha256"]:
                  errors.append(
                      f"SHA-256 mismatch for {key}: manifest={details['sha256']}, checkout={actual_hash}"
                  )

          if errors:
              print("Repository validation failed:")
              for error in errors:
                  print(f" - {error}")
              raise SystemExit(1)

          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "expected.json").write_text(
              json.dumps(expected, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          directory_counts = Counter(key.rsplit("/", 1)[0] for key in expected)
          print(f"Validated {len(expected)} manifest PDFs and their SHA-256 checksums.")
          for directory, count in sorted(directory_counts.items()):
              print(f" - {directory}: {count}")
          PY

      - name: Copy PDF archive to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync public/assets "s3://$R2_BUCKET/assets" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.pdf" \
            --no-progress \
            --only-show-errors

      - name: List and verify R2 objects
        shell: bash
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > "$MIGRATION_DIR/r2-objects.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          migration_dir = Path(os.environ["MIGRATION_DIR"])
          expected = json.loads((migration_dir / "expected.json").read_text(encoding="utf-8"))
          listing = json.loads((migration_dir / "r2-objects.json").read_text(encoding="utf-8"))

          objects = {
              item["Key"]: int(item["Size"])
              for item in listing.get("Contents", [])
              if isinstance(item, dict) and "Key" in item and "Size" in item
          }

          expected_keys = set(expected)
          pdf_keys = {key for key in objects if key.lower().endswith(".pdf")}
          missing = sorted(expected_keys - set(objects))
          size_mismatches = sorted(
              key
              for key in expected_keys & set(objects)
              if objects[key] != expected[key]["bytes"]
          )
          extra_pdfs = sorted(pdf_keys - expected_keys)
          verified_count = len(expected_keys) - len(missing) - len(size_mismatches)

          lines = [
              "# Cloudflare R2 PDF migration verification",
              "",
              f"- Manifest PDF paths: {len(expected_keys)}",
              f"- R2 objects: {len(objects)}",
              f"- R2 PDF objects: {len(pdf_keys)}",
              f"- Manifest PDFs found with matching size: {verified_count}",
              f"- Missing manifest paths: {len(missing)}",
              f"- Size mismatches: {len(size_mismatches)}",
              f"- Additional R2 PDFs outside the manifest: {len(extra_pdfs)}",
              "",
          ]

          if missing:
              lines.extend(["## Missing paths", ""])
              lines.extend(f"- `{key}`" for key in missing)
              lines.append("")

          if size_mismatches:
              lines.extend(["## Size mismatches", ""])
              lines.extend(
                  f"- `{key}`: expected {expected[key]['bytes']} bytes, found {objects[key]} bytes"
                  for key in size_mismatches
              )
              lines.append("")

          if extra_pdfs:
              lines.extend(["## Additional PDF paths in R2", ""])
              lines.extend(f"- `{key}`" for key in extra_pdfs)
              lines.append("")

          report = "\n".join(lines)
          (migration_dir / "verification-summary.md").write_text(
              report + "\n", encoding="utf-8"
          )
          print(report)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(report + "\n")

          if missing or size_mismatches:
              raise SystemExit(
                  "R2 verification failed. See the missing paths and size mismatches above."
              )

          if verified_count != len(expected_keys):
              raise SystemExit("R2 verification did not cover every manifest PDF.")

          print("R2 migration verified successfully: every manifest PDF is present.")
          PY

      - name: Upload migration verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-pdf-migration-verification
          path: .r2-migration/
          if-no-files-found: warn
          retention-days: 30
