name: Inspect Iratni PDF extraction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-iratni-pdf.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect PDF layout and heading spans
        run: |
          python -m pip install --quiet pymupdf
          curl -L --fail --retry 3 'https://www.briqjournal.com/sites/default/files/yazi-ici-dosyalar/2025-06/Belkacem%20Iratni_ENG.pdf' -o /tmp/iratni.pdf
          python <<'PY'
          import fitz
          doc=fitz.open('/tmp/iratni.pdf')
          print('PAGES', len(doc))
          for pno,page in enumerate(doc):
              d=page.get_text('dict', flags=fitz.TEXT_DEHYPHENATE | fitz.TEXT_PRESERVE_WHITESPACE)
              cands=[]
              for block in d['blocks']:
                  if 'lines' not in block: continue
                  for line in block['lines']:
                      text=''.join(s['text'] for s in line['spans']).strip()
                      if not text: continue
                      maxsize=max(s['size'] for s in line['spans'])
                      fonts=','.join(sorted(set(s['font'] for s in line['spans'])))
                      if maxsize >= 11.0 or ('Bold' in fonts and len(text)<120):
                          cands.append((line['bbox'][0],line['bbox'][1],maxsize,fonts,text))
              print(f'--- PAGE {pno+1} ---')
              for x,y,sz,font,text in cands:
                  print(f'{x:.1f}\t{y:.1f}\t{sz:.1f}\t{font}\t{text}')
              if pno in (1,2,3,4,10,19,20,21):
                  print('BLOCKS')
                  blocks=page.get_text('blocks', flags=fitz.TEXT_DEHYPHENATE | fitz.TEXT_PRESERVE_WHITESPACE)
                  for b in blocks:
                      x0,y0,x1,y1,text,*_=b
                      t=' | '.join(q.strip() for q in text.splitlines() if q.strip())
                      print(f'B {x0:.1f},{y0:.1f},{x1:.1f},{y1:.1f}: {t[:600]}')
          PY
      - name: Remove inspection workflow
        run: |
          rm .github/workflows/inspect-iratni-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-iratni-pdf.yml
          git commit -m 'Remove one-time Iratni PDF inspection workflow'
          git pull --rebase origin main
          git push origin HEAD:main
