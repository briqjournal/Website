name: Check Saudi English PDF in R2

on:
  push:
    paths:
      - ".github/workflows/check-saudi-r2.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Search R2 for Saudi / Dhafeeire PDFs
        shell: bash
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" --output json > /tmp/r2.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/r2.json'))
          rows=[]
          for x in data.get('Contents',[]):
              k=x.get('Key','')
              lk=k.lower()
              if any(t in lk for t in ('saudi','dhafeeire','suudi-arabistanin-abd-ile-cin')):
                  rows.append((k,x.get('Size')))
          print('MATCH_COUNT',len(rows))
          for k,s in rows:
              print(f'{s}\t{k}')
          PY
