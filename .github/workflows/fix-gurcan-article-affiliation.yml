name: One-time Gurcan article affiliation fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-gurcan-article-affiliation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add article-specific author affiliation support
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          slug = 'amerika-sonrasi-donemde-adil-bir-dunya-duzeni-insa-etmek'
          meta_path = Path('content/articles') / slug / 'metadata.json'
          data = json.loads(meta_path.read_text(encoding='utf-8'))
          data['author_affiliations'] = [{
              'name': 'Efe Can Gürcan',
              'tr': 'İstinye Üniversitesi, Uluslararası İlişkiler Bölümü',
              'en': 'Department of International Relations, İstinye University',
          }]
          meta_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          archive_path = Path('app/archive.ts')
          archive = archive_path.read_text(encoding='utf-8')
          needle = '  orcids?: string[];\n'
          addition = '''  author_affiliations?: {\n    name: string;\n    tr?: string | null;\n    en?: string | null;\n  }[];\n'''
          if addition not in archive:
              if needle not in archive:
                  raise SystemExit('ArchiveArticle ORCID field marker not found')
              archive = archive.replace(needle, needle + addition, 1)
              archive_path.write_text(archive, encoding='utf-8')

          platform_path = Path('app/components/ArticlePlatform.tsx')
          platform = platform_path.read_text(encoding='utf-8')
          old = '''        const email = authorEmail(name);\n        const person = isPersonByline(name);\n        return ('''
          new = '''        const email = authorEmail(name);\n        const person = isPersonByline(name);\n        const storedAffiliation = article.author_affiliations?.find((entry) => authorId(entry.name) === authorId(name));\n        const articleAffiliation = locale === "tr" ? storedAffiliation?.tr : storedAffiliation?.en;\n        return ('''
          if 'const storedAffiliation = article.author_affiliations?' not in platform:
              if old not in platform:
                  raise SystemExit('ArticleAuthors insertion marker not found')
              platform = platform.replace(old, new, 1)
          old_line = '              <small>{authorAffiliation(name, locale)}</small>'
          new_line = '              <small>{articleAffiliation?.trim() || authorAffiliation(name, locale)}</small>'
          if old_line in platform:
              platform = platform.replace(old_line, new_line, 1)
          elif new_line not in platform:
              raise SystemExit('Article author affiliation render marker not found')
          platform_path.write_text(platform, encoding='utf-8')
          PY
          rm .github/workflows/fix-gurcan-article-affiliation.yml
          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'
          git add content/articles/amerika-sonrasi-donemde-adil-bir-dunya-duzeni-insa-etmek/metadata.json app/archive.ts app/components/ArticlePlatform.tsx .github/workflows/fix-gurcan-article-affiliation.yml
          git commit -m 'Use publication-time affiliation on Gürcan article'
          git push origin HEAD:main
