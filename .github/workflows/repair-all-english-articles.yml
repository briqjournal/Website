name: Publish verified English article PDFs and full text

on:
  push:
    paths:
      - ".github/workflows/repair-all-english-articles.yml"

permissions:
  contents: write

concurrency:
  group: briq-publish-ready-english-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and verify PDF tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m py_compile scripts/repair-english-article-archive.py scripts/publish-ready-english-articles.py
          aws --version

      - name: Download, render-check, extract and prepare 234 verified English articles
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/publish-ready-english-articles.py 2>&1 | tee /tmp/english-ready.log
          status=${PIPESTATUS[0]}
          if [ -f tmp/english-ready-report.json ]; then
            echo "----- publish report -----"
            cat tmp/english-ready-report.json
          fi
          exit "$status"

      - name: Validate generated mappings, full text, visual sharing and categories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          unresolved = {
              "kulturel-ozguveni-percinleyelim",
              "bes-deniz-stratejisini-canlandirmak-mumkun-mu",
              "turkiye-ve-cinin-degisen-deniz-jeopolitiginin-neo-mahanci-bir-okumasi",
              "mavi-vatan-doktrini-nasil-olustu",
              "mare-nostrumdan-denizlerde-uluslararasi-isbirligine-tarih-akdenizin-gelecegi-ile-ilgili",
              "gaz-hidratlar-yakin-gelecegin-enerji-kaynagi",
              "karabag-baslangictan-gunumuze-sorunlar-ve-cozumler",
          }
          data = json.loads(Path('app/archive-data.json').read_text(encoding='utf-8'))
          full = json.loads(Path('app/article-fulltext-en-archive.json').read_text(encoding='utf-8'))
          report = json.loads(Path('tmp/english-ready-report.json').read_text(encoding='utf-8'))
          assert report['phase'] == 'complete'
          assert report['published_english_pdfs'] == 234, report['published_english_pdfs']
          assert report['published_fulltexts'] == 234, report['published_fulltexts']
          assert len(full) == 234, len(full)
          assert not (unresolved & set(full)), sorted(unresolved & set(full))

          by_slug = {article['slug']: article for article in data['articles']}
          for slug in full:
              article = by_slug[slug]
              assert article.get('pdf_en_local') == f'/assets/archive/pdfs/articles/{slug}-en.pdf', slug
              assert article.get('pdf_en_source'), slug
              assert article.get('source_en'), slug

          visual_pattern = re.compile(r'fotoğraf|photograph|karikatür|cartoon|(?:^|\W)afiş(?:\W|$)|poster|(?:^|\W)resim(?:\W|$)|tablosu|painting|visual contribution', re.I)
          for article in data['articles']:
              hay = ' '.join(str(article.get(k) or '') for k in ('slug','title_tr','title_en','citation_tr','citation_en','abstract_tr','abstract_en')).lower()
              if visual_pattern.search(hay) and article.get('shared_bilingual_pdf'):
                  if article.get('pdf_tr_local'):
                      assert article.get('pdf_en_local') == article.get('pdf_tr_local'), article['slug']

          archive_ts = Path('app/archive.ts').read_text(encoding='utf-8')
          assert 'return label("Araştırma Makalesi", "Research Article");' in archive_ts
          assert 'Hakemli Makale' not in archive_ts
          assert 'Peer-reviewed Article' not in archive_ts

          tr_route = Path('app/[...slug]/page.tsx').read_text(encoding='utf-8')
          en_route = Path('app/en/[...slug]/page.tsx').read_text(encoding='utf-8')
          assert 'publicationType(publication, "tr")' in tr_route
          assert 'publicationType(publication, "en")' in en_route
          print('Validated 234 English PDFs/full texts, shared visual PDFs, and publication category labels.')
          PY
          git diff --check

      - name: Build site
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload 234 verified English PDFs to R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync tmp/english-pdf-ready/ "s3://$R2_BUCKET/assets/archive/pdfs/articles/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*-en.pdf" \
            --content-type application/pdf \
            --only-show-errors

          count=0
          while IFS=$'\t' read -r local_file key expected_size expected_sha; do
            [ -n "$key" ] || continue
            remote_size="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
            if [ "$remote_size" != "$expected_size" ]; then
              echo "R2 size mismatch for $key: local=$expected_size remote=$remote_size" >&2
              exit 1
            fi
            count=$((count + 1))
            if (( count % 25 == 0 )); then echo "Verified $count R2 English PDFs"; fi
          done < tmp/english-ready-upload.tsv
          test "$count" -eq 234
          echo "Verified all $count English PDFs in R2."

      - name: Commit English archive and category changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRIQ Archive Bot"
          git config user.email "briq@briqjournal.com"
          git add \
            app/archive-data.json \
            app/article-fulltext-en-archive.json \
            app/components/ArticlePlatform.tsx \
            app/archive.ts \
            'app/[...slug]/page.tsx' \
            'app/en/[...slug]/page.tsx' \
            public/assets/archive/pdfs/manifest.json \
            scripts/publish-ready-english-articles.py
          git diff --cached --check
          git commit -m "Publish verified English article archive"
          git push origin HEAD:main
