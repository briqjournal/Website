name: Repair all English article PDFs and full text

on:
  push:
    paths:
      - ".github/workflows/repair-all-english-articles.yml"

permissions:
  contents: write

concurrency:
  group: briq-repair-all-english-articles
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m py_compile scripts/repair-english-article-archive.py
          aws --version

      - name: Exclude non-text visual contributions from article repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/repair-english-article-archive.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'SAUDI_SLUG = "suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi"\n'
          addition = '''SAUDI_SLUG = "suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi"\nNON_TEXT_VISUAL_SLUGS = {\n    "yangisardaki-comlek-atolyesinin-avlusu",\n    "karikatur-1",\n    "turhan-selcuk-karikaturu",\n    "askin-ayrancioglu",\n}\n'''
          if 'NON_TEXT_VISUAL_SLUGS = {' not in text:
              assert anchor in text
              text = text.replace(anchor, addition, 1)

          old = '''    articles = data.get("articles", [])\n    print(f"Discovering English sources for {len(articles)} article records", flush=True)\n    discovered: list[dict[str, Any]] = []\n    discovery_failures: list[dict[str, str]] = []\n    for index, article in enumerate(articles, start=1):\n'''
          new = '''    articles = data.get("articles", [])\n    targets = [article for article in articles if article.get("slug") not in NON_TEXT_VISUAL_SLUGS]\n    print(\n        f"Discovering English sources for {len(targets)} text article records "\n        f"({len(articles) - len(targets)} non-text visual records excluded)",\n        flush=True,\n    )\n    discovered: list[dict[str, Any]] = []\n    discovery_failures: list[dict[str, str]] = []\n    for index, article in enumerate(targets, start=1):\n'''
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace(
              'if index % 25 == 0 or index == len(articles):\n            print(f"Discovery {index}/{len(articles)}; ok={len(discovered)} failures={len(discovery_failures)}", flush=True)',
              'if index % 25 == 0 or index == len(targets):\n            print(f"Discovery {index}/{len(targets)}; ok={len(discovered)} failures={len(discovery_failures)}", flush=True)',
          )
          text = text.replace(
              '"total_articles": len(articles), "discovered": len(discovered)',
              '"total_articles": len(targets), "discovered": len(discovered)',
          )
          text = text.replace(
              'jobs = [by_slug[article["slug"]] for article in articles]',
              'jobs = [by_slug[article["slug"]] for article in targets]',
          )
          text = text.replace(
              '"total_articles": len(articles), "succeeded": len(results)',
              '"total_articles": len(targets), "succeeded": len(results)',
          )
          text = text.replace(
              '    for article in articles:\n        item = result_by_slug[article["slug"]]',
              '    for article in targets:\n        item = result_by_slug[article["slug"]]',
          )
          text = text.replace(
              '"total_articles": len(articles),\n        "english_pages": len(discovered),',
              '"total_articles": len(targets),\n        "excluded_non_text_visual_records": sorted(NON_TEXT_VISUAL_SLUGS),\n        "english_pages": len(discovered),',
          )

          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/repair-english-article-archive.py
          git diff --check

      - name: Discover, download, render-check and extract every English article
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/repair-english-article-archive.py 2>&1 | tee /tmp/english-repair.log
          status=${PIPESTATUS[0]}
          if [ -f tmp/english-pdf-repair-report.json ]; then
            echo "----- repair report -----"
            cat tmp/english-pdf-repair-report.json
          fi
          exit "$status"

      - name: Validate generated archive data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          excluded = {
              'yangisardaki-comlek-atolyesinin-avlusu',
              'karikatur-1',
              'turhan-selcuk-karikaturu',
              'askin-ayrancioglu',
          }
          data = json.loads(Path('app/archive-data.json').read_text(encoding='utf-8'))
          full = json.loads(Path('app/article-fulltext-en-archive.json').read_text(encoding='utf-8'))
          articles = data['articles']
          targets = [article for article in articles if article['slug'] not in excluded]
          assert len(full) == len(targets), (len(full), len(targets))
          missing = []
          wrong = []
          for article in targets:
              slug = article['slug']
              if not article.get('source_en') or not article.get('pdf_en_source') or not article.get('pdf_en_local'):
                  missing.append(slug)
              if article.get('pdf_en_local') != f'/assets/archive/pdfs/articles/{slug}-en.pdf':
                  wrong.append(slug)
              record = full.get(slug)
              if not record or not record.get('sections'):
                  missing.append(f'{slug}:fulltext')
          assert not missing, missing[:20]
          assert not wrong, wrong[:20]
          print(f'Validated {len(targets)} English text-publication mappings and {len(full)} full-text records; {len(excluded)} non-text visual contributions excluded.')
          PY
          git diff --check

      - name: Build site with English full text
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload exact English article PDFs to R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync tmp/english-pdf-sync/ "s3://$R2_BUCKET/assets/archive/pdfs/articles/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*-en.pdf" \
            --content-type application/pdf \
            --only-show-errors

          count=0
          while IFS=$'\t' read -r local_file key expected_size expected_sha; do
            [ -n "$key" ] || continue
            remote_size="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
            if [ "$remote_size" != "$expected_size" ]; then
              echo "R2 size mismatch for $key: local=$expected_size remote=$remote_size" >&2
              exit 1
            fi
            count=$((count + 1))
            if (( count % 25 == 0 )); then echo "Verified $count R2 English PDFs"; fi
          done < tmp/english-pdf-upload.tsv
          echo "Verified all $count English PDFs in R2."

      - name: Commit archive mappings and full text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRIQ Archive Bot"
          git config user.email "briq@briqjournal.com"
          git add \
            app/archive-data.json \
            app/article-fulltext-en-archive.json \
            app/components/ArticlePlatform.tsx \
            public/assets/archive/pdfs/manifest.json \
            scripts/repair-english-article-archive.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "English article archive is already current."
            exit 0
          fi
          git commit -m "Repair all English article PDFs and full text"
          git push origin HEAD:main
