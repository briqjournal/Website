name: Migrate V6I3 canonical
on:
  push:
    branches: [migration/v6i3-canonical]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize Volume 6 Issue 3 canonical migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install extraction dependencies
        run: python3 -m pip install --quiet pymupdf pymupdf4llm
      - name: Rebuild Volume 6 Issue 3 from printed PDFs
        run: |
          for slug in china-reconstructs hendra-gunawan endonezya-posta-pulu; do mkdir -p "content/articles/$slug/fulltext"; done
          python3 scripts/migrate-v6i3-canonical.py
      - name: Regenerate site data
        run: |
          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs
      - name: Run Volume 6 Issue 3 integrity tests
        run: node --test tests/v6i3-content-integrity.test.mjs
      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content app public/assets/article-figures tests scripts/migrate-v6i3-canonical.py
          git status --short
          git commit -m "Finalize Volume 6 Issue 3 canonical migration"
          git push origin HEAD:migration/v6i3-canonical
