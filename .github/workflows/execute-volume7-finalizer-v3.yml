name: Execute Volume 7 Finalizer V3
on:
  push:
    branches: [fix/volume7-canonical-finalization]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute source-safe finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/finalize-volume7-canonical.yml').read_text()
          marker='        run: |\n'
          body=src.split(marker,1)[1]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          body='\n'.join(lines)+'\n'

          # Preserve parenthesized access-date prose outside URLs.
          body=body.replace(r'/\s+(?:adresinden|adresine)\b/iu', r'/\s+\(?(?:adresinden|adresine)\b/iu')
          body=body.replace(r'/\s+(?:erişim tarihi|erişildi|erişim)\b/iu', r'/\s+\(?(?:erişim tarihi|erişildi|erişim)\b/iu')

          # Source-verified Turkish keyword counterpart for the Zarifullin interview.
          old='const override=bilingualKeywordParityOverrides.get(slug);'
          new="const override=bilingualKeywordParityOverrides.get(slug) || (slug==='yagmalanan-iskit-altinlarinin-mirasi' ? { tr:['Röportaj','İskitler','Dünya Kültür Mirası'], en:['Interview','Scythian','Cultural Heritage'] } : undefined);"
          if old not in body:
              raise SystemExit('override insertion point not found')
          body=body.replace(old,new)

          # The Mao regression test still expected the pre-reviewed English ordering.
          needle='            npm test\n'
          patch="""            python - <<'PY2'\n            from pathlib import Path\n            p=Path('tests/mao-english-fulltext.test.mjs')\n            s=p.read_text()\n            old='[\\\"Dialectics\\\", \\\"Mao Zedong\\\", \\\"Mao Zedong Thought\\\", \\\"Mass Line\\\", \\\"Political Subject\\\", \\\"Traditional Chinese Thought\\\"]'\n            new='[\\\"Dialectics\\\", \\\"Traditional Chinese Thought\\\", \\\"Mass Line\\\", \\\"Mao Zedong\\\", \\\"Mao Zedong Thought\\\", \\\"Political Subject\\\"]'\n            if old not in s:\n                raise SystemExit('Mao expected keyword order not found')\n            p.write_text(s.replace(old,new))\n            PY2\n            npm test\n"""
          if needle not in body:
              raise SystemExit('npm test insertion point not found')
          body=body.replace(needle,patch,1)

          Path('/tmp/run-volume7-finalizer-v3.sh').write_text(body)
          PY
          bash /tmp/run-volume7-finalizer-v3.sh
