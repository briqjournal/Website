name: Diagnose live Comak inline table

on:
  push:
    branches:
      - diagnose/comak-live-inline-table
    paths:
      - ".github/workflows/diagnose-comak-live.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check regular and cache-bypass live HTML
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://briqjournal.com/en/articles/power-transition-and-geoeconomic-connectivity-in-eurasia-on-the-55th-anniversary-of-turkiye-china-diplomatic-relations/'
          for MODE in regular bypass; do
            if [ "$MODE" = bypass ]; then
              URL="${BASE}?diagnostic=802ddecee78a4752b556237ed38cb01afe7d7241"
              EXTRA=(-H 'Cache-Control: no-cache' -H 'Pragma: no-cache')
            else
              URL="$BASE"
              EXTRA=()
            fi
            curl --fail --location --compressed --retry 2 \
              -A 'Mozilla/5.0 BRIQ deployment diagnostic' \
              "${EXTRA[@]}" -D "/tmp/${MODE}-headers.txt" "$URL" -o "/tmp/${MODE}.html"
            echo "=== $MODE HEADERS ==="
            grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|age:|etag:|last-modified:|cache-control:)' "/tmp/${MODE}-headers.txt" || true
            echo "=== $MODE MARKERS ==="
            printf 'inline='; grep -o 'article-inline-table' "/tmp/${MODE}.html" | wc -l
            printf 'table1='; grep -o 'id="table-1"' "/tmp/${MODE}.html" | wc -l
            printf 'table2='; grep -o 'id="table-2"' "/tmp/${MODE}.html" | wc -l
            printf 'visual3='; grep -o 'figure-03-en.png' "/tmp/${MODE}.html" | wc -l
            printf 'visual4='; grep -o 'figure-04-en.png' "/tmp/${MODE}.html" | wc -l
          done
