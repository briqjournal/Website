name: Audit v06-i03 full-text fidelity

on:
  push:
    branches:
      - audit/v06-i03-fulltext-fidelity
    paths:
      - tmp/v06-i03-audit-trigger.txt

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v06-i03-fulltext-fidelity
          fetch-depth: 0
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run reusable issue audit
        run: python3 scripts/audit-fulltext-fidelity.py v06-i03
      - name: Capture compact evidence
        run: |
          mkdir -p tmp/v06-i03-fidelity/pdfimages
          cp .audit/fulltext-fidelity/v06-i03/report.json tmp/v06-i03-fidelity/report.json
          cp .audit/fulltext-fidelity/v06-i03/report.md tmp/v06-i03-fidelity/report.md
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.audit/fulltext-fidelity/v06-i03')
          report=json.loads((root/'report.json').read_text())
          full_page_records={'sahte-siir','39-harbi','china-reconstructs','hendra-gunawan','endonezya-posta-pulu'}
          compact={'issue':report['issue'],'records':report['records'],'locales':[]}
          evidence={}
          for r in report['locales']:
              row={k:r.get(k) for k in [
                  'slug','locale','status','pdf_url','pdf_pages','canonical_paragraphs',
                  'canonical_references','canonical_figures','canonical_tokens','pdf_extracted_tokens',
                  'paragraph_match_ratio','heading_match_ratio','reference_match_ratio',
                  'footnote_match_ratio','figure_caption_match_ratio','first_anchor','last_anchor',
                  'headings','unmatched_paragraphs','nonmonotonic_assignments','duplicate_paragraphs',
                  'turkish_contamination_candidates','cross_record_title_candidates',
                  'references_low_match','footnotes_low_match','duplicate_footnote_ids',
                  'empty_sections','short_sections','metadata_leakage_candidates',
                  'figure_caption_matches','figure_captions_low_match',
                  'published_visual_label_candidates','missing_figure_assets','rendered_pages'
              ]}
              compact['locales'].append(row)
              if r.get('status') == 'article_pdf_unavailable':
                  continue
              pages=set(r.get('rendered_pages') or [])
              pages.update(x.get('page') for x in (r.get('published_visual_label_candidates') or []) if x.get('page'))
              if r['slug'] in full_page_records:
                  pages.update(range(1,(r.get('pdf_pages') or 0)+1))
              locdir=root/r['slug']/r['locale']/'pages'
              evidence[f"{r['slug']}::{r['locale']}"]={}
              for p in sorted(pages):
                  f=locdir/f"p{p:03}.txt"
                  if f.exists():
                      evidence[f"{r['slug']}::{r['locale']}"][str(p)]=f.read_text(encoding='utf-8')
          out=pathlib.Path('tmp/v06-i03-fidelity')
          (out/'compact.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'page-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          find .audit/fulltext-fidelity/v06-i03 -type f -name '*.pdf' -print0 | while IFS= read -r -d '' pdf; do
            slug="$(basename "$pdf")"
            pdfimages -list "$pdf" > "tmp/v06-i03-fidelity/pdfimages/${slug%.pdf}.txt" || true
          done
      - name: Commit audit evidence
        run: |
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add -f tmp/v06-i03-fidelity
          git commit -m "chore: capture v06-i03 fidelity audit evidence"
          git push origin HEAD:audit/v06-i03-fulltext-fidelity
