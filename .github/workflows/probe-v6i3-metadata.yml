name: Probe V6I3 Source Metadata
on:
  push:
    branches: [migration/v6i3-canonical]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract front and back matter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pymupdf pymupdf4llm
          python3 <<'PY'
          import json, pathlib, urllib.request, pymupdf, pymupdf4llm
          slugs=json.load(open('content/issues/v06-i03.json'))['articles'][:6]
          for slug in slugs:
            m=json.load(open(pathlib.Path('content/articles')/slug/'metadata.json'))
            print('\n########',slug,'########')
            for loc,key in [('en','pdfEn'),('tr','pdfTr')]:
              url=m['urls'].get(key)
              if not url: continue
              p=f'/tmp/{slug}-{loc}.pdf'; urllib.request.urlretrieve(url,p)
              d=pymupdf.open(p); pages=sorted(set([0,1,max(0,d.page_count-3),max(0,d.page_count-2),d.page_count-1]))
              md=pymupdf4llm.to_markdown(p,pages=pages,write_images=False,ignore_images=False)
              print('\n---',loc,'pages',pages,'---\n',md[:30000])
          PY