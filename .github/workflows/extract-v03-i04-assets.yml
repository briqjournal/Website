name: Extract v03-i04 exact PDF assets

on:
  push:
    branches:
      - chore/v03-i04-fulltext-canonical
    paths:
      - .github/workflows/extract-v03-i04-assets.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF/image tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils imagemagick >/dev/null

      - name: Download verified official full-issue PDFs
        run: |
          mkdir -p tmp/v03-i04-assets
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-en.pdf' \
            -o tmp/v03-i04-assets/en.pdf
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-tr.pdf' \
            -o tmp/v03-i04-assets/tr.pdf
          pdfinfo tmp/v03-i04-assets/en.pdf | grep '^Pages:'
          pdfinfo tmp/v03-i04-assets/tr.pdf | grep '^Pages:'

      - name: Extract exact embedded production rasters
        shell: bash
        run: |
          set -euo pipefail

          extract_range() {
            local locale="$1" pdf="$2" first="$3" last="$4" expected="$5" slug="$6"
            local raw="tmp/v03-i04-assets/raw-${slug}-${locale}"
            local out="public/assets/article-figures/${slug}"
            rm -rf "$raw"
            mkdir -p "$raw" "$out"

            pdfimages -f "$first" -l "$last" -all "$pdf" "$raw/img"

            local list="$raw/candidates.tsv"
            : > "$list"
            declare -A seen=()

            for f in "$raw"/img-*; do
              [ -f "$f" ] || continue
              local geom w h size hash num
              geom="$(identify -format '%w %h' "$f" 2>/dev/null || true)"
              [ -n "$geom" ] || continue
              read -r w h <<<"$geom"
              size="$(stat -c '%s' "$f")"
              # Exclude logos, tiny decorations, masks and incidental UI graphics.
              if (( w < 300 || h < 180 || size < 10000 )); then
                continue
              fi
              hash="$(sha256sum "$f" | awk '{print $1}')"
              [ -z "${seen[$hash]+x}" ] || continue
              seen[$hash]=1
              num="$(basename "$f" | sed -E 's/^img-([0-9]+).*/\1/')"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$num" "$w" "$h" "$size" "$hash" "$f" >> "$list"
            done

            sort -n -k1,1 -o "$list" "$list"
            local count
            count="$(wc -l < "$list" | tr -d ' ')"
            echo "::group::${slug} ${locale}: ${count} candidates, expected ${expected}"
            cat "$list"
            echo "::endgroup::"

            # Diagnostic pass: enumerate all qualifying embedded production rasters.
            # No repository files are written in this pass; selection is verified from the manifest first.
            true
          }

          EN=tmp/v03-i04-assets/en.pdf
          TR=tmp/v03-i04-assets/tr.pdf

          # Printed page ranges map to physical PDF pages with +2 in EN and +1 in TR.
          extract_range en "$EN" 8 16 1 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz
          extract_range tr "$TR" 7 15 1 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz

          extract_range en "$EN" 30 51 19 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin
          extract_range tr "$TR" 29 50 19 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin

          extract_range en "$EN" 52 63 4 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme
          extract_range tr "$TR" 51 62 4 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme

          extract_range en "$EN" 64 76 13 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri
          extract_range tr "$TR" 63 75 13 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri

          extract_range en "$EN" 78 91 10 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi
          extract_range tr "$TR" 77 90 10 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi

          extract_range en "$EN" 92 94 1 guc-zayifliktir
          extract_range tr "$TR" 91 93 1 guc-zayifliktir

          extract_range en "$EN" 95 95 1 yangin-merdiveni
          extract_range tr "$TR" 94 94 1 yangin-merdiveni
          extract_range en "$EN" 96 96 1 simitci
          extract_range tr "$TR" 95 95 1 simitci
          extract_range en "$EN" 97 97 1 uygarligin-ipek-yolu
          extract_range tr "$TR" 96 96 1 uygarligin-ipek-yolu

      - name: Verify diagnostic pass wrote no repository files
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
