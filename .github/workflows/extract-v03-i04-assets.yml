name: Extract v03-i04 exact PDF assets

on:
  push:
    branches:
      - chore/v03-i04-fulltext-canonical
    paths:
      - .github/workflows/extract-v03-i04-assets.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF/image tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils imagemagick >/dev/null

      - name: Download verified official full-issue PDFs
        run: |
          set -euo pipefail
          mkdir -p tmp/v03-i04-assets
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-en.pdf' \
            -o tmp/v03-i04-assets/en.pdf
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-tr.pdf' \
            -o tmp/v03-i04-assets/tr.pdf
          test "$(pdfinfo tmp/v03-i04-assets/en.pdf | awk '/^Pages:/ {print $2}')" = "98"
          test "$(pdfinfo tmp/v03-i04-assets/tr.pdf | awk '/^Pages:/ {print $2}')" = "97"

      - name: Extract qualifying embedded production rasters
        shell: bash
        run: |
          set -euo pipefail

          extract_range() {
            locale="$1"; pdf="$2"; first="$3"; last="$4"; slug="$5"
            raw="tmp/v03-i04-assets/raw/${slug}/${locale}"
            out="tmp/v03-i04-assets/export/${slug}/${locale}"
            rm -rf "$raw" "$out"
            mkdir -p "$raw" "$out"

            pdfimages -f "$first" -l "$last" -all "$pdf" "$raw/img"
            list="$out/candidates.tsv"
            : > "$list"

            declare -A seen=()
            for f in "$raw"/img-*; do
              [ -f "$f" ] || continue
              geom="$(identify -format '%w %h' "$f" 2>/dev/null || true)"
              [ -n "$geom" ] || continue
              read -r w h <<<"$geom"
              size="$(stat -c '%s' "$f")"
              if (( w < 300 || h < 180 || size < 10000 )); then
                continue
              fi
              hash="$(sha256sum "$f" | awk '{print $1}')"
              [ -z "${seen[$hash]+x}" ] || continue
              seen[$hash]=1
              num="$(basename "$f" | sed -E 's/^img-([0-9]+).*/\1/')"
              ext="${f##*.}"
              cp "$f" "$out/object-${num}.${ext}"
              printf '%s\t%s\t%s\t%s\t%s\tobject-%s.%s\n' \
                "$num" "$w" "$h" "$size" "$hash" "$num" "$ext" >> "$list"
            done

            sort -n -k1,1 -o "$list" "$list"
            echo "::group::${slug} ${locale}"
            cat "$list"
            echo "::endgroup::"
          }

          EN=tmp/v03-i04-assets/en.pdf
          TR=tmp/v03-i04-assets/tr.pdf

          extract_range en "$EN" 8 16 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz
          extract_range tr "$TR" 7 15 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz

          extract_range en "$EN" 30 51 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin
          extract_range tr "$TR" 29 50 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin

          extract_range en "$EN" 52 63 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme
          extract_range tr "$TR" 51 62 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme

          extract_range en "$EN" 64 76 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri
          extract_range tr "$TR" 63 75 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri

          extract_range en "$EN" 78 91 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi
          extract_range tr "$TR" 77 90 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi

          extract_range en "$EN" 92 94 guc-zayifliktir
          extract_range tr "$TR" 91 93 guc-zayifliktir

          extract_range en "$EN" 95 95 yangin-merdiveni
          extract_range tr "$TR" 94 94 yangin-merdiveni

          extract_range en "$EN" 96 96 simitci
          extract_range tr "$TR" 95 95 simitci

          extract_range en "$EN" 97 97 uygarligin-ipek-yolu
          extract_range tr "$TR" 96 96 uygarligin-ipek-yolu

      - name: Emit labeled contact sheets for visual verification
        shell: bash
        run: |
          set -euo pipefail
          export_root='tmp/v03-i04-assets/export'
          emit_sheet () {
            slug="$1"; locale="$2"
            dir="$export_root/$slug/$locale"
            shopt -s nullglob
            files=("$dir"/object-*)
            shopt -u nullglob
            [ "${#files[@]}" -gt 0 ] || return 0
            sheet="$dir/contact-sheet.jpg"
            montage "${files[@]}" -thumbnail '220x180>' -background white -fill black \
              -stroke none -pointsize 14 -set label '%f' -tile 4x -geometry '+12+28' \
              -quality 65 "$sheet"
            echo "CONTACT_SHEET_BEGIN::$slug::$locale"
            base64 -w0 "$sheet"
            echo
            echo "CONTACT_SHEET_END::$slug::$locale"
          }

          emit_sheet ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz en
          emit_sheet ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin en
          emit_sheet ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme en
          emit_sheet ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri en
          emit_sheet ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi en
          emit_sheet guc-zayifliktir tr
          emit_sheet yangin-merdiveni tr
          emit_sheet simitci tr
          emit_sheet uygarligin-ipek-yolu tr

      - name: Upload binary bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: v03-i04-binary-bridge
          path: |
            tmp/v03-i04-assets/en.pdf
            tmp/v03-i04-assets/tr.pdf
            tmp/v03-i04-assets/export
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Confirm repository untouched
        run: test -z "$(git status --porcelain --untracked-files=no)"
