name: Extract v03-i04 exact PDF assets

on:
  push:
    branches: [chore/v03-i04-fulltext-canonical]
    paths: [.github/workflows/extract-v03-i04-assets.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install PDF tools
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils imagemagick >/dev/null
      - name: Download verified PDFs
        run: |
          set -euo pipefail
          mkdir -p tmp/v03-i04-assets
          curl -L --fail --retry 4 'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-en.pdf' -o tmp/v03-i04-assets/en.pdf
          curl -L --fail --retry 4 'https://briqjournal.com/assets/archive/pdfs/issues/cilt-3-sayi-4-tr.pdf' -o tmp/v03-i04-assets/tr.pdf
          test "$(pdfinfo tmp/v03-i04-assets/en.pdf | awk '/^Pages:/ {print $2}')" = "98"
          test "$(pdfinfo tmp/v03-i04-assets/tr.pdf | awk '/^Pages:/ {print $2}')" = "97"
      - name: Extract and commit verified production rasters only
        shell: bash
        run: |
          set -euo pipefail
          extract_range () {
            locale="$1"; pdf="$2"; first="$3"; last="$4"; slug="$5"
            raw="tmp/v03-i04-assets/raw/$slug/$locale"
            out="tmp/v03-i04-assets/export/$slug/$locale"
            rm -rf "$raw" "$out"; mkdir -p "$raw" "$out"
            pdfimages -f "$first" -l "$last" -all "$pdf" "$raw/img"
            for f in "$raw"/img-*; do
              [ -f "$f" ] || continue
              geom="$(identify -format '%w %h' "$f" 2>/dev/null || true)"
              [ -n "$geom" ] || continue
              read -r w h <<<"$geom"
              size="$(stat -c '%s' "$f")"
              if (( w < 100 || h < 100 || size < 1000 )); then continue; fi
              num="$(basename "$f" | sed -E 's/^img-([0-9]+).*/\1/')"
              ext="${f##*.}"
              cp "$f" "$out/object-${num}.${ext}"
            done
          }
          EN=tmp/v03-i04-assets/en.pdf
          TR=tmp/v03-i04-assets/tr.pdf
          extract_range en "$EN" 8 16 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz
          extract_range tr "$TR" 7 15 ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz
          extract_range en "$EN" 30 51 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin
          extract_range tr "$TR" 29 50 ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin
          extract_range en "$EN" 52 63 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme
          extract_range tr "$TR" 51 62 ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme
          extract_range en "$EN" 64 76 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri
          extract_range tr "$TR" 63 75 ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri
          extract_range en "$EN" 78 91 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi
          extract_range tr "$TR" 77 90 ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi
          extract_range tr "$TR" 91 93 guc-zayifliktir
          extract_range tr "$TR" 94 94 yangin-merdiveni
          extract_range tr "$TR" 95 95 simitci
          extract_range tr "$TR" 96 96 uygarligin-ipek-yolu

          copy_seq () {
            slug="$1"; locale="$2"; shift 2
            srcdir="tmp/v03-i04-assets/export/$slug/$locale"
            dstdir="public/assets/article-figures/$slug"
            mkdir -p "$dstdir"; idx=1
            for obj in "$@"; do
              src="$(find "$srcdir" -maxdepth 1 -type f -name "object-$obj.*" | head -n1)"
              test -n "$src"; ext="${src##*.}"; printf -v num '%02d' "$idx"
              cp "$src" "$dstdir/figure-$num-$locale.$ext"; idx=$((idx+1))
            done
          }
          copy_shared () {
            slug="$1"; locale="$2"; obj="$3"
            srcdir="tmp/v03-i04-assets/export/$slug/$locale"; dstdir="public/assets/article-figures/$slug"
            mkdir -p "$dstdir"
            src="$(find "$srcdir" -maxdepth 1 -type f -name "object-$obj.*" | head -n1)"
            test -n "$src"; ext="${src##*.}"; cp "$src" "$dstdir/figure-01.$ext"
          }

          oz='000 002 003 004'
          kar='001 003 004 005 006 007 008 009 010 011 012 013 014 015 016 017 018 019'
          wang='001 002 003 004'
          gun='001 002 003 004 005 006 007 008 009 010 011 012 013'
          abd='001 002 003 004 005 006 007 008 009 010'
          copy_seq ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz en $oz
          copy_seq ortak-mirasimiz-olan-gecmisi-kuresel-olcekte-ele-alip-bilimi-paylasmak-zorundayiz tr $oz
          copy_seq ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin en $kar
          copy_seq ipek-yolu-uzerindeki-magara-tapinaklarindaki-kuzey-wei-donemine-ait-budist-resim-kompozisyonlarinin tr $kar
          copy_seq ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme en $wang
          copy_seq ipek-yolu-cayir-guzergahi-cayir-ipek-yolu-milli-ekonomi-iletisim-ve-butunlesme tr $wang
          copy_seq ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri en $gun
          copy_seq ipek-yolu-uzerinden-yakin-doguya-sibiryali-ust-paleolitik-cag-gocleri tr $gun
          copy_seq ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi en $abd
          copy_seq ipek-yolunda-kulturel-etkilesim-orta-asyada-yuezhi-goc-donemi tr $abd
          copy_shared guc-zayifliktir tr 001
          copy_shared yangin-merdiveni tr 001
          copy_shared simitci tr 000
          copy_shared uygarligin-ipek-yolu tr 001

          test -z "$(git status --porcelain -- content/articles)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/article-figures
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^public/assets/article-figures/' ; then exit 1; fi
          git commit -m "feat(fulltext): add v03-i04 exact production assets"
          git push origin HEAD:chore/v03-i04-fulltext-canonical
