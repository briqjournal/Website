name: Migrate v04-i01 canonical full text

on:
  push:
    branches:
      - chore/v04-i01-fulltext-canonical
    paths:
      - scripts/migrate-v04-i01.mjs
      - .github/workflows/migrate-v04-i01.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
      - name: Download official locale issue PDFs
        run: |
          mkdir -p tmp/v04-i01-source
          curl -L --fail --retry 4 --retry-delay 3             'https://briqjournal.com/sites/default/files/dergi-sayilari/2022-12/VOLUME4_ISSUE1_0.pdf'             -o tmp/v04-i01-source/en.pdf
          curl -L --fail --retry 4 --retry-delay 3             'https://briqjournal.com/sites/default/files/dergi-sayilari/2022-12/CILT4_SAYI1_TR_kapakl%C4%B1.pdf'             -o tmp/v04-i01-source/tr.pdf
      - name: Generate canonical candidates
        run: node scripts/migrate-v04-i01.mjs
      - name: Commit generated migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/*/fulltext/en.json content/articles/*/fulltext/tr.json public/assets/article-figures
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(fulltext): generate v04-i01 canonical locales"
          git push origin HEAD:chore/v04-i01-fulltext-canonical
