name: v05-i01 asset finalization

on:
  push:
    branches:
      - chore/v05-i01-fulltext-canonical
    paths:
      - '.github/workflows/v05-i01-extract.yml'
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/v05-i01-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install PDF and image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Finalize missing vector figure asset
        shell: bash
        run: |
          set -euo pipefail
          slug=cok-kutupluluk-meydan-okumasi-dolarin-sarsilan-ustunlugu-ve-abd-hegemonyasinin-degisen
          out="public/assets/article-figures/$slug"
          if [ -s "$out/figure-06.jpg" ]; then
            echo "Six-asset multipolar state already present."
            exit 0
          fi
          test -s "$out/figure-01.jpg"
          test -s "$out/figure-02.jpg"
          test -s "$out/figure-03.jpg"
          test -s "$out/figure-04.jpg"
          test -s "$out/figure-05.jpg"

          pdf=/tmp/multipolar.pdf
          curl -L --fail --retry 3 --retry-delay 2 -o "$pdf" "https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2023-12/BRIQ_C5S1_ENG-40-59.pdf"
          mv "$out/figure-05.jpg" "$out/figure-06.jpg"
          mv "$out/figure-04.jpg" "$out/figure-05.jpg"
          mv "$out/figure-03.jpg" "$out/figure-04.jpg"
          mv "$out/figure-02.jpg" "$out/figure-03.jpg"
          pdftoppm -f 6 -l 6 -singlefile -jpeg -r 200 "$pdf" /tmp/vector-page >/dev/null 2>&1
          convert /tmp/vector-page.jpg -crop 1405x1075+135+250 +repage -strip -quality 90 "$out/figure-02.jpg"

      - name: Verify finalized assets
        shell: bash
        run: |
          set -euo pipefail
          for slug in filistin-1947 kudus-2023 filistinli-bir-multecinin-gozunden; do
            test -s "public/assets/article-figures/$slug/figure-01.jpg"
          done
          slug=cok-kutupluluk-meydan-okumasi-dolarin-sarsilan-ustunlugu-ve-abd-hegemonyasinin-degisen
          for n in 01 02 03 04 05 06; do
            test -s "public/assets/article-figures/$slug/figure-$n.jpg"
          done
          identify "public/assets/article-figures/$slug/figure-02.jpg"

      - name: Commit finalized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/article-figures/cok-kutupluluk-meydan-okumasi-dolarin-sarsilan-ustunlugu-ve-abd-hegemonyasinin-degisen
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Finalize v05-i01 multipolar vector figure asset"
          git pull --rebase origin chore/v05-i01-fulltext-canonical
          git push origin HEAD:chore/v05-i01-fulltext-canonical
