name: Probe remaining v06-i01 art page

on:
  push:
    branches:
      - chore/v06-i01-fulltext-canonical
    paths:
      - '.github/workflows/v06-i01-fulltext-extract.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Download official Turkish issue PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pdfs
          curl -L --fail --retry 4 --retry-all-errors 'https://briqjournal.com/sites/default/files/dergi-sayilari/2024-12/BRIQ%20Cilt6Sayi1.pdf' -o tmp/pdfs/v6i1-tr.pdf

      - name: Probe physical page 152 only
        shell: bash
        run: |
          set -euo pipefail
          out=tmp/v06-i01-page152-art
          rm -rf "$out"
          mkdir -p "$out"
          pdfimages -f 152 -l 152 -list tmp/pdfs/v6i1-tr.pdf > "$out/list.txt"
          pdfimages -f 152 -l 152 -all tmp/pdfs/v6i1-tr.pdf "$out/image" || true
          pdftoppm -f 152 -l 152 -singlefile -jpeg -r 180 tmp/pdfs/v6i1-tr.pdf "$out/page-152"
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("tmp/v06-i01-page152-art")
          lines = []
          for path in sorted(root.glob("image-*")):
              try:
                  dims = subprocess.check_output(
                      ["identify", "-format", "%w %h %[colorspace]", str(path)], text=True
                  ).strip()
                  lines.append(f"{path.name} {dims}")
              except subprocess.CalledProcessError:
                  pass
          (root / "identify.txt").write_text("\n".join(lines) + ("\n" if lines else ""), encoding="utf-8")
          PY

      - name: Commit page probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v06-i01-page152-art
          git commit -m 'Extract remaining v06-i01 art page'
          git push origin HEAD:chore/v06-i01-fulltext-canonical
