name: Targeted v06-i01 recovery extraction

on:
  push:
    branches:
      - chore/v06-i01-fulltext-canonical
    paths:
      - '.github/workflows/v06-i01-fulltext-extract.yml'

permissions:
  contents: write

jobs:
  extract-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Download official locale issue PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pdfs
          curl -L --fail --retry 4 --retry-all-errors 'https://briqjournal.com/sites/default/files/dergi-sayilari/2024-12/BRIQ%20Cilt6Sayi1.pdf' -o tmp/pdfs/v6i1-tr.pdf
          curl -L --fail --retry 4 --retry-all-errors 'https://briqjournal.com/sites/default/files/dergi-sayilari/2024-12/BRIQ%20Volume6Issue1.pdf' -o tmp/pdfs/v6i1-en.pdf
          pdfinfo tmp/pdfs/v6i1-tr.pdf | grep '^Pages:'
          pdfinfo tmp/pdfs/v6i1-en.pdf | grep '^Pages:'

      - name: Extract only unfinished poem and art pages
        shell: bash
        run: |
          set -euo pipefail
          out=tmp/v06-i01-targeted
          rm -rf "$out"
          mkdir -p "$out"

          for locale in tr en; do
            pdf="tmp/pdfs/v6i1-${locale}.pdf"
            pdftotext -layout -f 137 -l 138 "$pdf" "$out/ogrenmeye-ovgu-${locale}.txt"
            pdftotext -layout -f 139 -l 140 "$pdf" "$out/sevgi-duvari-${locale}.txt"
            pdftotext -layout -f 152 -l 152 "$pdf" "$out/operarios-isciler-1933-${locale}.txt"
            pdftotext -layout -f 153 -l 153 "$pdf" "$out/yeni-nesil-nazizm-2023-${locale}.txt"
          done

          mkdir -p "$out/nazism-images"
          pdfimages -f 153 -l 153 -png tmp/pdfs/v6i1-tr.pdf "$out/nazism-images/image"
          identify "$out"/nazism-images/*.png > "$out/nazism-images/identify.txt"

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          root = Path("tmp/v06-i01-targeted/nazism-images")
          candidates = []
          for path in sorted(root.glob("*.png")):
              w, h = map(int, subprocess.check_output(
                  ["identify", "-format", "%w %h", str(path)], text=True
              ).split())
              cs = subprocess.check_output(
                  ["identify", "-format", "%[colorspace]", str(path)], text=True
              ).strip()
              if w >= 400 and h >= 250 and not cs.lower().startswith("gray"):
                  candidates.append((w*h, w, h, path))
          if not candidates:
              raise SystemExit("No usable image found on physical page 153")
          candidates.sort(reverse=True)
          _, w, h, src = candidates[0]
          dst = root / "selected-figure-01.jpg"
          subprocess.run(["convert", str(src), "-strip", "-quality", "90", str(dst)], check=True)
          (root / "selected.txt").write_text(f"{src.name} {w}x{h}\n", encoding="utf-8")
          PY

      - name: Commit targeted recovery extracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tmp/v06-i01-targeted
          git commit -m 'Extract remaining v06-i01 poem and art targets'
          git push origin HEAD:chore/v06-i01-fulltext-canonical
