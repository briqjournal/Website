name: Fix APA references

# rerun: 3
on:
  push:
    paths:
      - ".github/workflows/fix-reference-apa.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply renderer patch
        run: python3 scripts/apply-reference-apa.py

      - name: Normalize extracted reference links
        run: python3 scripts/normalize-reference-links.py

      - name: Verify example DOI is contiguous when present
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'https://doi[[:space:]]*\.[[:space:]]*org/10\.5430/wjel\.v13n2p486' app/article-fulltext*.json; then
            echo "Broken DOI host still present" >&2
            exit 1
          fi
          grep -R -n 'https://doi.org/10.5430/wjel.v13n2p486' app/article-fulltext*.json || true

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add app/components/ArticlePlatform.tsx app/globals.css app/article-fulltext*.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Format references to APA 7 and repair links"
          git push origin HEAD:main
