name: Build v06-i02 full-text candidates

on:
  push:
    branches:
      - chore/v06-i02-fulltext-canonical
    paths:
      - '.github/workflows/v06-i02-fulltext-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Download official locale issue PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pdfs
          curl -L --fail --retry 4 --retry-all-errors 'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-03/BRIQ_Cilt6Say%C4%B12_2025BAHAR.pdf' -o tmp/pdfs/v6i2-tr.pdf
          curl -L --fail --retry 4 --retry-all-errors 'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-03/BRIQ_Volume6SIssue2_2025Spring.pdf' -o tmp/pdfs/v6i2-en.pdf
          pdfinfo tmp/pdfs/v6i2-tr.pdf | grep '^Pages:'
          pdfinfo tmp/pdfs/v6i2-en.pdf | grep '^Pages:'

      - name: Extract issue full text
        run: node scripts/extract-current-issue-fulltext.mjs 6-2

      - name: Split candidates into canonical locale files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          issue = json.loads(Path("content/issues/v06-i02.json").read_text(encoding="utf-8"))
          assert len(issue["articles"]) == 13
          for slug in issue["articles"]:
              root = Path("content/articles") / slug / "fulltext"
              current = root / "current.json"
              data = json.loads(current.read_text(encoding="utf-8"))
              for locale in ("en", "tr"):
                  payload = data[locale]
                  (root / f"{locale}.json").write_text(
                      json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
              current.unlink()

          # The extractor still updates the legacy catalog; this task does not.
          import subprocess
          subprocess.run(["git", "checkout", "--", "content/catalog.json"], check=True)
          PY

      - name: Validate candidate structure and language separation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          issue = json.loads(Path("content/issues/v06-i02.json").read_text(encoding="utf-8"))
          long_slugs = set(issue["articles"][:8])
          for slug in issue["articles"]:
              for locale in ("en", "tr"):
                  path = Path("content/articles") / slug / "fulltext" / f"{locale}.json"
                  data = json.loads(path.read_text(encoding="utf-8"))
                  assert set(["sections","keywords","footnotes","references","acknowledgements","figures"]).issubset(data), (slug, locale)
                  body = " ".join(p for s in data["sections"] for p in s.get("paragraphs", []))
                  if slug in long_slugs:
                      assert len(body) > 1500, (slug, locale, len(body))
                  for i, section in enumerate(data["sections"], 1):
                      assert section["id"] == f"{locale}-section-{i}", (slug, locale, section["id"])
                      assert isinstance(section.get("title"), str)
                      assert isinstance(section.get("paragraphs"), list)
                  if locale == "en" and body:
                      turkish_markers = len(re.findall(r"\b(?:ve|bir|bu|için|olan|olarak|ile|Çin|Türkiye)\b", body, re.I))
                      english_markers = len(re.findall(r"\b(?:the|and|of|to|in|for|with|China|Turkey)\b", body, re.I))
                      assert english_markers >= turkish_markers, (slug, english_markers, turkish_markers)
          print("CANDIDATE_STRUCTURE_OK")
          PY

      - name: Commit canonical candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/*/fulltext/en.json content/articles/*/fulltext/tr.json public/assets/article-figures
          git commit -m 'Rebuild v06-i02 full text with verified structure and figures'
          git push origin HEAD:chore/v06-i02-fulltext-canonical
