name: Fix Iratni English full text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-iratni-fulltext.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Rebuild English full text from authoritative PDF
        run: |
          python -m pip install --quiet pymupdf
          curl -L --fail --retry 3 'https://www.briqjournal.com/sites/default/files/yazi-ici-dosyalar/2025-06/Belkacem%20Iratni_ENG.pdf' -o /tmp/iratni.pdf
          python <<'PY'
          import json, re, unicodedata
          import pymupdf as fitz
          from pathlib import Path

          root = Path('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine')
          out_path = root / 'fulltext' / 'en-archive.json'
          meta_path = root / 'metadata.json'

          headings = [
              'Introduction',
              'The “Mecca” of the Revolutionaries',
              'Diplomatic support',
              'Arms and military training for African freedom fighters',
              'The Arduous Quest for a Militant Non-Aligned Movement',
              'Adapting the Non-Aligned Movement to an Evolving Global Landscape',
              'Conclusion',
          ]
          heading_lookup = {re.sub(r'\s+', ' ', h).strip(): h for h in headings}
          prefix_hyphens = {'anti', 'non', 'self', 'pre', 'post', 'pro', 'co', 're', 'neo'}

          def norm(s):
              s = unicodedata.normalize('NFC', s)
              s = s.replace('\u00ad', '')
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def join_lines(lines, reference=False):
              lines = [norm(x) for x in lines if norm(x)]
              if not lines:
                  return ''
              out = lines[0]
              for nxt in lines[1:]:
                  if out.endswith('-'):
                      token = out.split()[-1]
                      bare = token[:-1].lower()
                      if bare in prefix_hyphens:
                          out += nxt.lstrip()
                      else:
                          out = out[:-1] + nxt.lstrip()
                  else:
                      out += ' ' + nxt.lstrip()
              out = re.sub(r'\s+([,.;:?!])', r'\1', out)
              out = re.sub(r'\(\s+', '(', out)
              out = re.sub(r'\s+\)', ')', out)
              return norm(out)

          def block_infos(page):
              d = page.get_text('dict')
              infos = []
              for block in d.get('blocks', []):
                  if 'lines' not in block:
                      continue
                  lines = []
                  fonts = set()
                  sizes = []
                  for line in block['lines']:
                      text = ''.join(span.get('text','') for span in line.get('spans', []))
                      if text.strip():
                          lines.append(text)
                      for span in line.get('spans', []):
                          fonts.add(span.get('font',''))
                          sizes.append(float(span.get('size', 0)))
                  if not lines:
                      continue
                  x0,y0,x1,y1 = block['bbox']
                  infos.append({
                      'x0': x0, 'y0': y0, 'x1': x1, 'y1': y1,
                      'lines': lines,
                      'text': join_lines(lines),
                      'fonts': fonts,
                      'maxsize': max(sizes) if sizes else 0,
                  })
              return infos

          def is_skip_block(b):
              t = b['text']
              if b['y0'] < 90 or b['y0'] > 705:
                  return True
              if re.fullmatch(r'\d{3}', t):
                  return True
              if 'Photograph:' in t:
                  return True
              if 'B R I q' in t or t.startswith('Belkacem Iratni- The Algerian Revolutionary Diplomacy'):
                  return True
              if any('MyriadPro-Semibold' in f for f in b['fonts']) and b['maxsize'] >= 12.0:
                  return True
              if b['maxsize'] <= 8.5:
                  return True
              return False

          def sort_blocks(infos):
              useful = [b for b in infos if not is_skip_block(b)]
              # Journal body is two-column. Read entire left column before right column.
              return sorted(useful, key=lambda b: (0 if b['x0'] < 285 else 1, b['y0'], b['x0']))

          doc = fitz.open('/tmp/iratni.pdf')
          assert len(doc) == 22, len(doc)

          sections = []
          current = None
          started = False
          in_refs = False
          ref_blocks = []

          def start_section(title):
              nonlocal_current = {
                  'id': f'en-section-{len(sections)+1}',
                  'title': title,
                  'paragraphs': [],
                  'level': 'section'
              }
              sections.append(nonlocal_current)
              return nonlocal_current

          for pno in range(1, 22):
              page = doc[pno]
              blocks = sort_blocks(block_infos(page))
              for b in blocks:
                  t = b['text']
                  nt = norm(t)
                  if nt == 'ABSTRACT' or nt.startswith('Keywords:'):
                      continue
                  if nt in heading_lookup:
                      if nt == 'Introduction':
                          started = True
                      if not started:
                          continue
                      current = start_section(heading_lookup[nt])
                      continue
                  if nt == 'References':
                      in_refs = True
                      continue
                  if in_refs:
                      ref_blocks.append((pno, b))
                      continue
                  if not started or current is None:
                      continue

                  text = nt
                  if not text:
                      continue
                  if current['title'] == 'Introduction' and not current['paragraphs']:
                      text = text.replace('THE BANDUNG CONFERENCE, CONDUCTED', 'The Bandung Conference, conducted', 1)

                  # Merge only obvious continuations across column/page breaks.
                  if current['paragraphs']:
                      prev = current['paragraphs'][-1]
                      prev_terminal = bool(re.search(r'[.!?…:”’"\)]$', prev))
                      if (not prev_terminal and not text.startswith('- ')):
                          current['paragraphs'][-1] = norm(prev + ' ' + text)
                      else:
                          current['paragraphs'].append(text)
                  else:
                      current['paragraphs'].append(text)

          # Parse references from their actual PDF blocks, preserving source order.
          references = []
          current_ref = ''
          last_col = None
          for pno, b in ref_blocks:
              x = b['x0']
              col = 'L' if x < 285 else 'R'
              if col == 'L':
                  is_new = x < 78.0
              else:
                  is_new = x < 296.0
              text = join_lines(b['lines'], reference=True)
              if not text:
                  continue
              if is_new:
                  if current_ref:
                      references.append(norm(current_ref))
                  current_ref = text
              else:
                  if current_ref:
                      # Preserve visible URL hyphens better by concatenating obvious URL continuations.
                      if ('http' in current_ref or 'www.' in current_ref) and current_ref.endswith('-'):
                          current_ref += text
                      else:
                          current_ref += ' ' + text
                  else:
                      current_ref = text
              last_col = col
          if current_ref:
              references.append(norm(current_ref))

          # Remove artifacts that are not scholarly references if any slipped through.
          references = [r for r in references if r and not re.fullmatch(r'\d{3}', r)]

          # Structural and corruption guards.
          assert [s['title'] for s in sections] == headings, [s['title'] for s in sections]
          assert all(s['paragraphs'] for s in sections), [(s['title'], len(s['paragraphs'])) for s in sections]
          body_text = '\n'.join(p for s in sections for p in s['paragraphs'])
          for bad in [
              'Introduction repudiated any affiliation',
              '1961 Belgrade Summit declaration, which empha-',
              'United Nations Security Council (UNSC) and General References',
              'The “Mecca” of the Revolutionaries colonized nation',
          ]:
              assert bad not in body_text, bad
          assert body_text.startswith('The Bandung Conference, conducted in April 1955'), body_text[:180]
          assert len(body_text.split()) > 7500, len(body_text.split())
          assert len(references) >= 20, len(references)

          data = {
              'sections': sections,
              'keywords': [
                  'Algeria',
                  'liberation movements',
                  'New International Economic Order',
                  'nonalignment',
                  'revolutionary diplomacy'
              ],
              'footnotes': [],
              'references': references,
              'acknowledgements': '',
              'figures': []
          }
          out_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Repair the English abstract/keyword extraction artifacts from the same authoritative PDF.
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['abstract']['en'] = (
              "Following its independence in July 1962, Algeria commenced the application of non-alignment principles by supporting liberation movements, primarily in Africa, to eradicate Western colonialism. "
              "Algeria gradually sought to instill a new ethos in the Non-Alignment Movement, transcending mere formal pronouncements and the politics of passive neutrality. "
              "Consequently, it advocated for the integration of this movement in addressing global challenges and urged the formation of a New International Economic Order (NIEO) to enable Global South nations to assert control over their natural resources, reduce economic reliance on foreign entities, and establish a just and equitable international financial system. "
              "The article examines the progression of Algeria’s non-alignment policy since the Bandung Conference by analyzing its endeavors to attain political liberation for the southern hemisphere and its persistent efforts to reform the global economic system, perceived as harmful to developing nations' economic advancement and well-being. "
              "This revolutionary ethos, derived from the principles established at Bandung and evident in Algerian diplomatic conduct, warrants the recognition it truly merits."
          )
          meta['keywords']['en'] = [
              'Algeria',
              'liberation movements',
              'New International Economic Order',
              'nonalignment',
              'revolutionary diplomacy'
          ]
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('SECTIONS', [(s['title'], len(s['paragraphs'])) for s in sections])
          print('BODY_WORDS', len(body_text.split()))
          print('REFERENCES', len(references))
          print('FIRST', sections[0]['paragraphs'][0][:220])
          print('LAST', sections[-1]['paragraphs'][-1][-220:])
          PY
      - name: Validate JSON and commit fix
        run: |
          node -e "JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json','utf8')); JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/metadata.json','utf8'));"
          rm .github/workflows/fix-iratni-fulltext.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json \
                  content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/metadata.json \
                  .github/workflows/fix-iratni-fulltext.yml
          git commit -m 'Rebuild Iratni English full text from source PDF'
          git pull --rebase origin main
          git push origin HEAD:main
