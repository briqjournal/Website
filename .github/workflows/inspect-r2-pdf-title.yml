name: Inspect exact R2 PDF title
on:
  push:
    branches: [diagnostic/site-access-2026-10-10]
    paths: [.github/workflows/inspect-r2-pdf-title.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only the requested PDF from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api get-object --bucket "$R2_BUCKET" --key assets/archive/pdfs/issues/cilt-6-sayi-4-en.pdf --endpoint-url "$R2_ENDPOINT" target.pdf --query '{ContentLength:ContentLength,ContentType:ContentType,ETag:ETag}' --output json
      - name: Install PDF reader
        run: python3 -m pip install --quiet pymupdf
      - name: Inspect all pages and metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import fitz
          path=Path("target.pdf")
          doc=fitz.open(path)
          needle="BURADA KAPAK OLACAK"
          norm=lambda x: re.sub(r"\s+"," ",x).upper()
          report={"bytes":path.stat().st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"pages":len(doc),"metadata":doc.metadata,"metadata_hit":needle in norm(json.dumps(doc.metadata,ensure_ascii=False)),"xmp_hit":needle in norm(doc.get_xml_metadata()),"text_hits":[],"annotation_hits":[],"bookmark_hits":[],"object_hits":[]}
          for i,page in enumerate(doc):
           text=page.get_text()
           if needle in norm(text):
            matches=[]
            for b in page.get_text("dict")["blocks"]:
             for line in b.get("lines",[]):
              for span in line.get("spans",[]):
               if any(w in span["text"].upper() for w in ("BURADA","KAPAK","OLACAK")):
                matches.append({k:span[k] for k in ("text","bbox","size","font")})
            report["text_hits"].append({"pdf_page":i+1,"matches":matches,"first_text":text[:350]})
           for annot in page.annots() or []:
            if needle in norm(json.dumps(annot.info,ensure_ascii=False)):report["annotation_hits"].append(i+1)
          for item in doc.get_toc():
           if needle in norm(str(item)):report["bookmark_hits"].append(item)
          for xref in range(1,doc.xref_length()):
           values=[("object",doc.xref_object(xref))]
           if doc.xref_is_stream(xref):
            raw=doc.xref_stream(xref)
            values.extend(("stream-"+encoding,raw.decode(encoding,errors="ignore")) for encoding in ("latin1","utf-16-be","utf-16-le"))
           for kind,value in values:
            if needle in norm(value):report["object_hits"].append({"xref":xref,"kind":kind})
          Path("report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          
          PY
