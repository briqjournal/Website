name: v05-i01 vector figure probe
on:
  push:
    branches:
      - chore/v05-i01-fulltext-canonical
    paths:
      - '.github/workflows/v05-i01-vector-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Probe multipolar vector figure
        shell: bash
        run: |
          set -euo pipefail
          url=$(python3 - <<'PY'
          import json
          m=json.load(open("content/articles/cok-kutupluluk-meydan-okumasi-dolarin-sarsilan-ustunlugu-ve-abd-hegemonyasinin-degisen/metadata.json"))
          print(m["urls"]["pdfEn"])
          PY
          )
          curl -L --fail --retry 3 -o /tmp/a.pdf "$url"
          pdftohtml -xml -hidden -f 7 -l 7 /tmp/a.pdf /tmp/a.xml >/dev/null 2>&1
          python3 - <<'PY'
          import re,json
          x=open("/tmp/a.xml",encoding="utf-8").read()
          page=re.search(r'<page\b[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"[^>]*>([\s\S]*?)</page>',x)
          if not page: raise SystemExit("page not found")
          nodes=[]
          for m in re.finditer(r'<text\b[^>]*top="([\d.]+)"[^>]*left="([\d.]+)"[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"[^>]*>([\s\S]*?)</text>',page.group(3)):
              txt=re.sub(r'<[^>]+>','',m.group(5))
              txt=re.sub(r'\s+',' ',txt).strip()
              if txt:
                  nodes.append({"top":float(m.group(1)),"left":float(m.group(2)),"width":float(m.group(3)),"height":float(m.group(4)),"text":txt})
          json.dump({"page_width":float(page.group(1)),"page_height":float(page.group(2)),"nodes":nodes},open("tmp/v05-i01-vector-evidence.json","w"),ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/v05-i01-vector-evidence.json
          git commit -m "Capture v05-i01 vector figure coordinates"
          git push origin HEAD:chore/v05-i01-fulltext-canonical
