name: Audit Volume 6 Issue 4 canonical records
on:
  push:
    branches: [automation/v6i4-fulltext]
    paths: [.github/workflows/v6i4-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deep audit latest main canonical data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          issue=json.loads(Path('content/issues/v06-i04.json').read_text(encoding='utf-8'))
          print('MAIN',__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip())
          # Author profile availability
          authors=Path('app/authors.ts').read_text(encoding='utf-8')
          for name in ['Kolosovskiy Yan','Song Shuli','Cheng Enfu','Can Ulusoy','Füruğ Ferruhzad','Hasan İzzettin Dinamo']:
            print('AUTHOR_PROFILE',name, bool(re.search(r'^[ \t]*'+re.escape(json.dumps(name,ensure_ascii=False))+r'\s*:\s*\{',authors,re.M)))
          # Exact metadata/category audit
          for slug in issue['articles']:
            m=json.loads((Path('content/articles')/slug/'metadata.json').read_text(encoding='utf-8'))
            print('META',slug,'author=',repr(m.get('author')),'pages=',repr(m.get('pages')),'types=',repr(m.get('publication_type_tr')),repr(m.get('publication_type_en')))
          # WEF reference lists and footnotes, where TR/EN counts differ.
          slug='dunya-ekonomik-forumunun-kuresellesme-surecindeki-etkisinin-ekonomi-politik-elestirisi'
          f=json.loads((Path('content/articles')/slug/'fulltext/current.json').read_text(encoding='utf-8'))
          for loc in ('tr','en'):
            print('\nWEF',loc.upper(),'REFERENCES',len(f[loc]['references']))
            for i,r in enumerate(f[loc]['references'],1): print(f'{loc.upper()}REF{i:02d}',r.get('text',''))
            print('WEF',loc.upper(),'FOOTNOTES',len(f[loc]['footnotes']))
            for n in f[loc]['footnotes']: print(loc.upper(),'NOTE',n)
          # Young China exact reference tails for verified split-vs-joined source entry.
          slug='genc-cin-ve-genc-cinliler-cinde-aydinlanma-yeni-kultur-hareketi-ve-yeni-siyasal-bicimlenme'
          f=json.loads((Path('content/articles')/slug/'fulltext/current.json').read_text(encoding='utf-8'))
          for loc in ('tr','en'):
            print('\nYOUNG',loc.upper(),'REFERENCES',len(f[loc]['references']))
            for i,r in list(enumerate(f[loc]['references'],1))[-4:]: print(f'{loc.upper()}REF{i:02d}',r.get('text',''))
          PY