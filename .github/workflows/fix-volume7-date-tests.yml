name: One-time Volume 7 date test sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-volume7-date-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align stale date expectations and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rendered-html.test.mjs')
          text = path.read_text()
          replacements = {
              '1 Nisan 2026': '1 Mart 2026',
              '1 April 2026': '1 March 2026',
              '2026-04-01': '2026-03-01',
              '1 Temmuz 2026': '1 Haziran 2026',
              '1 July 2026': '1 June 2026',
              '2026-07-01': '2026-06-01',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/fix-volume7-date-tests.yml
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add tests/rendered-html.test.mjs .github/workflows/fix-volume7-date-tests.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync Volume 7 publication date tests"
          git push origin HEAD:main
