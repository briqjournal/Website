name: Validate v06-i03 fidelity repair

on:
  push:
    branches:
      - audit/v06-i03-fulltext-fidelity
    paths:
      - tmp/v06-i03-validation-trigger.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v06-i03-fulltext-fidelity
      - name: Install PDF tools
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Run focused regression
        run: node --test tests/v6i3-fidelity-regression.test.mjs
      - name: Re-run reusable PDF audit
        run: python3 scripts/audit-fulltext-fidelity.py v06-i03 --out /tmp/v06-i03-post
      - name: Check post-repair audit invariants
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/v06-i03-post/v06-i03/report.json')
          r=json.loads(p.read_text())
          assert r['records']==11, r['records']
          assert len(r['locales'])==22, len(r['locales'])
          bad=[]
          for x in r['locales']:
              if x.get('status'): bad.append((x['slug'],x['locale'],'status',x['status']))
              for k in ['duplicate_paragraphs','duplicate_footnote_ids','cross_record_title_candidates','metadata_leakage_candidates','missing_figure_assets','figure_captions_low_match']:
                  if x.get(k): bad.append((x['slug'],x['locale'],k,x[k]))
              print(x['slug'],x['locale'],
                    'para',x.get('paragraph_match_ratio'),
                    'refs',x.get('canonical_references'),
                    'figs',x.get('canonical_figures'),
                    'unmatched',len(x.get('unmatched_paragraphs') or []),
                    'nonmono',len(x.get('nonmonotonic_assignments') or []),
                    'empty',len(x.get('empty_sections') or []))
          if bad:
              print('POST_REPAIR_FAILURES')
              for row in bad: print(row)
              raise SystemExit(1)
          PY
