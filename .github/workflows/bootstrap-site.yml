name: Bootstrap BRIQ website

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-site.yml"

permissions:
  contents: write

concurrency:
  group: briq-site-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore editable website sources
        run: |
          set -euo pipefail
          for part in .bootstrap/chunks/part-*; do
            cat "$part"
          done > /tmp/briq-site.tar.gz
          tar -xzf /tmp/briq-site.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-site.yml

      - name: Configure Git LFS
        run: |
          git lfs install --local
          git lfs track "*.pdf"

      - name: Download and verify the complete PDF archive
        run: python3 scripts/localize-pdf-archive.py

      - name: Publish the complete repository
        run: |
          git config user.name "BRIQ Repository Bot"
          git config user.email "briq@briqjournal.com"
          git add -A
          git commit -m "Import complete BRIQ website and PDF archive"
          git push origin HEAD:main
