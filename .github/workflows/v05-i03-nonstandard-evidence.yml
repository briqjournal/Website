name: Capture v05-i03 nonstandard evidence

on:
  push:
    branches:
      - chore/v05-i03-fulltext-canonical
    paths:
      - '.github/workflows/v05-i03-nonstandard-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Download and inspect nonstandard article PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess, urllib.parse, urllib.request

          root = pathlib.Path(".")
          issue = json.loads((root / "content/issues/v05-i03.json").read_text(encoding="utf-8"))
          slugs = issue["articles"][8:]
          evidence = root / "tmp/v05-i03-nonstandard-evidence"
          pdfdir = root / "tmp/v05-i03-nonstandard-pdfs"
          evidence.mkdir(parents=True, exist_ok=True)
          pdfdir.mkdir(parents=True, exist_ok=True)

          for slug in slugs:
              meta = json.loads((root / "content/articles" / slug / "metadata.json").read_text(encoding="utf-8"))
              record = evidence / slug
              record.mkdir(parents=True, exist_ok=True)
              for locale, key in (("en", "pdfEn"), ("tr", "pdfTr")):
                  url = meta["urls"][key]
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme != "https" or parsed.hostname not in {"briqjournal.com", "www.briqjournal.com"}:
                      raise SystemExit(f"non-BRIQ PDF URL for {slug} {locale}: {url}")
                  pdf = pdfdir / f"{slug}-{locale}.pdf"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as response, pdf.open("wb") as fh:
                      fh.write(response.read())
                  subprocess.run(["pdfinfo", str(pdf)], check=True, stdout=subprocess.DEVNULL)
                  raw = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True, errors="replace")
                  (record / f"{locale}-raw.txt").write_text(raw, encoding="utf-8")
                  subprocess.run(
                      ["pdftoppm", "-f", "1", "-singlefile", "-jpeg", "-r", "120", str(pdf), str(record / f"{locale}-page-1")],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
          PY

      - name: Extract visual candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess, tempfile

          root = pathlib.Path(".")
          visual = [
            "koyun-guden-cingene-kiz-daglik-altay-ozerk-bolgesi-30-temmuz-1980",
            "karpuz-saticisi-1953",
            "istanbul-bogazinin-kopuklerinden-yeni-anayasa-venusunun-dogusu",
          ]
          for slug in visual:
              pdf = root / "tmp/v05-i03-nonstandard-pdfs" / f"{slug}-en.pdf"
              out = root / "tmp/v05-i03-nonstandard-evidence" / slug
              with tempfile.TemporaryDirectory() as td:
                  prefix = pathlib.Path(td) / "image"
                  subprocess.run(["pdfimages", "-png", str(pdf), str(prefix)], check=True)
                  candidates = []
                  for p in pathlib.Path(td).glob("image-*.png"):
                      size = subprocess.check_output(["identify", "-format", "%w %h", str(p)], text=True).split()
                      w, h = map(int, size)
                      candidates.append((w*h, w, h, p))
                  if not candidates:
                      raise SystemExit(f"no raster image candidates for {slug}")
                  candidates.sort(reverse=True)
                  _, w, h, chosen = candidates[0]
                  subprocess.run(["convert", str(chosen), "-strip", "-quality", "90", str(out / "figure-01-candidate.jpg")], check=True)
                  (out / "image-candidates.json").write_text(
                      json.dumps([{"area":a,"width":w0,"height":h0,"name":p.name} for a,w0,h0,p in candidates], indent=2) + "\n",
                      encoding="utf-8"
                  )
                  print(slug, w, h)
          PY
          rm -rf tmp/v05-i03-nonstandard-pdfs

      - name: Commit nonstandard evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i03-nonstandard-evidence
          git commit -m 'Capture v05-i03 nonstandard PDF evidence'
          git pull --rebase origin chore/v05-i03-fulltext-canonical
          git push origin HEAD:chore/v05-i03-fulltext-canonical
