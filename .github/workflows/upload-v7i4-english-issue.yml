name: Verify Volume 7 Issue 4 English PDF

on:
  push:
    branches:
      - codex/v7i4-locale-architecture-hardening
    paths:
      - .github/workflows/upload-v7i4-english-issue.yml

permissions:
  contents: read

concurrency:
  group: briq-r2-v7i4-en-issue
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SOURCE_URL: https://briqjournal.com/sites/default/files/dergi-sayilari/2026-08/BRIQ%20Volume7%20Issue4%20AUTUMN%202026.pdf
      OBJECT_KEY: assets/issues/briq-volume-7-issue-4-autumn-2026.pdf

    steps:
      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Download and validate source PDF
        id: pdf
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/briq-volume-7-issue-4-autumn-2026.pdf"
          curl --fail --location --retry 3 --output "$target" "$SOURCE_URL"
          test "$(head -c 5 "$target")" = "%PDF-"
          bytes="$(stat --format='%s' "$target")"
          sha256="$(sha256sum "$target" | cut -d' ' -f1)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Validated PDF: bytes=$bytes sha256=$sha256"

      - name: Verify uploaded object
        shell: bash
        run: |
          set -euo pipefail
          remote_bytes="$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength \
            --output text)"
          test "$remote_bytes" = "${{ steps.pdf.outputs.bytes }}"
          echo "Verified R2 object: key=$OBJECT_KEY bytes=$remote_bytes sha256=${{ steps.pdf.outputs.sha256 }}"
