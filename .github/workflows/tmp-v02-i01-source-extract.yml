name: Temporary v02-i01 source extraction

on:
  push:
    branches:
      - chore/v02-i01-fulltext-canonical
    paths:
      - ".github/workflows/tmp-v02-i01-source-extract.yml"
      - "scripts/tmp-v02-i01-source-extract.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Build canonical locale records from official PDFs
        run: python3 scripts/tmp-v02-i01-source-extract.py
      - name: Validate the 14-route regression
        run: node --test tests/v02i1-locale-fulltext.test.mjs
      - name: Commit completed records progressively
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for slug in \
            bes-deniz-stratejisini-canlandirmak-mumkun-mu \
            turkiye-ve-cinin-degisen-deniz-jeopolitiginin-neo-mahanci-bir-okumasi \
            mavi-vatan-doktrini-nasil-olustu \
            mare-nostrumdan-denizlerde-uluslararasi-isbirligine-tarih-akdenizin-gelecegi-ile-ilgili \
            gaz-hidratlar-yakin-gelecegin-enerji-kaynagi \
            karabag-baslangictan-gunumuze-sorunlar-ve-cozumler \
            fotograf-omer-burhanoglu
          do
            git add "content/articles/$slug/fulltext/en.json" "content/articles/$slug/fulltext/tr.json"
            if ! git diff --cached --quiet; then
              git commit -m "feat(v02-i01): migrate $slug bilingual fulltext"
            fi
          done
          git add content/catalog.json tests/v02i1-locale-fulltext.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "test(v02-i01): register and cover all 14 bilingual routes"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
