name: Extract Saudi article English PDF

on:
  push:
    paths:
      - ".github/workflows/extract-saudi-english.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover, download and extract English article PDF
        shell: bash
        env:
          ARTICLE_URL: "https://briqjournal.com/en/saudi-arabias-complex-cultural-hedging-between-the-us-and-china"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request

          article_url = "https://briqjournal.com/en/saudi-arabias-complex-cultural-hedging-between-the-us-and-china"
          req = urllib.request.Request(article_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")

          hrefs = re.findall(r'href=["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']', page, flags=re.I)
          candidates = []
          for href in hrefs:
              href = html.unescape(href)
              absolute = urllib.parse.urljoin(article_url, href)
              if "Saudi" in urllib.parse.unquote(absolute) or "Al-Dhafeeire" in urllib.parse.unquote(absolute):
                  candidates.append(absolute)
          if not candidates:
              raise SystemExit("Could not discover the English article PDF link from the legacy article page")
          pdf_url = candidates[0]
          print("Discovered PDF URL:", pdf_url)
          req = urllib.request.Request(pdf_url, headers={"User-Agent": "Mozilla/5.0", "Referer": article_url})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read()
          if not data.startswith(b"%PDF-"):
              raise SystemExit(f"Downloaded asset is not a PDF; first bytes={data[:20]!r}")
          open("/tmp/saudi-english.pdf", "wb").write(data)
          open("/tmp/saudi-pdf-url.txt", "w", encoding="utf-8").write(pdf_url + "\n")
          PY
          pdftotext -layout /tmp/saudi-english.pdf /tmp/saudi-english.txt
          mkdir -p tmp
          cp /tmp/saudi-english.txt tmp/saudi-english-pdf.txt
          printf '\nPDF source: %s\n' "$(cat /tmp/saudi-pdf-url.txt)" >> tmp/saudi-english-pdf.txt

      - name: Commit extracted source text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/saudi-english-pdf.txt
          git commit -m "Extract Saudi article English PDF source"
          git push origin HEAD:main
