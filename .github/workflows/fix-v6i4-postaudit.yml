name: Fix Volume 6 Issue 4 Post-Audit Findings
on:
  push:
    branches: [audit/v6i4-postaudit-fixes]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-verified fixes, validate, and safely update main
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          cat >/tmp/fix-v6i4.mjs <<'JS'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const replaceExact=(p,from,to,expected=1)=>{
            let s=fs.readFileSync(p,'utf8');
            const n=s.split(from).length-1;
            if(n!==expected) throw new Error(`${p}: expected ${expected} occurrence(s) of ${JSON.stringify(from)}, found ${n}`);
            s=s.split(from).join(to);
            fs.writeFileSync(p,s);
          };
          const kolos='rusyanin-bolgesel-guvenlikteki-rolu-uzerine-bir-inceleme-kolektif-guvenlik-antlasmasi-orgutu-ve';
          const kbase=`content/articles/${kolos}`;
          const trKeywords=['İslamcı aşırıcılık','KGAO ve teröre karşı mücadele taktikleri','Orta Asya güvenliği','Rusya’nın dış politikası','ulusötesi cihatçı ağlar'];
          const km=read(`${kbase}/metadata.json`);
          km.keywords.tr=[...trKeywords];
          write(`${kbase}/metadata.json`,km);
          const ktr=read(`${kbase}/fulltext/tr.json`);
          ktr.keywords=[...trKeywords];
          write(`${kbase}/fulltext/tr.json`,ktr);
          replaceExact(`${kbase}/fulltext/tr.json`,'Hay’at Tahrir al- Sham’ın','Hay’at Tahrir al-Sham’ın');
          replaceExact(`${kbase}/fulltext/en.json`,'CS- TO','CSTO',3);
          replaceExact(`${kbase}/fulltext/en.json`,'Kassym- Jomart','Kassym-Jomart');
          replaceExact(`${kbase}/fulltext/en.json`,'105- 124','105-124');

          const sco='content/articles/sanghay-isbirligi-orgutu-devlet-baskanlari-konseyinin-terorizm-ayrilikcilik-ve-asiriciliga-yol-acan/fulltext/en.json';
          replaceExact(sco,'CO- VID-19','COVID-19');

          const young='genc-cin-ve-genc-cinliler-cinde-aydinlanma-yeni-kultur-hareketi-ve-yeni-siyasal-bicimlenme';
          for(const loc of ['en','tr']) replaceExact(`content/articles/${young}/fulltext/${loc}.json`,'Çin Ü zerinde Kızıl Yıldız','Çin Üzerinde Kızıl Yıldız');

          const wef='content/articles/dunya-ekonomik-forumunun-kuresellesme-surecindeki-etkisinin-ekonomi-politik-elestirisi/fulltext/en.json';
          replaceExact(wef,'North- South','North-South',2);
          replaceExact(wef,'607- 608','607-608');
          replaceExact(wef,'13- 18','13-18');

          // Source PDFs are legitimately asymmetric in keyword count. Remove the old global parity assumption.
          {
            const p='tests/keyword-case.test.mjs';
            let s=fs.readFileSync(p,'utf8');
            const old=`test("keeps bilingual keyword counts and reviewed ordering in parity", async () => {\n  const { localized, current } = await loadFullTextCollections();\n\n  for (const [slug, record] of [...Object.entries(localized), ...Object.entries(current)]) {\n    const tr = record?.tr?.keywords || [];\n    const en = record?.en?.keywords || [];\n    assert.equal(tr.length, en.length, \`Turkish/English keyword count mismatch for \${slug}\`);\n  }\n`;
            const neu=`test("preserves reviewed bilingual keyword decisions without forcing source-language symmetry", async () => {\n  const { localized, current } = await loadFullTextCollections();\n`;
            if(!s.includes(old)) throw new Error('keyword parity test preamble not found');
            s=s.replace(old,neu);
            const oldK=`  assert.deepEqual(kolosovskiy.tr.keywords, ["Orta Asya Güvenliği", "Teröre Karşı Mücadele Stratejileri", "KGAÖ", "İslami Radikalizm", "Rusya’nın Dış Politikası", "Ulusötesi Cihatçı Ağlar"]);`;
            const newK=`  assert.deepEqual(kolosovskiy.tr.keywords, ["İslamcı Aşırıcılık", "KGAO Ve Teröre Karşı Mücadele Taktikleri", "Orta Asya Güvenliği", "Rusya’nın Dış Politikası", "Ulusötesi Cihatçı Ağlar"]);`;
            if(!s.includes(oldK)) throw new Error('old Kolosovskiy keyword expectation not found');
            s=s.replace(oldK,newK);
            fs.writeFileSync(p,s);
          }

          // Strengthen the permanent issue regression test with the independent PDF audit findings.
          {
            const p='tests/v6i4-content-integrity.test.mjs';
            let s=fs.readFileSync(p,'utf8');
            const old=`assert.deepEqual(km.keywords.tr,["Orta Asya güvenliği","teröre karşı mücadele stratejileri","KGAÖ","İslami radikalizm","Rusya’nın dış politikası","ulusötesi cihatçı ağlar"]);`;
            const neu=`assert.deepEqual(km.keywords.tr,["İslamcı aşırıcılık","KGAO ve teröre karşı mücadele taktikleri","Orta Asya güvenliği","Rusya’nın dış politikası","ulusötesi cihatçı ağlar"]);`;
            if(!s.includes(old)) throw new Error('V6I4 old TR keyword expectation not found');
            s=s.replace(old,neu);
            s += `\ntest("V6I4 independent PDF audit repairs remain canonical",()=>{\n  const kolos="rusyanin-bolgesel-guvenlikteki-rolu-uzerine-bir-inceleme-kolektif-guvenlik-antlasmasi-orgutu-ve";\n  const ken=fs.readFileSync(\`content/articles/\${kolos}/fulltext/en.json\`,"utf8");\n  const ktr=fs.readFileSync(\`content/articles/\${kolos}/fulltext/tr.json\`,"utf8");\n  for(const artifact of ["CS- TO","Kassym- Jomart","105- 124"]) assert(!ken.includes(artifact),artifact);\n  assert(!ktr.includes("Hay’at Tahrir al- Sham’ın"));\n  const sco=fs.readFileSync("content/articles/sanghay-isbirligi-orgutu-devlet-baskanlari-konseyinin-terorizm-ayrilikcilik-ve-asiriciliga-yol-acan/fulltext/en.json","utf8");\n  assert(!sco.includes("CO- VID-19"));\n  const young="genc-cin-ve-genc-cinliler-cinde-aydinlanma-yeni-kultur-hareketi-ve-yeni-siyasal-bicimlenme";\n  for(const loc of ["en","tr"]) assert(!fs.readFileSync(\`content/articles/\${young}/fulltext/\${loc}.json\`,"utf8").includes("Çin Ü zerinde Kızıl Yıldız"));\n  const wef=fs.readFileSync("content/articles/dunya-ekonomik-forumunun-kuresellesme-surecindeki-etkisinin-ekonomi-politik-elestirisi/fulltext/en.json","utf8");\n  for(const artifact of ["North- South","607- 608","13- 18"]) assert(!wef.includes(artifact),artifact);\n});\n`;
            fs.writeFileSync(p,s);
          }
          JS

          apply_changes(){
            node /tmp/fix-v6i4.mjs
            node scripts/generate-archive-data.mjs
            node scripts/generate-fulltext-modules.mjs
            node scripts/generate-runtime-data.mjs
            node --test tests/v6i4-content-integrity.test.mjs tests/keyword-case.test.mjs tests/article-metadata-v2.test.mjs
            git diff --check
          }

          for ATTEMPT in 1 2 3 4 5 6; do
            git fetch origin main
            BASE="$(git rev-parse origin/main)"
            git reset --hard "$BASE"
            git clean -fd
            apply_changes
            npm test
            npm run lint
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
              echo "main advanced during validation attempt $ATTEMPT; retrying"
              continue
            fi
            git config user.name 'BRIQ Journal'
            git config user.email 'briq@briqjournal.com'
            git add content scripts tests app
            git commit -m 'Fix Volume 6 Issue 4 independent audit findings'
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
              git push origin HEAD:main
              exit 0
            fi
            echo "main advanced after validation attempt $ATTEMPT; retrying"
          done
          echo 'main kept advancing; refusing unsafe push'; exit 1