name: One-time Cilt 4 catalog fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cilt4-catalog-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Cilt 4 catalog order
        run: node scripts/tmp-fix-cilt4-catalog.mjs
      - name: Commit catalog change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Add Cilt 4 Issue 1 visual entries to article order"
          git push origin HEAD:main
