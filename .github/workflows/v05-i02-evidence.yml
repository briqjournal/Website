name: Capture v05-i02 canonical migration evidence

on:
  push:
    branches:
      - chore/v05-i02-fulltext-canonical
    paths:
      - '.github/workflows/v05-i02-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF and image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Capture authoritative article-PDF evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess, tempfile, urllib.parse, urllib.request, shutil

          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v05-i02.json").read_text())
          evidence=root/"tmp/v05-i02-evidence"
          evidence.mkdir(parents=True,exist_ok=True)

          def download(url,target):
              p=urllib.parse.urlparse(url)
              if p.scheme!="https" or p.hostname not in {"briqjournal.com","www.briqjournal.com"}:
                  raise SystemExit(f"bad authoritative PDF URL: {url}")
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=90) as r, target.open("wb") as f:
                  shutil.copyfileobj(r,f)

          for slug in issue["articles"]:
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              out=evidence/slug
              out.mkdir(parents=True,exist_ok=True)
              manifest={"slug":slug,"locales":{}}

              for locale,key in (("en","pdfEn"),("tr","pdfTr")):
                  url=meta["urls"][key]
                  pdf=out/f"{locale}.pdf"
                  download(url,pdf)

                  raw=subprocess.check_output(["pdftotext","-enc","UTF-8",str(pdf),"-"],text=True,errors="replace")
                  layout=subprocess.check_output(["pdftotext","-layout","-enc","UTF-8",str(pdf),"-"],text=True,errors="replace")
                  (out/f"{locale}-raw.txt").write_text(raw,encoding="utf-8")
                  (out/f"{locale}-layout.txt").write_text(layout,encoding="utf-8")

                  info=subprocess.check_output(["pdfinfo",str(pdf)],text=True,errors="replace")
                  (out/f"{locale}-pdfinfo.txt").write_text(info,encoding="utf-8")
                  pages=0
                  for line in info.splitlines():
                      if line.startswith("Pages:"):
                          pages=int(line.split(":",1)[1].strip())

                  listing=subprocess.check_output(["pdfimages","-list",str(pdf)],text=True,errors="replace")
                  (out/f"{locale}-pdfimages-list.txt").write_text(listing,encoding="utf-8")

                  page_dir=out/f"{locale}-pages"
                  page_dir.mkdir(exist_ok=True)
                  render_pages=sorted(set([1,pages] if pages else [1]))
                  for page in render_pages:
                      prefix=page_dir/f"p{page:02d}"
                      subprocess.run(["pdftoppm","-f",str(page),"-singlefile","-jpeg","-r","110",str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

                  images_dir=out/f"{locale}-images"
                  images_dir.mkdir(exist_ok=True)
                  with tempfile.TemporaryDirectory() as td:
                      prefix=pathlib.Path(td)/"img"
                      subprocess.run(["pdfimages","-png",str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      selected=[]
                      for idx,p in enumerate(sorted(pathlib.Path(td).glob("img-*.png")),start=1):
                          dims=subprocess.check_output(["identify","-format","%w %h",str(p)],text=True).split()
                          w,h=map(int,dims)
                          if w*h < 120000 or min(w,h)<180:
                              continue
                          name=f"candidate-{idx:03d}.jpg"
                          subprocess.run(["convert",str(p),"-strip","-quality","88",str(images_dir/name)],check=True)
                          selected.append({"source_index":idx,"width":w,"height":h,"file":name})
                      (out/f"{locale}-images.json").write_text(json.dumps(selected,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

                  pdf.unlink()
                  manifest["locales"][locale]={"url":url,"pages":pages}

              (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i02-evidence
          git commit -m 'Capture v05-i02 authoritative PDF evidence'
          git pull --rebase origin chore/v05-i02-fulltext-canonical
          git push origin HEAD:chore/v05-i02-fulltext-canonical
