name: Trigger BRIQ policy updater
on:
  push:
    paths:
      - '.github/workflows/briq-policy-update-temp.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger one-time policy update workflow
        run: |
          printf '\n' >> .github/workflows/apply-briq-trdizin-doaj-updates.yml
          git rm .github/workflows/briq-policy-update-temp.yml
          git config user.name "BRIQ Site Bot"
          git config user.email "briq@briqjournal.com"
          git add -A
          git commit -m "Apply one-time BRIQ policy updates"
          git push
