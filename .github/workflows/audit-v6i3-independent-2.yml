name: Independent V6I3 PDF audit 2

on:
  push:
    branches:
      - audit/v6i3-independent-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF audit dependency
        run: python3 -m pip install --quiet pymupdf
      - name: Run independent PDF audit
        run: python3 scripts/audit-v6i3-independent.py
      - name: Print suspicious-content contexts
        run: python3 scripts/probe-v6i3-suspicious.py
