name: Apply BRIQ footer and declarations refinements

on:
  push:
    paths:
      - '.github/workflows/briq-footer-declarations-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply requested refinements
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:140]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          chrome = 'app/components/SiteChrome.tsx'
          article = 'app/components/ArticlePlatform.tsx'

          replace(
              chrome,
              '? "Published by the Turkish-Chinese Business Development and Friendship Association."\n              : "Çin İş Geliştirme ve Dostluk Derneği tarafından yayımlanmaktadır."',
              '? "Publisher: Turkish-Chinese Business Development and Friendship Association"\n              : "Yayıncı: Çin İş Geliştirme ve Dostluk Derneği"',
          )

          replace(article, '    informedConsent?: string;\n', '')
          replace(article, '        informedConsent: "Bu makale için bilgilendirilmiş onam beyanı kaynak kaydında ayrıca belirtilmemiştir.",\n', '')
          replace(article, '        informedConsent: "A separate informed-consent statement is not available in the source record for this article.",\n', '')
          replace(article, '    informedConsent: declarations?.informedConsent?.trim() || missing.informedConsent,\n', '')
          replace(article, '    ["bilgilendirilmis-onam", "Bilgilendirilmiş Onam", values.informedConsent],\n', '')
          replace(article, '    ["informed-consent", "Informed Consent", values.informedConsent],\n', '')

          old_component = '''function ResearchStatements({ items, locale }: { items: StatementItem[]; locale: "tr" | "en" }) {
  if (!items.length) return null;
  return (
    <>
      <p className="section-kicker">{locale === "tr" ? "Beyanlar" : "Declarations"}</p>
      {items.map(({ id, label, value }) => (
        <details className="article-accordion article-declaration-accordion" id={id} key={id}>
          <summary><span>{label}</span><b>{locale === "tr" ? "Beyan" : "Statement"}</b></summary>
          <div className="accordion-copy"><p>{value}</p></div>
        </details>
      ))}
    </>
  );
}'''
          new_component = '''function ResearchStatements({ items, locale }: { items: StatementItem[]; locale: "tr" | "en" }) {
  if (!items.length) return null;
  const id = locale === "tr" ? "yazar-beyanlari" : "author-declarations";
  return (
    <details className="article-accordion article-declaration-accordion" id={id}>
      <summary><span>{locale === "tr" ? "Yazarın Beyanları" : "Author Declarations"}</span><b>{items.length}</b></summary>
      <div className="accordion-copy article-declaration-group">
        {items.map(({ id: itemId, label, value }) => (
          <section className="article-declaration-item" id={itemId} key={itemId}>
            <h3>{label}</h3>
            <p>{value}</p>
          </section>
        ))}
      </div>
    </details>
  );
}'''
          replace(article, old_component, new_component)

          replace(
              article,
              '    ...statements.map(({ id, label }) => ({ id, label, level: 1 })),\n',
              '    ...(statements.length ? [{ id: locale === "tr" ? "yazar-beyanlari" : "author-declarations", label: locale === "tr" ? "Yazarın Beyanları" : "Author Declarations", level: 1 }] : []),\n',
          )
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit site updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/SiteChrome.tsx app/components/ArticlePlatform.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine publisher footer and author declarations"
          git push
