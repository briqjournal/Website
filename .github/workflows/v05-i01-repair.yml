name: v05-i01 prose repair
on:
  push:
    branches:
      - chore/v05-i01-fulltext-canonical
    paths:
      - '.github/workflows/v05-i01-repair.yml'
      - 'tmp/v05-i01-repair.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python3 tmp/v05-i01-repair.py
      - name: Validate repaired candidates
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path("tmp/v05-i01-candidates")
          for p in root.glob("*/[et][nr].json"):
              j=json.loads(p.read_text())
              assert j.get("sections"), p
              assert len({s["id"] for s in j["sections"]})==len(j["sections"]), p
              assert len({r["id"] for r in j.get("references",[])})==len(j.get("references",[])), p
              assert len({n["id"] for n in j.get("footnotes",[])})==len(j.get("footnotes",[])), p
              for r in j.get("references",[]):
                  if "http" in r["text"]:
                      u=r["text"][r["text"].find("http"):]
                      assert not re.search(r"\s",u), (p,r["text"])
              for f in j.get("figures",[]):
                  assert not re.match(r"^(Visual|Görsel)\s+\d+$",f["caption"]), (p,f)
          PY
      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/v05-i01-candidates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair v05-i01 prose candidate fidelity"
          git push origin HEAD:chore/v05-i01-fulltext-canonical
