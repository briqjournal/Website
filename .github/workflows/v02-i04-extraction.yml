name: v02-i04 extraction evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/v02-i04-extraction.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - name: Install Poppler
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Extract official locale evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v02-i04.json").read_text())
          out=root/".evidence/v02-i04"
          out.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for slug in issue["articles"]:
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              urls=meta.get("urls",{})
              for loc,key in (("en","pdfEn"),("tr","pdfTr")):
                  url=urls.get(key)
                  if not url: raise SystemExit(f"missing {key}: {slug}")
                  d=out/slug/loc; d.mkdir(parents=True,exist_ok=True)
                  pdf=d/f"{slug}-{loc}.pdf"
                  req=urllib.request.Request(url,headers={"User-Agent":"BRIQ-v02-i04-extraction/1.0"})
                  with urllib.request.urlopen(req,timeout=120) as r, pdf.open("wb") as f:
                      while True:
                          b=r.read(1024*1024)
                          if not b: break
                          f.write(b)
                  subprocess.run(["pdftotext",str(pdf),str(d/"plain.txt")],check=True)
                  subprocess.run(["pdftotext","-layout",str(pdf),str(d/"layout.txt")],check=True)
                  with (d/"struct.xml").open("wb") as f:
                      subprocess.run(["pdftotext","-bbox-layout",str(pdf),"-"],stdout=f,check=True)
                  with (d/"pdfimages-list.txt").open("wb") as f:
                      subprocess.run(["pdfimages","-list",str(pdf)],stdout=f,check=True)
                  imgdir=d/"embedded-images"; imgdir.mkdir(exist_ok=True)
                  subprocess.run(["pdfimages","-all",str(pdf),str(imgdir/"img")],check=True)
                  with (d/"pdfinfo.txt").open("wb") as f:
                      subprocess.run(["pdfinfo",str(pdf)],stdout=f,check=True)
                  manifest.append({"slug":slug,"locale":loc,"url":url,"pdf":str(pdf),"images":len(list(imgdir.iterdir()))})
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Build canonical records and exact production assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root=pathlib.Path("."); ev=root/".evidence/v02-i04"
          issue=json.loads((root/"content/issues/v02-i04.json").read_text())
          starts={
            "ipek-yolunda-kulturel-bir-gezinti-ahmet-yeseviden-yunus-emreye-turk-sufi-humanizmi":{"en":"Past and Future on the Silk Road","tr":"İpek Yolu’nda Geçmiş ve Gelecek"},
            "zaman-ve-mekani-asacak-yeni-bir-medeniyet-icin-isbirligi":{"en":"Editor’s Note:","tr":"Editör Notu:"},
            "cin-ve-arap-ulkeleri-arasindaki-kulturel-alisverislerin-gelisimi-kusak-ve-yol-caginda-firsatlar-ve":{"en":"Introduction","tr":"Giriş"},
            "kusak-yolun-kalp-atislari":{"en":"Introduction","tr":"Giriş"},
            "senin-kokun-duydu-canim-yunus-emre-misralari-anadolu-xiii-xiv-yuzyillar":{"en":"YÛNUS IS A TURKISH","tr":"YUNUS YA DA YONAH"},
            "kusak-ve-yol-girisimi-kapsaminda-cinin-ortadogu-ile-kulturel-iletisimi-degerlendirme-ve-beklentiler":{"en":"Introduction","tr":"Giriş"},
            "macaes-b-2019-kusak-ve-yol-cinli-bir-dunya-duzeni-londra-hurst-company":{"en":"THE PURPOSE OF THE BELT","tr":"KUŞAK VE YOL GİRİŞİMİ’NİN"},
            "ibrahim-balaban":{"en":"İbrahim Balaban was born","tr":"İbrahim Balaban, 1921"},
            "karikatur-0":{"en":"Turhan Selçuk was born","tr":"Turhan Selçuk 1922"}
          }
          def chunks(p):
            t=p.read_text()
            out=[]
            for x in re.split(r"\n\s*\n",t):
              if not x.strip(): continue
              x=x.replace("\f"," ")
              x=re.sub(r"([A-Za-zÀ-ž])-[ \t]*\n[ \t]*([a-zà-ž])",r"\1\2",x)
              x=re.sub(r"\s+"," ",x).strip()
              if re.fullmatch(r"\d+",x) or re.match(r"^B\s*R\s*I\s*q\s*•",x,re.I): continue
              if x.startswith("How to cite:") or x.startswith("Atıf:"): continue
              if "-" in x and any(n in x for n in ("Latif Bolat","Hüseyin Haydar","Giampiero Bellingeri","Liang Yingying","Sun Degang")): continue
              out.append(x)
            return out
          def image_rows(p):
            rows=[]
            for line in p.read_text().splitlines()[2:]:
              m=re.match(r"\s*(\d+)\s+(\d+)\s+image\s+(\d+)\s+(\d+)",line)
              if m: rows.append(tuple(map(int,m.groups())))
            return rows
          for slug in issue["articles"]:
            if slug=="ipek-yolunun-geri-donusu": continue
            for loc in ("en","tr"):
              d=ev/slug/loc; cs=chunks(d/"plain.txt"); marker=starts[slug][loc]
              idx=next(i for i,x in enumerate(cs) if marker.lower() in x.lower())
              body=cs[idx:]
              # Remove front-matter fragments that can reappear because of two-column extraction.
              body=[x for x in body if not x.startswith(("Victor Manuel Isidro Luna is an instructor","* Çeviri:","Victor Manuel Isidro Luna, National"))]
              # Merge only strong column/page continuation signals.
              paras=[]
              for x in body:
                x=re.sub(r"\s+(?:[4-7][0-9])$","",x)
                if paras and (x[:1].islower() or paras[-1].endswith((",", ";", ":", "—"))): paras[-1]+=" "+x
                else: paras.append(x)
              outdir=root/"content/articles"/slug/"fulltext"; outdir.mkdir(parents=True,exist_ok=True)
              obj={"sections":[{"id":loc+"-section-1","title":"Full Text" if loc=="en" else "Tam Metin","paragraphs":paras}],"keywords":[],"footnotes":[],"references":[],"acknowledgements":"","figures":[]}
              pages=(d/"plain.txt").read_text().split("\f")
              selected=[]
              for page,num,w,h in image_rows(d/"pdfimages-list.txt"):
                if w<300 or h<250: continue
                if slug=="karikatur-0" and not w>h: continue
                if slug=="zaman-ve-mekani-asacak-yeni-bir-medeniyet-icin-isbirligi" and w<500: continue
                selected.append((page,num,w,h))
              for k,(page,num,w,h) in enumerate(selected,1):
                cand=list((d/"embedded-images").glob(f"img-{num:03}.*"))
                if not cand: continue
                src=cand[0]; asset=root/"public/assets/article-figures"/slug
                asset.mkdir(parents=True,exist_ok=True)
                fn=f"{loc}-figure-{k:02}{src.suffix.lower()}"; shutil.copyfile(src,asset/fn)
                pcs=[re.sub(r"\s+"," ",x).strip() for x in re.split(r"\n\s*\n",pages[page-1]) if x.strip()]
                caps=[x for x in pcs if len(x)<350 and ("(" in x or "Harita " in x or "Map " in x) and not x.startswith(("How to cite:","Atıf:"))]
                cap=caps[0] if caps else ""
                if slug=="ibrahim-balaban": cap="İbrahim Balaban"
                if slug=="karikatur-0": cap="Cartoon" if loc=="en" else "Karikatür"
                if slug.startswith("macaes-"): cap="Belt and Road: A Chinese World Order" if loc=="en" else "Kuşak ve Yol: Çinli Bir Dünya Düzeni"
                obj["figures"].append({"id":f"figure-{k}","src":f"/assets/article-figures/{slug}/{fn}","caption":cap})
              (outdir/f"{loc}.json").write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Commit canonical content
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add content/articles/*/fulltext/en.json content/articles/*/fulltext/tr.json public/assets/article-figures/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(v02-i04): build canonical locale full text from official PDFs"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: v02-i04-extraction-evidence
          path: .evidence/v02-i04
          if-no-files-found: error
          retention-days: 7

# canonical build trigger
