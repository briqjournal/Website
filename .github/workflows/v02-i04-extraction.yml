name: v02-i04 extraction evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/v02-i04-extraction.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Extract official locale evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v02-i04.json").read_text())
          out=root/".evidence/v02-i04"
          out.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for slug in issue["articles"]:
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              urls=meta.get("urls",{})
              for loc,key in (("en","pdfEn"),("tr","pdfTr")):
                  url=urls.get(key)
                  if not url: raise SystemExit(f"missing {key}: {slug}")
                  d=out/slug/loc; d.mkdir(parents=True,exist_ok=True)
                  pdf=d/f"{slug}-{loc}.pdf"
                  req=urllib.request.Request(url,headers={"User-Agent":"BRIQ-v02-i04-extraction/1.0"})
                  with urllib.request.urlopen(req,timeout=120) as r, pdf.open("wb") as f:
                      while True:
                          b=r.read(1024*1024)
                          if not b: break
                          f.write(b)
                  subprocess.run(["pdftotext",str(pdf),str(d/"plain.txt")],check=True)
                  subprocess.run(["pdftotext","-layout",str(pdf),str(d/"layout.txt")],check=True)
                  with (d/"struct.xml").open("wb") as f:
                      subprocess.run(["pdftotext","-bbox-layout",str(pdf),"-"],stdout=f,check=True)
                  with (d/"pdfimages-list.txt").open("wb") as f:
                      subprocess.run(["pdfimages","-list",str(pdf)],stdout=f,check=True)
                  imgdir=d/"embedded-images"; imgdir.mkdir(exist_ok=True)
                  subprocess.run(["pdfimages","-all",str(pdf),str(imgdir/"img")],check=True)
                  with (d/"pdfinfo.txt").open("wb") as f:
                      subprocess.run(["pdfinfo",str(pdf)],stdout=f,check=True)
                  manifest.append({"slug":slug,"locale":loc,"url":url,"pdf":str(pdf),"images":len(list(imgdir.iterdir()))})
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v02-i04-extraction-evidence
          path: .evidence/v02-i04
          if-no-files-found: error
          retention-days: 7

# extraction trigger
