name: Update BRIQ test expectations

on:
  push:
    paths:
      - '.github/workflows/briq-test-expectations-temp.yml'

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rendered HTML expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/rendered-html.test.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('assert.match(trHtml, /Çin Araştırmaları Enstitüsü tarafından yayımlanmaktadır/);',
             'assert.match(trHtml, /Çin İş Geliştirme ve Dostluk Derneği tarafından yayımlanmaktadır/);'),
            ('assert.match(enHtml, /China Research Institute of the China Business Development and Friendship Association/);',
             'assert.match(enHtml, /Turkish-Chinese Business Development and Friendship Association/);'),
            ('  assert.equal((doiHtml.match(/class="article-declaration"/g) || []).length, 1);\n  assert.match(doiHtml, /Finansman beyanı/);\n  assert.doesNotMatch(doiHtml, /Çıkar çatışması beyanı/);',
             '  assert.equal((doiHtml.match(/<details class="article-accordion article-declaration-accordion" id="yazar-beyanlari">/g) || []).length, 1);\n  assert.equal((doiHtml.match(/class="article-declaration-item"/g) || []).length, 4);\n  assert.match(doiHtml, /Yazarın Beyanları/);\n  assert.match(doiHtml, /Yazar Katkıları/);\n  assert.match(doiHtml, /Finansman \/ Destek/);\n  assert.match(doiHtml, /Çıkar Çatışması/);\n  assert.match(doiHtml, /Etik Kurul Onayı/);\n  assert.doesNotMatch(doiHtml, /Bilgilendirilmiş Onam/);'),
            ('  assert.match(trHome, /Çin İş Geliştirme ve Dostluk derneği bünyesinde yer alan Çin Araştırmaları Enstitüsü \\(ICST\\) tarafından yayımlanmaktadır/);\n  assert.match(enHome, /Published by the Institute for China Studies in Türkiye \\(ICST\\), which operates within the China Business Development and Friendship Association/);',
             '  assert.match(trHome, /Yayıncı: Çin İş Geliştirme ve Dostluk Derneği/);\n  assert.match(enHome, /Publisher: Turkish-Chinese Business Development and Friendship Association/);'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:120]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git commit -m "Update tests for publisher and author declarations"
          git push
