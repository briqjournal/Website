name: Audit V7I3 full-text integrity
on:
  push:
    branches: [automation/v7i3-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structural and content audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit-v7i3.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const issue = JSON.parse(fs.readFileSync('content/issues/v07-i03.json','utf8'));
          const catalog = JSON.parse(fs.readFileSync('content/catalog.json','utf8'));
          const errors=[]; const warnings=[]; const report=[];
          const norm=(v)=>String(v??'').replace(/\s+/g,' ').trim();
          const strings=(d)=>[
            ...(d.sections??[]).flatMap(s=>[s.title,...(s.paragraphs??[])]),
            ...(d.footnotes??[]).map(x=>x.text),
            ...(d.references??[]).map(x=>x.text),
            ...(d.figures??[]).flatMap(x=>[x.caption,x.source,x.alt]),
          ].map(norm).filter(Boolean);
          const narrative=(d)=>[
            ...(d.sections??[]).flatMap(s=>[s.title,...(s.paragraphs??[])]),
            ...(d.footnotes??[]).map(x=>x.text),
            ...(d.figures??[]).flatMap(x=>[x.caption,x.source,x.alt]),
          ].map(norm).filter(Boolean);
          function auditUrl(slug,locale,ref){
            const s=norm(ref.text); const i=s.search(/https?:\/\//i); if(i<0)return;
            const tail=s.slice(i); const marker=tail.search(/\s+(?:adresinden|adresine)\b/iu);
            const url=marker>=0?tail.slice(0,marker):tail.replace(/[.,;:]$/,'');
            if(/\s/.test(url)) errors.push(`${slug}/${locale}: broken URL ${ref.id}: ${url}`);
            if(/^https:\/\/10\./i.test(url)) errors.push(`${slug}/${locale}: malformed DOI URL ${ref.id}: ${url}`);
          }
          function auditDoi(slug,locale,ref){
            const s=norm(ref.text); const m=s.match(/\bdoi:\s*(10\..*)$/iu); if(!m)return;
            const doi=m[1].replace(/[.,;:]$/,'');
            if(/\s/.test(doi)) errors.push(`${slug}/${locale}: split DOI ${ref.id}: ${doi}`);
          }
          if(issue.volume!==7||issue.issue!==3) errors.push('wrong issue descriptor');
          if(issue.articles?.length!==8) errors.push(`expected 8 contributions, got ${issue.articles?.length}`);
          for(const p of [issue.cover_tr,issue.cover_en]){const disk=p?.startsWith('/')?`public${p}`:p;if(!disk||!fs.existsSync(disk))errors.push(`missing cover ${p}`)}
          for(const slug of issue.articles??[]){
            const base=path.join('content/articles',slug); const dir=path.join(base,'fulltext');
            const meta=JSON.parse(fs.readFileSync(path.join(base,'metadata.json'),'utf8'));
            const files=fs.readdirSync(dir).sort(); if(JSON.stringify(files)!==JSON.stringify(['en.json','tr.json']))errors.push(`${slug}: noncanonical fulltext files ${files.join(',')}`);
            const en=JSON.parse(fs.readFileSync(path.join(dir,'en.json'),'utf8')); const tr=JSON.parse(fs.readFileSync(path.join(dir,'tr.json'),'utf8'));
            if(meta.slug!==slug||meta.volume!==7||meta.issue!==3)errors.push(`${slug}: metadata identity mismatch`);
            if(meta.published_online_date!=='2026-06-01')errors.push(`${slug}: published_online_date=${meta.published_online_date??'MISSING'}`);
            for(const k of ['title_tr','title_en','author','pages','source_tr','source_en','pdf_tr_source','pdf_en_source'])if(!norm(meta[k]))errors.push(`${slug}: missing ${k}`);
            if(!catalog.fulltext.localized.includes(slug)||catalog.fulltext.current.includes(slug)||catalog.fulltext.en_archive.includes(slug))errors.push(`${slug}: catalog membership wrong`);
            if(slug==='kusak-ve-yolun-guvenligi-ozel-guvenlik-risk-ve-cinin-kuresel-genislemesi'){
              if(/^Abstract\s+/i.test(meta.abstract_en??'')||/^Abstract\s*\n/i.test(meta.abstract_en??''))warnings.push(`${slug}: book-review abstract_en contains an 'Abstract' label`);
              if(/Arduino, A\. \(2018\)/.test(meta.abstract_en??''))errors.push(`${slug}: book-review abstract_en is only the reviewed-book citation`);
              if(/Arduino, A\. \(2018\)/.test(meta.abstract_tr??''))errors.push(`${slug}: book-review abstract_tr is only the reviewed-book citation`);
            }
            for(const [locale,d] of [['en',en],['tr',tr]]){
              if(!d.sections?.length)errors.push(`${slug}/${locale}: no sections`);
              const ids=new Set(); for(const [n,s] of (d.sections??[]).entries()){
                if(!s.id||ids.has(s.id))errors.push(`${slug}/${locale}: bad section id ${s.id}`); else ids.add(s.id);
                if(!norm(s.title))warnings.push(`${slug}/${locale}: empty section title ${n+1}`);
                if(!Array.isArray(s.paragraphs))errors.push(`${slug}/${locale}: section paragraphs invalid ${n+1}`);
              }
              const rids=new Set(); for(const r of d.references??[]){if(!r.id||rids.has(r.id))errors.push(`${slug}/${locale}: bad ref id ${r.id}`);else rids.add(r.id);if(!norm(r.text))errors.push(`${slug}/${locale}: empty ref ${r.id}`);auditUrl(slug,locale,r);auditDoi(slug,locale,r)}
              for(const s of strings(d)){if(s.includes('\uFFFD'))errors.push(`${slug}/${locale}: replacement char`);if(s.includes('\u00AD'))warnings.push(`${slug}/${locale}: soft hyphen`)}
              for(const s of narrative(d)){const m=s.match(/(?<=[A-Za-zÀ-ž])\d{3}\s+(?=[A-Za-zÀ-ž])/u);if(m)errors.push(`${slug}/${locale}: embedded page token ${m[0]} :: ${s.slice(Math.max(0,m.index-45),m.index+70)}`)}
              for(const f of d.figures??[]){if(f.src?.startsWith('/assets/')){const disk=`public${f.src}`;if(!fs.existsSync(disk))warnings.push(`${slug}/${locale}: figure asset not in repo ${f.src}`)}}
            }
            const enText=strings(en).join(' '),trText=strings(tr).join(' '); if(enText===trText)errors.push(`${slug}: EN/TR identical`);
            const es=(enText.match(/\b(the|and|of|to|in|is|that|for|with|as)\b/gi)??[]).length, et=(enText.match(/\b(ve|bir|bu|için|ile|olarak|olan|gibi)\b/gi)??[]).length;if(enText.length>1200&&es<Math.max(20,et*1.25))errors.push(`${slug}: EN language sanity ${es}/${et}`);
            if((en.keywords?.length??0)!==(tr.keywords?.length??0))errors.push(`${slug}: keyword parity ${en.keywords?.length??0}/${tr.keywords?.length??0}`);
            report.push({slug,pages:meta.pages,enSec:en.sections?.length??0,trSec:tr.sections?.length??0,enPar:(en.sections??[]).reduce((n,s)=>n+(s.paragraphs?.length??0),0),trPar:(tr.sections??[]).reduce((n,s)=>n+(s.paragraphs?.length??0),0),enRef:en.references?.length??0,trRef:tr.references?.length??0,kw:`${en.keywords?.length??0}/${tr.keywords?.length??0}`,published:meta.published_online_date??''});
          }
          console.log('=== V7I3 AUDIT TABLE ===');console.table(report);
          console.log('=== ERRORS ===');errors.forEach(x=>console.log('- '+x));if(!errors.length)console.log('none');
          console.log('=== WARNINGS ===');warnings.forEach(x=>console.log('- '+x));if(!warnings.length)console.log('none');
          console.log(`SUMMARY ${errors.length} errors / ${warnings.length} warnings`);
          JS
          node /tmp/audit-v7i3.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generators in canonical order
        run: |
          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs
          git diff --check
      - name: Targeted tests
        run: node --test tests/v7i3-locale-fulltext.test.mjs tests/keyword-case.test.mjs tests/oai-pmh.test.mjs
      - name: Production build
        run: npm run build
      - name: Render tests after build
        run: node --test tests/rendered-html.test.mjs
      - name: Full test suite
        run: npm test
