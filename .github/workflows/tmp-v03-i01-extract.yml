name: Temporary v03-i01 extraction

on:
  push:
    branches:
      - chore/v03-i01-fulltext-canonical
    paths:
      - .github/workflows/tmp-v03-i01-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v03-i01-fulltext-canonical
          fetch-depth: 1

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download authoritative issue PDFs
        run: |
          set -euxo pipefail
          mkdir -p tmp/v03-i01
          curl -fL --retry 3 --retry-delay 2 \
            'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-12/BRIQ%20Vol.3%20Issue1_Site.pdf' \
            -o /tmp/v03-i01-en.pdf
          curl -fL --retry 3 --retry-delay 2 \
            'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-12/BRIQ%203.%20Cilt%201.%20Say%C4%B1_Site.pdf' \
            -o /tmp/v03-i01-tr.pdf
          sha256sum /tmp/v03-i01-en.pdf /tmp/v03-i01-tr.pdf > tmp/v03-i01/pdf-sha256.txt
          pdfinfo /tmp/v03-i01-en.pdf > tmp/v03-i01/en-pdfinfo.txt
          pdfinfo /tmp/v03-i01-tr.pdf > tmp/v03-i01/tr-pdfinfo.txt

      - name: Extract text, structural XML, and image inventory
        run: |
          set -euxo pipefail
          pdftotext -layout -enc UTF-8 /tmp/v03-i01-en.pdf tmp/v03-i01/en.txt
          pdftotext -layout -enc UTF-8 /tmp/v03-i01-tr.pdf tmp/v03-i01/tr.txt
          pdftohtml -xml -hidden -i -stdout /tmp/v03-i01-en.pdf > tmp/v03-i01/en.xml
          pdftohtml -xml -hidden -i -stdout /tmp/v03-i01-tr.pdf > tmp/v03-i01/tr.xml
          pdfimages -list /tmp/v03-i01-en.pdf > tmp/v03-i01/en-images.txt
          pdfimages -list /tmp/v03-i01-tr.pdf > tmp/v03-i01/tr-images.txt

      - name: Commit extraction evidence
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/v03-i01
          git commit -m 'chore(v03-i01): add temporary PDF extraction evidence'
          git push origin HEAD:chore/v03-i01-fulltext-canonical
