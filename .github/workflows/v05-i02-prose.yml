name: Build v05-i02 prose candidates

on:
  push:
    branches:
      - chore/v05-i02-fulltext-canonical
    paths:
      - '.github/workflows/v05-i02-prose.yml'

permissions:
  contents: write

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF and image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - name: Download official article PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, shutil, urllib.parse, urllib.request
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v05-i02.json").read_text())
          out=root/"tmp/v05-i02-pdfs"
          out.mkdir(parents=True,exist_ok=True)
          for slug in issue["articles"][:9]:
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              for locale,key in (("tr","pdfTr"),("en","pdfEn")):
                  url=meta["urls"][key]
                  p=urllib.parse.urlparse(url)
                  if p.scheme!="https" or p.hostname not in {"briqjournal.com","www.briqjournal.com"}:
                      raise SystemExit(f"bad PDF URL: {url}")
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=90) as r, (out/f"{slug}-{locale}.pdf").open("wb") as f:
                      shutil.copyfileobj(r,f)
          PY
      - name: Extract candidates and figures
        run: node tmp/v05-i02-extractor.mjs 5-2
      - name: Commit durable prose batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/v05-i02-pdfs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i02-candidates public/assets/article-figures
          git commit -m 'Build v05-i02 prose candidates and figure assets'
          git pull --rebase origin chore/v05-i02-fulltext-canonical
          git push origin HEAD:chore/v05-i02-fulltext-canonical
