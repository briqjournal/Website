name: Probe v06-i03 figure assets

on:
  push:
    branches:
      - audit/v06-i03-fulltext-fidelity
    paths:
      - tmp/v06-i03-figure-probe-trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v06-i03-fulltext-fidelity
      - name: Inspect production asset dimensions
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y imagemagick >/dev/null
          out=tmp/v06-i03-figure-probe.txt
          : > "$out"
          for slug in \
            70-yilinda-bandung-baglantisizliktan-hegemonyaciliga-karsi-milli-devletlerin-ortak-kalkinma-ve \
            yeni-bir-enerji-kaynagi-olarak-gaz-hidratlar; do
            echo "## $slug" >> "$out"
            for f in public/assets/article-figures/$slug/*; do
              [ -f "$f" ] || continue
              printf '%s\t' "$(basename "$f")" >> "$out"
              identify -format '%wx%h %m\n' "$f" >> "$out"
            done
          done
      - name: Commit probe
        run: |
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add -f tmp/v06-i03-figure-probe.txt
          git commit -m "chore: capture v06-i03 figure asset probe"
          git push origin HEAD:audit/v06-i03-fulltext-fidelity
