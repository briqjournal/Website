name: Split full-text runtime data

on:
  push:
    paths:
      - ".github/workflows/split-fulltext-runtime.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Add build-time full-text module generator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/generate-fulltext-modules.mjs <<'EOF'
          import { mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import { join, relative } from "node:path";

          const root = process.cwd();
          const appDir = join(root, "app");
          const outputRoot = join(appDir, "generated-fulltext");
          const currentOutput = join(outputRoot, "current");
          const archiveOutput = join(outputRoot, "en-archive");
          const safeSlug = /^[a-z0-9-]+$/;

          async function readJson(path) {
            return JSON.parse(await readFile(path, "utf8"));
          }

          function assertSlug(slug, source) {
            if (!safeSlug.test(slug)) {
              throw new Error(`Unsafe article slug in ${source}: ${slug}`);
            }
          }

          async function writeEntries(entries, directory, source) {
            await mkdir(directory, { recursive: true });
            for (const [slug, value] of entries) {
              assertSlug(slug, source);
              await writeFile(
                join(directory, `${slug}.json`),
                `${JSON.stringify(value)}\n`,
                "utf8",
              );
            }
          }

          const currentSource = join(appDir, "article-fulltext-current.json");
          const archiveSource = join(appDir, "article-fulltext-en-archive.json");
          const current = await readJson(currentSource);
          const archive = await readJson(archiveSource);
          const currentEntries = Object.entries(current).sort(([a], [b]) => a.localeCompare(b));
          const archiveEntries = Object.entries(archive).sort(([a], [b]) => a.localeCompare(b));

          await rm(outputRoot, { recursive: true, force: true });
          await writeEntries(currentEntries, currentOutput, "article-fulltext-current.json");
          await writeEntries(archiveEntries, archiveOutput, "article-fulltext-en-archive.json");

          const loaderLines = (entries, directory) => entries
            .map(([slug]) => `  ${JSON.stringify(slug)}: () => import(${JSON.stringify(`./${directory}/${slug}.json`)}),`)
            .join("\n");

          const loaderSource = `// Generated by scripts/generate-fulltext-modules.mjs. Do not edit by hand.\n` +
          `type JsonModule = { default: unknown };\n\n` +
          `const currentFullTextLoaders: Record<string, () => Promise<JsonModule>> = {\n${loaderLines(currentEntries, "current")}\n};\n\n` +
          `const archiveEnglishFullTextLoaders: Record<string, () => Promise<JsonModule>> = {\n${loaderLines(archiveEntries, "en-archive")}\n};\n\n` +
          `async function loadFrom(loaders: Record<string, () => Promise<JsonModule>>, slug: string) {\n` +
          `  const loader = loaders[slug];\n` +
          `  if (!loader) return undefined;\n` +
          `  const module = await loader();\n` +
          `  return module.default;\n` +
          `}\n\n` +
          `export function loadCurrentFullText(slug: string) {\n` +
          `  return loadFrom(currentFullTextLoaders, slug);\n` +
          `}\n\n` +
          `export function loadArchiveEnglishFullText(slug: string) {\n` +
          `  return loadFrom(archiveEnglishFullTextLoaders, slug);\n` +
          `}\n\n` +
          `export async function loadSaudiEnglishFullText() {\n` +
          `  const module = await import("../article-fulltext-saudi-en.json");\n` +
          `  return module.default;\n` +
          `}\n`;

          await writeFile(join(outputRoot, "loaders.ts"), loaderSource, "utf8");
          console.log(`Generated ${currentEntries.length} current full-text modules and ${archiveEntries.length} English archive modules in ${relative(root, outputRoot)}.`);
          EOF

      - name: Refactor ArticlePlatform to lazy-load per article
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/components/ArticlePlatform.tsx")
          text = path.read_text(encoding="utf-8")

          old_imports = '''import fullTextJson from "../article-fulltext-current.json";\nimport saudiEnglishFullTextJson from "../article-fulltext-saudi-en.json";\nimport archiveEnglishFullTextJson from "../article-fulltext-en-archive.json";\n'''
          new_imports = '''import {\n  loadArchiveEnglishFullText,\n  loadCurrentFullText,\n  loadSaudiEnglishFullText,\n} from "../generated-fulltext/loaders";\n'''
          if old_imports not in text:
              raise SystemExit("Expected full-text imports were not found in ArticlePlatform.tsx")
          text = text.replace(old_imports, new_imports, 1)

          old_globals = '''const currentFullText = fullTextJson as Record<string, CurrentFullTextRecord>;\nconst archiveEnglishFullText = archiveEnglishFullTextJson as Record<string, LocalizedFullText>;\nconst SAUDI_CULTURAL_HEDGING_SLUG = "suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi";\n'''
          new_globals = '''const SAUDI_CULTURAL_HEDGING_SLUG = "suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi";\n'''
          if old_globals not in text:
              raise SystemExit("Expected monolithic full-text globals were not found")
          text = text.replace(old_globals, new_globals, 1)

          old_signature = '''export function ArticlePlatform({\n'''
          new_signature = '''export async function ArticlePlatform({\n'''
          if old_signature not in text:
              raise SystemExit("ArticlePlatform function signature was not found")
          text = text.replace(old_signature, new_signature, 1)

          old_body = '''  const fullRecord = currentFullText[article.slug];\n  const storedFullText = fullRecord?.[locale];\n  const archivedEnglishFullText = archiveEnglishFullText[article.slug];\n  const fullText = locale === "en"\n    ? (article.slug === SAUDI_CULTURAL_HEDGING_SLUG\n        ? (saudiEnglishFullTextJson as LocalizedFullText)\n        : (archivedEnglishFullText || storedFullText))\n    : storedFullText;\n'''
          new_body = '''  const fullRecord = await loadCurrentFullText(article.slug) as CurrentFullTextRecord | undefined;\n  const storedFullText = fullRecord?.[locale];\n  const archivedEnglishFullText = locale === "en" && article.slug !== SAUDI_CULTURAL_HEDGING_SLUG\n    ? await loadArchiveEnglishFullText(article.slug) as LocalizedFullText | undefined\n    : undefined;\n  const saudiEnglishFullText = locale === "en" && article.slug === SAUDI_CULTURAL_HEDGING_SLUG\n    ? await loadSaudiEnglishFullText() as LocalizedFullText\n    : undefined;\n  const fullText = locale === "en"\n    ? (saudiEnglishFullText || archivedEnglishFullText || storedFullText)\n    : storedFullText;\n'''
          if old_body not in text:
              raise SystemExit("Expected ArticlePlatform full-text selection block was not found")
          text = text.replace(old_body, new_body, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Wire generation into build and developer commands
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          build = Path("scripts/build-verified.sh")
          text = build.read_text(encoding="utf-8")
          needle = '''vinext="${SITES_PROJECT_ROOT}/node_modules/.bin/vinext"\n'''
          replacement = '''echo "Generating per-article full-text modules..."\nnode "${script_dir}/generate-fulltext-modules.mjs"\n\nvinext="${SITES_PROJECT_ROOT}/node_modules/.bin/vinext"\n'''
          if needle not in text:
              raise SystemExit("build-verified.sh insertion point not found")
          build.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["generate:fulltext"] = "node scripts/generate-fulltext-modules.mjs"
          scripts["dev"] = "npm run generate:fulltext && WRANGLER_LOG_PATH=.wrangler/wrangler.log vite"
          scripts["lint"] = "npm run generate:fulltext && bash scripts/sites-env.sh -- eslint . --ignore-pattern dist --ignore-pattern .next --ignore-pattern app/generated-fulltext"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          gitignore = Path(".gitignore")
          ignored = gitignore.read_text(encoding="utf-8")
          line = "/app/generated-fulltext/\n"
          if line not in ignored:
              if not ignored.endswith("\n"):
                  ignored += "\n"
              ignored += line
          gitignore.write_text(ignored, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and verify split runtime chunks
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const current = JSON.parse(fs.readFileSync('app/article-fulltext-current.json', 'utf8'));
          const archive = JSON.parse(fs.readFileSync('app/article-fulltext-en-archive.json', 'utf8'));
          const currentFiles = fs.readdirSync('app/generated-fulltext/current').filter((name) => name.endsWith('.json'));
          const archiveFiles = fs.readdirSync('app/generated-fulltext/en-archive').filter((name) => name.endsWith('.json'));
          if (currentFiles.length !== Object.keys(current).length) {
            throw new Error(`Current full-text split mismatch: ${currentFiles.length} vs ${Object.keys(current).length}`);
          }
          if (archiveFiles.length !== Object.keys(archive).length) {
            throw new Error(`Archive full-text split mismatch: ${archiveFiles.length} vs ${Object.keys(archive).length}`);
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (/\.(?:js|mjs)$/.test(entry.name)) out.push(full);
            }
            return out;
          }
          const jsFiles = walk('dist');
          const oversized = jsFiles
            .map((file) => [file, fs.statSync(file).size])
            .filter(([, size]) => size > 6 * 1024 * 1024)
            .sort((a, b) => b[1] - a[1]);
          const largest = jsFiles
            .map((file) => [file, fs.statSync(file).size])
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10);
          console.log('Largest built JS modules:', largest);
          if (oversized.length) {
            throw new Error(`Built JS module still exceeds 6 MiB: ${JSON.stringify(oversized)}`);
          }
          console.log(`Verified ${currentFiles.length} current and ${archiveFiles.length} archived English per-article modules.`);
          NODE

          if grep -R --include='*.ts' --include='*.tsx' -n 'article-fulltext-en-archive.json' app; then
            echo "Runtime app source still imports the monolithic English archive JSON." >&2
            exit 1
          fi
          if grep -R --include='*.ts' --include='*.tsx' -n 'article-fulltext-current.json' app; then
            echo "Runtime app source still imports the monolithic current full-text JSON." >&2
            exit 1
          fi
          git diff --check

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          rm .github/workflows/split-fulltext-runtime.yml
          git add .gitignore package.json scripts/build-verified.sh scripts/generate-fulltext-modules.mjs app/components/ArticlePlatform.tsx .github/workflows/split-fulltext-runtime.yml
          if git diff --cached --quiet; then
            echo "No full-text runtime migration changes to commit." >&2
            exit 1
          fi
          git commit -m "Lazy-load full text per article"
          git push origin HEAD:main
