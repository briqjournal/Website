name: Collect Jordan source JSON
on:
  push:
    branches: [automation/v7i4-jordan-fulltext]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: jordan-source-json
          path: |
            content/articles/dijital-ipek-yolu-cercevesinde-cin-arap-isbirligi-urdun-ornegi/fulltext/current.json
            content/articles/dijital-ipek-yolu-cercevesinde-cin-arap-isbirligi-urdun-ornegi/fulltext/en-archive.json
            content/articles/dijital-ipek-yolu-cercevesinde-cin-arap-isbirligi-urdun-ornegi/metadata.json
          retention-days: 1
