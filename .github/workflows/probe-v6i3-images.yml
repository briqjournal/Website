name: Probe V6I3 images
on:
  push:
    branches: [migration/v6i3-canonical]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect images
        run: |
          python3 -m pip install --quiet pymupdf
          python3 <<'PY'
          import json, pathlib, urllib.request, fitz
          issue=json.load(open('content/issues/v06-i03.json'))
          for slug in issue['articles']:
              m=json.load(open(pathlib.Path('content/articles')/slug/'metadata.json'))
              url=m['urls'].get('pdfTr') or m['urls'].get('pdfEn')
              if not url: continue
              path=f'/tmp/{slug}.pdf'
              urllib.request.urlretrieve(url,path)
              doc=fitz.open(path)
              print('\n###',slug,'pages',doc.page_count)
              seen=set()
              for pno,page in enumerate(doc,1):
                  for img in page.get_images(full=True):
                      xref=img[0]
                      if xref in seen: continue
                      seen.add(xref)
                      try:
                          info=doc.extract_image(xref)
                          print('page',pno,'xref',xref,'size',info['width'],'x',info['height'],'cs',info.get('colorspace'),'ext',info['ext'])
                      except Exception as e: print('ERR',pno,xref,e)
          PY
