name: V7I4 split fulltext phase 1
on:
  push:
    branches: [automation/fix-comak-live-english]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate clean V7I4 articles to locale files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git rev-parse origin/main)"
          git checkout -B v7i4-split-fulltext-phase1 "$BASE"

          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';
          import { join } from 'node:path';
          import { loadFullTextCollections } from './scripts/content-store.mjs';

          const root=process.cwd();
          const saudi='suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi';
          const comak='turkiye-cin-diplomatik-iliskilerinin-55-yilinda-avrasyada-guc-gecisi-ve-jeoekonomik-baglantisallik';
          const localized=[saudi,comak];
          const collections=await loadFullTextCollections(root);

          for (const slug of localized) {
            const dir=join(root,'content/articles',slug,'fulltext');
            const current=collections.current[slug];
            if(!current?.tr) throw new Error(`Missing current.tr for ${slug}`);
            const en=slug===saudi ? collections.saudiEn : current.en;
            if(!en?.sections?.length) throw new Error(`Missing clean English source for ${slug}`);
            await writeFile(join(dir,'en.json'),JSON.stringify(en,null,2)+'\n','utf8');
            await writeFile(join(dir,'tr.json'),JSON.stringify(current.tr,null,2)+'\n','utf8');
            await rm(join(dir,'current.json'));
          }
          await rm(join(root,'content/articles',saudi,'fulltext','en-archive.json'));
          await rm(join(root,'content/articles',saudi,'fulltext','saudi-en.json'));

          const cp=join(root,'content/catalog.json');
          const catalog=JSON.parse(await readFile(cp,'utf8'));
          catalog.fulltext.localized=localized;
          catalog.fulltext.current=(catalog.fulltext.current||[]).filter(s=>!localized.includes(s));
          catalog.fulltext.en_archive=(catalog.fulltext.en_archive||[]).filter(s=>s!==saudi);
          delete catalog.fulltext.saudi_en;
          await writeFile(cp,JSON.stringify(catalog,null,2)+'\n','utf8');

          const issue=JSON.parse(await readFile(join(root,'content/issues/v07-i04.json'),'utf8'));
          const common=['slug','volume','issue','year','author','authors','pages','doi','published_online_date','received_date','revised_date','accepted_date','orcids','shared_bilingual_pdf'];
          const en=['season_en','title_en','abstract_en','keywords_en','citation_en','publication_type_en','source_en','pdf_en_source','pdf_en_local'];
          const tr=['season_tr','title_tr','abstract_tr','keywords_tr','citation_tr','publication_type_tr','source_tr','pdf_tr_source','pdf_tr_local'];
          for(const slug of issue.articles){
            const mp=join(root,'content/articles',slug,'metadata.json');
            const m=JSON.parse(await readFile(mp,'utf8'));
            const out={};
            for(const k of common) if(Object.hasOwn(m,k)) out[k]=m[k];
            for(const k of en) if(Object.hasOwn(m,k)) out[k]=m[k];
            for(const k of tr) if(Object.hasOwn(m,k)) out[k]=m[k];
            for(const [k,v] of Object.entries(m)) if(!Object.hasOwn(out,k)) out[k]=v;
            await writeFile(mp,JSON.stringify(out,null,2)+'\n','utf8');
          }
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/content-store.mjs')
          s=p.read_text()
          old='''export async function loadFullTextCollections(root = process.cwd()) {\n  const catalog = await loadCatalog(root);\n  const currentSlugs = catalog.fulltext.current || [];\n  const archiveSlugs = catalog.fulltext.en_archive || [];\n  assert(new Set(currentSlugs).size === currentSlugs.length, "Duplicate current full-text slug.");\n  assert(new Set(archiveSlugs).size === archiveSlugs.length, "Duplicate English archive full-text slug.");\n\n  const current = {};\n  for (const slug of currentSlugs) current[slug] = await readFullTextRecord(root, slug, "current.json");\n\n  const enArchive = {};\n  for (const slug of archiveSlugs) enArchive[slug] = await readFullTextRecord(root, slug, "en-archive.json");\n\n  const saudiSlug = catalog.fulltext.saudi_en;\n  const saudiEn = saudiSlug ? await readFullTextRecord(root, saudiSlug, "saudi-en.json") : null;\n  return { current, enArchive, saudiEn, saudiSlug };\n}\n'''
          new='''async function readLocalizedFullText(root, slug, locale) {\n  assertSlug(slug, `${locale}.json`);\n  const record = await readJson(join(root, "content/articles", slug, "fulltext", `${locale}.json`));\n  if (Array.isArray(record.keywords)) record.keywords = normalizeKeywordList(record.keywords, locale);\n  return record;\n}\n\nexport async function loadFullTextCollections(root = process.cwd()) {\n  const catalog = await loadCatalog(root);\n  const localizedSlugs = catalog.fulltext.localized || [];\n  const currentSlugs = catalog.fulltext.current || [];\n  const archiveSlugs = catalog.fulltext.en_archive || [];\n  assert(new Set(localizedSlugs).size === localizedSlugs.length, "Duplicate localized full-text slug.");\n  assert(new Set(currentSlugs).size === currentSlugs.length, "Duplicate current full-text slug.");\n  assert(new Set(archiveSlugs).size === archiveSlugs.length, "Duplicate English archive full-text slug.");\n\n  const localized = {};\n  for (const slug of localizedSlugs) localized[slug] = {\n    en: await readLocalizedFullText(root, slug, "en"),\n    tr: await readLocalizedFullText(root, slug, "tr"),\n  };\n\n  const current = {};\n  for (const slug of currentSlugs) current[slug] = await readFullTextRecord(root, slug, "current.json");\n\n  const enArchive = {};\n  for (const slug of archiveSlugs) enArchive[slug] = await readFullTextRecord(root, slug, "en-archive.json");\n\n  return { localized, current, enArchive };\n}\n'''
          if old not in s: raise SystemExit('content-store block not found')
          p.write_text(s.replace(old,new))

          p=Path('scripts/generate-fulltext-modules.mjs')
          s=p.read_text()
          s=s.replace('const archiveOutput = join(outputRoot, "en-archive");','const localizedOutput = join(outputRoot, "localized");\nconst archiveOutput = join(outputRoot, "en-archive");')
          s=s.replace('const { current, enArchive, saudiEn } = await loadFullTextCollections(root);\nconst currentEntries = Object.entries(current);','const { localized, current, enArchive } = await loadFullTextCollections(root);\nconst localizedEntries = Object.entries(localized);\nconst currentEntries = Object.entries(current);')
          s=s.replace('await writeEntries(currentEntries, currentOutput, "content current full text");','for (const [slug, value] of localizedEntries) {\n  await writeEntries([[slug, value.en]], join(localizedOutput, "en"), "content localized English full text");\n  await writeEntries([[slug, value.tr]], join(localizedOutput, "tr"), "content localized Turkish full text");\n}\nawait writeEntries(currentEntries, currentOutput, "content current full text");')
          s=s.replace('await mkdir(outputRoot, { recursive: true });\nawait writeFile(join(outputRoot, "saudi-en.json"), `${JSON.stringify(saudiEn)}\\n`, "utf8");','await mkdir(outputRoot, { recursive: true });')
          s=s.replace('await writeFile(join(appDir, "article-fulltext-current.json"), `${JSON.stringify(current, null, 2)}\\n`, "utf8");','await writeFile(join(appDir, "article-fulltext-localized.json"), `${JSON.stringify(localized, null, 2)}\\n`, "utf8");\nawait writeFile(join(appDir, "article-fulltext-current.json"), `${JSON.stringify(current, null, 2)}\\n`, "utf8");')
          s=s.replace('await writeFile(join(appDir, "article-fulltext-saudi-en.json"), `${JSON.stringify(saudiEn, null, 2)}\\n`, "utf8");\n','')
          anchor='const currentFullTextLoaders: Record<string, () => Promise<JsonModule>> = {'
          insert='''const localizedEnglishFullTextLoaders: Record<string, () => Promise<JsonModule>> = {\n${loaderLines(localizedEntries, "localized/en")}\n};\n\nconst localizedTurkishFullTextLoaders: Record<string, () => Promise<JsonModule>> = {\n${loaderLines(localizedEntries, "localized/tr")}\n};\n\n'''
          s=s.replace(anchor,insert+anchor)
          s=s.replace('export function loadCurrentFullText(slug: string) {','export function loadLocalizedFullText(slug: string, locale: "en" | "tr") {\n  return loadFrom(locale === "en" ? localizedEnglishFullTextLoaders : localizedTurkishFullTextLoaders, slug);\n}\n\nexport function loadCurrentFullText(slug: string) {')
          start='''\nexport async function loadSaudiEnglishFullText() {\n  const module = await import("./saudi-en.json");\n  return module.default;\n}\n'''
          s=s.replace(start,'\n')
          s=s.replace('console.log(`Generated ${currentEntries.length} current full-text modules and ${archiveEntries.length} English archive modules in ${relative(root, outputRoot)}.`);','console.log(`Generated ${localizedEntries.length} localized full-text pairs, ${currentEntries.length} legacy current modules, and ${archiveEntries.length} English archive modules in ${relative(root, outputRoot)}.`);')
          p.write_text(s)

          p=Path('app/components/ArticlePlatform.tsx')
          s=p.read_text()
          s=s.replace('''import {\n  loadArchiveEnglishFullText,\n  loadCurrentFullText,\n  loadSaudiEnglishFullText,\n} from "../generated-fulltext/loaders";''','''import {\n  loadArchiveEnglishFullText,\n  loadCurrentFullText,\n  loadLocalizedFullText,\n} from "../generated-fulltext/loaders";''')
          s=s.replace('const SAUDI_CULTURAL_HEDGING_SLUG = "suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi";\n','')
          s=s.replace('const COMAK_ENGLISH_FULLTEXT_SLUG = "turkiye-cin-diplomatik-iliskilerinin-55-yilinda-avrasyada-guc-gecisi-ve-jeoekonomik-baglantisallik";\n','')
          old='''  const fullRecord = await loadCurrentFullText(article.slug) as CurrentFullTextRecord | undefined;\n  const storedFullText = fullRecord?.[locale];\n  const archivedEnglishFullText = locale === "en" && article.slug !== SAUDI_CULTURAL_HEDGING_SLUG\n    ? await loadArchiveEnglishFullText(article.slug) as LocalizedFullText | undefined\n    : undefined;\n  const saudiEnglishFullText = locale === "en" && article.slug === SAUDI_CULTURAL_HEDGING_SLUG\n    ? await loadSaudiEnglishFullText() as LocalizedFullText\n    : undefined;\n  const archivedEnglishSource = saudiEnglishFullText || archivedEnglishFullText;\n  const preferCurrentEnglish = (article.volume === 7 && article.issue <= 3)\n    || article.slug === COMAK_ENGLISH_FULLTEXT_SLUG;\n  const fullText = locale === "en"\n    ? preferCurrentEnglish\n      ? mergeLocalizedFullText(storedFullText, archivedEnglishSource)\n      : mergeLocalizedFullText(archivedEnglishSource, storedFullText)\n    : storedFullText;'''
          new='''  const localizedFullText = await loadLocalizedFullText(article.slug, locale) as LocalizedFullText | undefined;\n  const fullRecord = localizedFullText ? undefined : await loadCurrentFullText(article.slug) as CurrentFullTextRecord | undefined;\n  const storedFullText = fullRecord?.[locale];\n  const archivedEnglishFullText = !localizedFullText && locale === "en"\n    ? await loadArchiveEnglishFullText(article.slug) as LocalizedFullText | undefined\n    : undefined;\n  const preferCurrentEnglish = article.volume === 7 && article.issue <= 3;\n  const legacyFullText = locale === "en"\n    ? preferCurrentEnglish\n      ? mergeLocalizedFullText(storedFullText, archivedEnglishFullText)\n      : mergeLocalizedFullText(archivedEnglishFullText, storedFullText)\n    : storedFullText;\n  const fullText = localizedFullText || legacyFullText;'''
          if old not in s: raise SystemExit('ArticlePlatform legacy block not found')
          p.write_text(s.replace(old,new))
          PY

          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs

          node --input-type=module <<'NODE'
          import { readFile, access } from 'node:fs/promises';
          import { join } from 'node:path';
          const slugs=['suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi','turkiye-cin-diplomatik-iliskilerinin-55-yilinda-avrasyada-guc-gecisi-ve-jeoekonomik-baglantisallik'];
          for(const slug of slugs){
            for(const locale of ['en','tr']){
              const p=join('content/articles',slug,'fulltext',`${locale}.json`);
              const x=JSON.parse(await readFile(p,'utf8'));
              if(!x.sections?.length) throw new Error(`No sections in ${p}`);
            }
            for(const legacy of ['current.json','en-archive.json','saudi-en.json']){
              try{await access(join('content/articles',slug,'fulltext',legacy)); throw new Error(`Legacy file still exists for ${slug}: ${legacy}`)}catch(e){if(e.code!=='ENOENT')throw e;}
            }
          }
          const cat=JSON.parse(await readFile('content/catalog.json','utf8'));
          if(cat.fulltext.localized?.length!==2) throw new Error('Expected 2 localized articles');
          if('saudi_en' in cat.fulltext) throw new Error('saudi_en key still present');
          NODE

          node --test tests/keyword-case.test.mjs tests/comak-english-fulltext.test.mjs
          git diff --check
          npm ci --no-audit --no-fund
          npm run build

          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'
          git add content scripts app tests
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'Start V7I4 locale-split full-text migration'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main advanced; refusing push'; exit 1; }
          git push origin HEAD:main
