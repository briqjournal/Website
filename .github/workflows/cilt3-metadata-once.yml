name: One-time Cilt 3 metadata migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Update Cilt 3 metadata
        run: node scripts/tmp-update-cilt3-metadata.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Commit metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "Update Cilt 3 metadata from verified spreadsheet"
          git push
