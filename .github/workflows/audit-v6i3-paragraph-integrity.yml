name: V6I3 paragraph integrity diagnostic

on:
  push:
    branches: [audit/v6i3-paragraph-integrity]
    paths:
      - 'scripts/audit-v6i3-paragraph-integrity.py'
      - 'scripts/verify-v6i3-paragraph-candidates.py'
      - 'scripts/inspect-v6i3-duplicates-declarations.py'
      - '.github/workflows/audit-v6i3-paragraph-integrity.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current canonical V6I3 paragraph boundaries
        run: python3 scripts/audit-v6i3-paragraph-integrity.py
      - name: Install PDF layout dependency
        run: python3 -m pip install --quiet pymupdf
      - name: Verify candidates against official PDF layout
        run: python3 scripts/verify-v6i3-paragraph-candidates.py
      - name: Inspect duplicate and declaration candidates
        run: python3 scripts/inspect-v6i3-duplicates-declarations.py
