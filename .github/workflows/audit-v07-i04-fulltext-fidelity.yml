name: Audit v07-i04 full-text fidelity

on:
  push:
    branches:
      - audit/v07-i04-fulltext-fidelity
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: audit/v07-i04-fulltext-fidelity

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install pymupdf

      - name: Apply confirmed fidelity repairs
        run: python3 scripts/repair-v07-i04-confirmed-fidelity.py

      - name: Commit durable repair checkpoint
        if: github.event_name == 'push'
        run: |
          git add \
            content/articles/suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi/fulltext/en.json \
            content/articles/turkiye-cin-diplomatik-iliskilerinin-55-yilinda-avrasyada-guc-gecisi-ve-jeoekonomik-baglantisallik/fulltext/en.json
          if git diff --cached --quiet; then
            echo "No canonical repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair v07-i04 English full-text fidelity"
          git push origin HEAD:audit/v07-i04-fulltext-fidelity

      - name: Run fidelity audit
        run: python3 scripts/audit-fulltext-fidelity.py v07-i04

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v07-i04-fidelity-audit
          if-no-files-found: error
          retention-days: 2
          path: |
            .audit/fulltext-fidelity/v07-i04/report.json
            .audit/fulltext-fidelity/v07-i04/report.md
            .audit/fulltext-fidelity/v07-i04/turkiye-cin-diplomatik-iliskilerinin-55-yilinda-avrasyada-guc-gecisi-ve-jeoekonomik-baglantisallik/en/*.pdf
            .audit/fulltext-fidelity/v07-i04/suudi-arabistanin-abd-ile-cin-arasinda-cok-boyutlu-kulturel-dengeleme-stratejisi/en/*.pdf
            .audit/fulltext-fidelity/v07-i04/*/*/raw.txt
            .audit/fulltext-fidelity/v07-i04/*/*/pages/*.txt
            .audit/fulltext-fidelity/v07-i04/*/*/renders/*.png
