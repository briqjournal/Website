name: Audit v07-i04 full-text fidelity

on:
  push:
    branches:
      - audit/v07-i04-fulltext-fidelity

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run fidelity audit
        run: python3 scripts/audit-fulltext-fidelity.py v07-i04

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v07-i04-fidelity-audit
          if-no-files-found: error
          retention-days: 2
          path: |
            .audit/fulltext-fidelity/v07-i04/report.json
            .audit/fulltext-fidelity/v07-i04/report.md
            .audit/fulltext-fidelity/v07-i04/*/*/pages/*.txt
            .audit/fulltext-fidelity/v07-i04/*/*/renders/*.png
