name: V7I1 declaration audit
on:
  push:
    branches: [automation/v7i1-declaration-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - shell: bash
        run: |
          python3 <<'PY'
          import json,re,tempfile,subprocess,urllib.request
          from pathlib import Path
          issue=json.loads(Path('content/issues/v07-i01.json').read_text()); tmp=Path(tempfile.mkdtemp())
          for slug in issue['articles'][:4]:
            m=json.loads(Path(f'content/articles/{slug}/metadata.json').read_text())
            print('\n###',slug)
            for l,key in [('en','pdfEn'),('tr','pdfTr')]:
              url=m['urls'][key]; pdf=tmp/f'{slug}-{l}.pdf'; txt=tmp/f'{slug}-{l}.txt'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}); pdf.write_bytes(urllib.request.urlopen(req,timeout=40).read()); subprocess.run(['pdftotext','-raw',str(pdf),str(txt)],check=True,stdout=subprocess.DEVNULL)
              s=txt.read_text(errors='replace'); lines=s.splitlines()
              print('\n--',l,'--')
              for i,line in enumerate(lines):
                if re.search(r'\b(Funding|Finansman|Acknowledg|Teşekkür|Conflict of Interest|Çıkar Çatışması|Data Availability|Veri Kullanılabilirliği)\b',line,re.I):
                  print('CONTEXT',i,repr('\n'.join(lines[max(0,i-3):min(len(lines),i+5)])))
          PY
