name: Fix and verify V7I3 audit findings
on:
  push:
    branches: [automation/v7i3-audit-fixes]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix, verify, and safely fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          cat > /tmp/fix-v7i3.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';

          const issue = JSON.parse(fs.readFileSync('content/issues/v07-i03.json','utf8'));
          const REVIEW = 'kusak-ve-yolun-guvenligi-ozel-guvenlik-risk-ve-cinin-kuresel-genislemesi';
          const norm = (v) => String(v ?? '').replace(/\s+/g,' ').trim();

          function repairReference(text) {
            let out = String(text ?? '');
            const httpIndex = out.search(/https?:\/\//i);
            if (httpIndex >= 0) {
              const tail = out.slice(httpIndex);
              const markerMatch = tail.match(/\s+(?:adresinden|adresine)\b/iu);
              const end = markerMatch?.index ?? tail.length;
              const url = tail.slice(0, end);
              const repaired = url.replace(/\s+/g, '');
              out = out.slice(0, httpIndex) + repaired + tail.slice(end);
            }
            out = out.replace(/(\bdoi:\s*)(10\.[^\n]+)$/iu, (_m, prefix, doi) => prefix + String(doi).replace(/\s+/g,''));
            return out;
          }

          for (const slug of issue.articles) {
            const trPath = path.join('content/articles',slug,'fulltext','tr.json');
            const tr = JSON.parse(fs.readFileSync(trPath,'utf8'));
            tr.references = (tr.references ?? []).map((ref) => ({...ref, text: repairReference(ref.text)}));
            fs.writeFileSync(trPath, JSON.stringify(tr,null,2)+'\n');

            const metaPath = path.join('content/articles',slug,'metadata.json');
            const meta = JSON.parse(fs.readFileSync(metaPath,'utf8'));
            if (!meta.published_online_date) meta.published_online_date = '2026-06-01';
            if (slug === REVIEW) {
              meta.abstract_tr = '';
              meta.abstract_en = '';
            }
            fs.writeFileSync(metaPath, JSON.stringify(meta,null,2)+'\n');
          }
          JS

          cat > /tmp/audit-v7i3-clean.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const issue=JSON.parse(fs.readFileSync('content/issues/v07-i03.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('content/catalog.json','utf8'));
          const errors=[];
          const norm=(v)=>String(v??'').replace(/\s+/g,' ').trim();
          function auditRef(slug,ref){
            const s=norm(ref.text); const i=s.search(/https?:\/\//i);
            if(i>=0){const tail=s.slice(i);const marker=tail.search(/\s+(?:adresinden|adresine)\b/iu);const url=(marker>=0?tail.slice(0,marker):tail).replace(/[.,;:]$/,'');if(/\s/.test(url))errors.push(`${slug}: broken URL ${ref.id}: ${url}`);if(/^https:\/\/10\./i.test(url))errors.push(`${slug}: malformed DOI URL ${ref.id}: ${url}`)}
            const d=s.match(/\bdoi:\s*(10\..*)$/iu);if(d&&/\s/.test(d[1]))errors.push(`${slug}: split DOI ${ref.id}: ${d[1]}`);
          }
          for(const slug of issue.articles){
            const dir=path.join('content/articles',slug,'fulltext');const files=fs.readdirSync(dir).sort();if(JSON.stringify(files)!==JSON.stringify(['en.json','tr.json']))errors.push(`${slug}: files ${files.join(',')}`);
            const meta=JSON.parse(fs.readFileSync(path.join('content/articles',slug,'metadata.json'),'utf8'));if(meta.published_online_date!=='2026-06-01')errors.push(`${slug}: bad publication date`);
            if(!catalog.fulltext.localized.includes(slug)||catalog.fulltext.current.includes(slug)||catalog.fulltext.en_archive.includes(slug))errors.push(`${slug}: catalog wrong`);
            const en=JSON.parse(fs.readFileSync(path.join(dir,'en.json'),'utf8'));const tr=JSON.parse(fs.readFileSync(path.join(dir,'tr.json'),'utf8'));
            if(!en.sections?.length||!tr.sections?.length)errors.push(`${slug}: missing sections`);
            if(JSON.stringify(en)===JSON.stringify(tr))errors.push(`${slug}: locales identical`);
            if((en.keywords?.length??0)!==(tr.keywords?.length??0))errors.push(`${slug}: keyword mismatch`);
            for(const ref of tr.references??[])auditRef(slug,ref);
            for(const d of [en,tr])for(const s of d.sections??[])for(const p of s.paragraphs??[]){const m=String(p).match(/(?<=[A-Za-zÀ-ž])\d{3}\s+(?=[A-Za-zÀ-ž])/u);if(m)errors.push(`${slug}: embedded page token ${m[0]}`)}
          }
          const review=JSON.parse(fs.readFileSync('content/articles/kusak-ve-yolun-guvenligi-ozel-guvenlik-risk-ve-cinin-kuresel-genislemesi/metadata.json','utf8'));
          if(review.abstract_tr!==''||review.abstract_en!=='')errors.push('book review false abstract still present');
          if(errors.length){console.error(errors.join('\n'));process.exit(2)}
          console.log('V7I3 content audit clean: canonical locales, dates, URL/DOI integrity, and book-review abstract semantics verified.');
          JS

          apply_fix() {
            node /tmp/fix-v7i3.mjs
            node /tmp/audit-v7i3-clean.mjs
            node scripts/generate-archive-data.mjs
            node scripts/generate-fulltext-modules.mjs
            node scripts/generate-runtime-data.mjs
            node --test tests/v7i3-locale-fulltext.test.mjs tests/keyword-case.test.mjs
            git diff --check
          }

          BASE="$(git rev-parse origin/main)"
          git checkout -B v7i3-fix-verify "$BASE"
          apply_fix
          npm ci --no-audit --no-fund
          npm run build
          node --test tests/v7i3-locale-fulltext.test.mjs tests/keyword-case.test.mjs tests/oai-pmh.test.mjs tests/rendered-html.test.mjs

          for ATTEMPT in 1 2 3 4 5 6; do
            git fetch origin main
            FINAL_BASE="$(git rev-parse origin/main)"
            git checkout -B v7i3-fix-push "$FINAL_BASE"
            apply_fix
            if git diff --quiet; then
              echo 'V7I3 audit fixes already present on main.'
              exit 0
            fi
            git config user.name 'BRIQ Journal'
            git config user.email 'briq@briqjournal.com'
            git add content app tests
            git commit -m 'Clean and verify Volume 7 Issue 3 content'
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$FINAL_BASE" ]; then
              git push origin HEAD:main
              exit 0
            fi
            echo "main advanced during attempt $ATTEMPT; retrying"
          done
          echo 'main kept advancing; refusing unsafe push'
          exit 1
