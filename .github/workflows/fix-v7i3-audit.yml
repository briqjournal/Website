name: Fix and verify V7I3 audit findings
on:
  push:
    branches: [automation/v7i3-audit-fixes]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix, fully verify, and safely fast-forward main
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sync-catalog-order.mjs <<'JS'
          import fs from 'node:fs';
          const p = 'content/catalog.json';
          const catalog = JSON.parse(fs.readFileSync(p, 'utf8'));
          const order = [];
          for (const file of catalog.issue_order) {
            const issue = JSON.parse(fs.readFileSync(`content/issues/${file}`, 'utf8'));
            order.push(...(issue.articles ?? []));
          }
          if (new Set(order).size !== order.length) throw new Error('Duplicate article slug across issue lists');
          catalog.article_order = order;
          fs.writeFileSync(p, JSON.stringify(catalog, null, 2) + '\n');
          console.log(`Synchronized catalog.article_order to ${order.length} issue-listed articles.`);
          JS

          cat > /tmp/fix-v7i3.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const issue = JSON.parse(fs.readFileSync('content/issues/v07-i03.json', 'utf8'));
          const REVIEW = 'kusak-ve-yolun-guvenligi-ozel-guvenlik-risk-ve-cinin-kuresel-genislemesi';

          function repairReference(text) {
            let out = String(text ?? '');
            const httpIndex = out.search(/https?:\/\//i);
            if (httpIndex >= 0) {
              const tail = out.slice(httpIndex);
              const marker = tail.match(/\s+(?:adresinden|adresine)\b/iu);
              const end = marker?.index ?? tail.length;
              out = out.slice(0, httpIndex) + tail.slice(0, end).replace(/\s+/g, '') + tail.slice(end);
            }
            return out.replace(/(\bdoi:\s*)(10\.[^\n]+)$/iu, (_m, prefix, doi) => prefix + String(doi).replace(/\s+/g, ''));
          }

          for (const slug of issue.articles) {
            const trPath = path.join('content/articles', slug, 'fulltext', 'tr.json');
            const tr = JSON.parse(fs.readFileSync(trPath, 'utf8'));
            tr.references = (tr.references ?? []).map((ref) => ({ ...ref, text: repairReference(ref.text) }));
            fs.writeFileSync(trPath, JSON.stringify(tr, null, 2) + '\n');

            const metaPath = path.join('content/articles', slug, 'metadata.json');
            const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
            if (!meta.published_online_date) meta.published_online_date = '2026-06-01';
            if (slug === REVIEW) {
              meta.abstract_tr = '';
              meta.abstract_en = '';
            }
            fs.writeFileSync(metaPath, JSON.stringify(meta, null, 2) + '\n');
          }
          JS

          write_integrity_test() {
            cat > tests/v7i3-content-integrity.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";

          const issue = JSON.parse(fs.readFileSync("content/issues/v07-i03.json", "utf8"));
          const catalog = JSON.parse(fs.readFileSync("content/catalog.json", "utf8"));
          const reviewSlug = "kusak-ve-yolun-guvenligi-ozel-guvenlik-risk-ve-cinin-kuresel-genislemesi";
          const normalize = (value) => String(value ?? "").replace(/\s+/g, " ").trim();

          function terminalUrl(text) {
            const value = normalize(text);
            const index = value.search(/https?:\/\//i);
            if (index < 0) return null;
            const tail = value.slice(index);
            const marker = tail.search(/\s+(?:adresinden|adresine)\b/iu);
            return (marker >= 0 ? tail.slice(0, marker) : tail).replace(/[.,;:]$/, "");
          }

          test("V7I3 keeps canonical locale files and the June 2026 publication date", () => {
            assert.equal(issue.articles.length, 8);
            for (const slug of issue.articles) {
              const dir = path.join("content/articles", slug, "fulltext");
              assert.deepEqual(fs.readdirSync(dir).sort(), ["en.json", "tr.json"], slug);
              assert.ok(catalog.fulltext.localized.includes(slug), slug);
              assert.ok(!catalog.fulltext.current.includes(slug), slug);
              assert.ok(!catalog.fulltext.en_archive.includes(slug), slug);
              const metadata = JSON.parse(fs.readFileSync(path.join("content/articles", slug, "metadata.json"), "utf8"));
              assert.equal(metadata.published_online_date, "2026-06-01", slug);
            }
          });

          test("V7I3 Turkish references contain no PDF line-break corruption inside URLs or DOI strings", () => {
            for (const slug of issue.articles) {
              const tr = JSON.parse(fs.readFileSync(path.join("content/articles", slug, "fulltext", "tr.json"), "utf8"));
              for (const reference of tr.references ?? []) {
                const url = terminalUrl(reference.text);
                if (url) {
                  assert.doesNotMatch(url, /\s/u, `${slug} ${reference.id}: ${url}`);
                  assert.doesNotMatch(url, /^https:\/\/10\./i, `${slug} ${reference.id}: malformed DOI URL ${url}`);
                }
                const doi = normalize(reference.text).match(/\bdoi:\s*(10\..*)$/iu)?.[1];
                if (doi) assert.doesNotMatch(doi, /\s/u, `${slug} ${reference.id}: split DOI ${doi}`);
              }
            }
          });

          test("V7I3 has distinct bilingual text without embedded PDF page-number tokens", () => {
            for (const slug of issue.articles) {
              const dir = path.join("content/articles", slug, "fulltext");
              const en = JSON.parse(fs.readFileSync(path.join(dir, "en.json"), "utf8"));
              const tr = JSON.parse(fs.readFileSync(path.join(dir, "tr.json"), "utf8"));
              assert.ok(en.sections?.length, slug);
              assert.ok(tr.sections?.length, slug);
              const enBody = en.sections.flatMap((section) => section.paragraphs ?? []).join(" ");
              const trBody = tr.sections.flatMap((section) => section.paragraphs ?? []).join(" ");
              assert.notEqual(enBody, trBody, slug);
              for (const body of [enBody, trBody]) {
                assert.doesNotMatch(body, /(?<=[A-Za-zÀ-ž])\d{3}\s+(?=[A-Za-zÀ-ž])/u, slug);
              }
            }
          });

          test("V7I3 book review does not publish the reviewed-book citation as an abstract", () => {
            const metadata = JSON.parse(fs.readFileSync(path.join("content/articles", reviewSlug, "metadata.json"), "utf8"));
            assert.equal(metadata.abstract_tr, "");
            assert.equal(metadata.abstract_en, "");
          });
          JS
          }

          apply_fix() {
            node /tmp/sync-catalog-order.mjs
            node /tmp/fix-v7i3.mjs
            write_integrity_test
            node scripts/generate-archive-data.mjs
            node scripts/generate-fulltext-modules.mjs
            node scripts/generate-runtime-data.mjs
            node --test tests/v7i3-locale-fulltext.test.mjs tests/v7i3-content-integrity.test.mjs tests/keyword-case.test.mjs
            git diff --check
          }

          npm ci --no-audit --no-fund

          for ATTEMPT in 1 2 3 4 5 6; do
            git fetch origin main
            BASE="$(git rev-parse origin/main)"
            git reset --hard "$BASE"
            apply_fix

            npm test

            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
              echo "main advanced during full validation attempt $ATTEMPT; retrying on the new head"
              continue
            fi

            if git diff --quiet; then
              echo 'V7I3 audit fixes already present on main.'
              exit 0
            fi

            git config user.name 'BRIQ Journal'
            git config user.email 'briq@briqjournal.com'
            git add content app tests
            git commit -m 'Clean and verify Volume 7 Issue 3 content'

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
              git push origin HEAD:main
              exit 0
            fi
            echo "main advanced after commit attempt $ATTEMPT; retrying"
          done

          echo 'main kept advancing; refusing unsafe push'
          exit 1
