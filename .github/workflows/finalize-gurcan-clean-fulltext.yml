name: One-time Gurcan clean full-text completion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-gurcan-clean-fulltext.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete and validate cleaned article record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          partial_path = Path('tmp/gurcan-decoded-partial.json')
          target = Path('content/articles/amerika-sonrasi-donemde-adil-bir-dunya-duzeni-insa-etmek/fulltext/en-archive.json')
          raw = partial_path.read_text(encoding='utf-8')
          marker = '        "Second, the US-centered world system is cracking and disintegrating'
          cut = raw.rfind(marker)
          if cut < 0:
              raise SystemExit('Could not locate truncated Review and Discussion paragraph')
          prefix = raw[:cut]

          paragraph2 = ('Second, the US-centered world system is cracking and disintegrating, largely due to America’s arbitrary approach, which feeds off exploitative and coercive practices that arrest international development. The crisis of neoliberalism – not only in Latin America and other parts of the developing world, but also in advanced capitalist areas such as North America and Europe – is perfectly illustrative of how US-patented economic policies have backfired to undermine American leadership in global economic governance. Similarly, America’s arbitrary behavior within NAFTA and that neoliberal agreement’s destructive effects on the Mexican economy reveal the exploitative and coercive faces of the so-called “New World Order”. This situation is even more apparent in the US approach to military governance, as can be observed in the cases of Afghanistan, Iraq, and Syria, to name but a few. The erosion of America’s global leadership in economic and military governance finds a strong echo in the BRI and the SCO’s emphasis on peaceful and sustainable human development. These developments are complemented by the BRICS’ reaction to the 2008 crisis and Latin America’s refusal of neoliberalism.')
          paragraph3 = ('Third, and finally, America’s unreliable, arbitrary, coercive, and exploitative attitude towards global governance has led to serious institutional decline to a degree that threatens the political cohesion and well-being of the world order. Free trade agreements such as NAFTA and Western governance organizations such as the EU have lost their appeal in the face of a growing tide of protectionism and trade wars. On the other hand, regional alternatives to US-led institutional arrangements have emerged, led by such organizations as the SCO, the EEU, ALBA, and UNASUR. On a global scale, the BRI offers a concrete roadmap that focuses on key strategic areas, including intergovernmental policy coordination, techno-economic connectivity, and cultural cooperation.')

          references = [
            'Alaaldin, R. (2019). The US no longer matters in Syria. Retrieved from https://www.brookings.edu/blog/order-from-chaos/2019/10/18/the-us-no-longer-matters-in-syria',
            'Bennett, A. (2010). Process tracing and causal inference. In J. H. E. Brady & D. Collier (Eds.), Rethinking Social Inquiry (207–220). Plymouth: Rowman and Littlefield.',
            'Bertoldi, N. (2009). Rawls on International Justice. The Tocqueville Review/La Revue Tocqueville, 30(1), 61–90.',
            'Brock, G., & Moellendorf, D. (Eds.). (2005). Current Debates in Global Justice. Dordrecht: Springer.',
            'Bush, G. H. W. (1990). Address Before a Joint Session of Congress. Retrieved from https://millercenter.org/the-presidency/presidential-speeches/september-11-1990-address-joint-session-congress',
            'Bush, G. H. W. (1991). Address Before a Joint Session of the Congress on the Cessation of the Persian Gulf Conflict. Retrieved from https://www.govinfo.gov/content/pkg/PPP-1991-book1/html/PPP-1991-book1-doc-pg218-3.htm',
            'Calabrese, J. (2019). China-Iraq Relations: Poised for a “Quantum Leap”? Retrieved from https://www.mei.edu/publications/china-iraq-relations-poised-quantum-leap',
            'Calabrese, L. (2019). China and global development: what to read ahead of the Belt and Road Forum. Retrieved from https://www.odi.org/blogs/10752-china-and-global-development-what-read-ahead-belt-and-road-forum',
            'Camdessus, M. (2017). Why China’s belt and road must be a pathway to sustainable development. Retrieved from https://www.scmp.com/comment/insight-opinion/article/2094611/why-chinas-belt-and-road-must-be-pathway-sustainable',
            'Castro-Rea, J. (2014). Free Trade: A Tool for US Hegemony in the Americas. In W. A. Knight, J. Castro-Rea, & H. Ghany (Eds.), Re-Mapping the Americas: Trends in Region-Making (69–82). Farnham: Ashgate.',
            'Chatterjee, D. K. (Ed.). (2011). Encyclopedia of Global Justice. Dordrecht: Springer.',
            'China Center for International Economic Exchanges. (2017). The Belt and Road Initiative: A new means to transformative global governance towards sustainable development. Retrieved from https://www.undp.org/content/dam/china/docs/Publications/UNDP-CH-GGR%202017.pdf',
            'China Daily. (2018). Xi gives new impetus to Belt and Road Initiative. Retrieved from http://www.chinadaily.com.cn/a/201808/28/WS5b84994fa310add14f388114.html',
            'Collier, D. (2011). Understanding process tracing. Political Science & Politics, 44(4), 823–830.',
            'Cordesman, A. H. (2019). Afghanistan: A War in Crisis. Retrieved from https://www.csis.org/analysis/afghanistan-war-crisis',
            'Dahbour, O. (2005). Three Models of Global Community. In G. Brock & D. Moellendorf (Ed.), Current Debates in Global Justice (201–224). Dordrecht: Springer.',
            'Gürcan, E. C. (2010). New Regionalisms and Radical Identify Formation in Latin America: Towards and Alter-Global Paradigm. Journal of Social Research & Policy, 1(2), 19–33.',
            'Gürcan, E. C. (2019a). Multipolarization, South-South Cooperation and the Rise of Post-Hegemonic Governance. New York: Routledge.',
            'Gürcan, E. C. (2019b). Küresel Kapitalizmin Krizi, Sınıflar ve “Yeni” Toplumsal Hareketler [The Crisis of Global Capitalism, Social Classes, and “New” Social Movements]. Praksis, 50(2), 71–94.',
            'Gürcan, E. C. (2019c). Geopolitical Economy of Post-Hegemonic Regionalism in Latin America and Eurasia. Research in Political Economy, 34(1), 59–88.',
            'Gürcan, E. C. (2019d). BRICS Ülkelerinin Afrika’daki Yükselişine Jeopolitik Ekonomi Penceresinden Bir Bakış [A Geopolitical-Economic Perspective into the BRICS’ Rise in Africa]. Gümüşhane Üniversitesi Sosyal Bilimler Enstitüsü Dergisi [Gümüşhane University Electronic Journal of the Institute of Social Sciences], 34(1), 59–88.',
            'Gürcan, E. C. (2019e). Political geography of Turkey’s intervention in Syria: underlying causes and consequences (2011–2016). Journal of Aggression, Conflict and Peace Research, 11(1), 1–10.',
            'Gürcan, E. C., & Bakiner, O. (2015). Beyond neoliberal hegemony in Latin America: Alianza Bolivariana para los Pueblos de Nuestra América (ALBA). In D. Kreps (Ed.), Gramsci and Foucault: A Reassessment (131–153). Farnham: Ashgate.',
            'Gürcan, E. C., & Mete, B. (2017). Neoliberalism and the Changing Face of Unionism: The Combined and Uneven Development of Class Capacities in Turkey. New York: Palgrave Macmillan.',
            'Gürcan, E. C., & Mete, B. (2019). The combined and uneven development of working-class capacities in Turkey, 1960–2016. Labor History, 60(3), 268–286.',
            'Higgins, T. (2019). Pompeo, asked about Turkey crisis, says Trump is “fully prepared” to take military action if needed. Retrieved from https://www.cnbc.com/2019/10/21/pompeo-trump-is-fully-prepared-for-military-action-against-turkey.html',
            'Kokaz, N. (2005). Theorizing International Fairness. Metaphilosophy, 36(1/2), 68–92.',
            'Laurell, A. C. (2015). Three Decades of Neoliberalism in Mexico: The Destruction of Society. International Journal of Health Services, 452, 246–264.',
            'Lipset, S. M. (1959). Some social requisites of democracy: Economic development and political legitimacy. American Political Science Review, 53, 69–105.',
            'National Development and Reform Commission. (2015). Action Plan on the Belt and Road Initiative. Retrieved from http://english.www.gov.cn/archive/publications/2015/03/30/content_281475080249035.htm',
            'Page, S. (2019). Can our friends trust the US as an ally? Most Americans say Trump’s Syria move has hurt. Retrieved from https://www.usatoday.com/story/news/politics/2019/10/18/trumps-syria-withdrawal-hurt-americas-reputation-most-say-poll/4018093002/',
            'Pham, P. (2017). Why Did Donald Trump Kill This Big Free Trade Deal? Retrieved from https://www.forbes.com/sites/peterpham/2017/12/29/why-did-donald-trump-kill-this-big-free-trade-deal/#4e8f3f894e62',
            'Pogge, P. (2005). Real World Justice. In G. Brock & D. Moellendorf (Ed.), Current Debates in Global Justice (29–53). Dordrecht: Springer.',
            'Rawls, J. (1999). A Theory of Justice. Cambridge: Belknap Press of Harvard University.',
            'Ray, A. K. (1999). The Concept of Justice in International Relations. Economic and Political Weekly, 34(22), 1368–1374.',
            'Rayburn, E., & Sobchak, F. K. (2019). The U.S. Army in the Iraq War Volume 2: Surge and Withdrawal 2007–2011. Carlisle: U.S. Army War College.',
            'Risse, M. (2005). What We Owe to the Global Poor. In G. Brock & D. Moellendorf (Eds.), Current Debates in Global Justice (81–117). Dordrecht: Springer.',
            'Ross, G. (2016). Austerity and New Spaces for Protest: The Financial Crisis and Its Victims. In P. Dufour & H. Nez (Eds.), Street Politics in the Age of Austerity: From the Indignados to Occupy (43–66). Amsterdam: Amsterdam University Press.',
            'Rowlatt, J. (2019). How the US military’s opium war in Afghanistan was lost. Retrieved from https://www.bbc.com/news/world-us-canada-47861444',
            'Schiavenza, M. (2013). Who Won the Iraq War? China. Retrieved from https://www.theatlantic.com/china/archive/2013/03/who-won-the-iraq-war-china/274267',
            'Slaughter, A. M. (2004). A New World Order. Princeton: Princeton University Press.',
            'Sterba, J. P. (2005). Global Justice for Humans or for All Living Beings and What Difference It Makes. In G. Brock & D. Moellendorf (Eds.), Current Debates in Global Justice (283–300). Dordrecht: Springer.',
            'Stracqualursi, V., & Acosta, J. (2019). Trump raised withdrawing the US from NATO several times in 2018. Retrieved from https://edition.cnn.com/2019/01/15/politics/trump-nato-us-withdraw/index.html',
            'Taylor, P. (2018). Bullied by Trump, here’s how Europe can punch back. Retrieved from https://www.politico.eu/article/donald-trumop-europe-hour-has-come/',
            'The Guardian. (2019). Macron criticised by US and Germany over NATO “brain death” claims. Retrieved from https://www.theguardian.com/world/2019/nov/07/macron-warns-of-nato-brain-death-as-us-turns-its-back-on-allies',
            'Vennesson, P. (2008). Case studies and process tracing: theories and practices. In D. della Porta & M. Keating (Eds.), Approaches and Methodologies in the Social Sciences: A Pluralist Perspective (223–239). Cambridge: Cambridge University Press.',
            'Weisbrot, M., Lefebvre, S., & Sammut, J. (2014). Did NAFTA Help Mexico? An Assessment After 20 Years. Retrieved from http://cepr.net/documents/nafta-20-years-2014-02.pdf',
            'World Bank. (2016). Online Database. Retrieved from http://databank.worldbank.org',
            'Young, S. B. (2019). Why America Lost in Afghanistan. Retrieved from https://foreignpolicy.com/2019/02/05/why-america-lost-in-afghanistan-counterinsurgency-cords-vietnam',
          ]

          lines = [
              '        ' + json.dumps(paragraph2, ensure_ascii=False) + ',',
              '        ' + json.dumps(paragraph3, ensure_ascii=False),
              '      ]',
              '    }',
              '  ],',
              '  "keywords": ' + json.dumps(['fairness', 'global governance', 'international cooperation', 'military interventionism', 'neoliberalism', 'world order'], ensure_ascii=False) + ',',
              '  "references": [',
          ]
          for index, text in enumerate(references, 1):
              obj = {'id': f'ref-{index}', 'text': text}
              lines.append('    ' + json.dumps(obj, ensure_ascii=False) + (',' if index < len(references) else ''))
          lines += [
              '  ],',
              '  "footnotes": [],',
              '  "publicationNote": "",',
              '  "acknowledgements": "",',
              '  "figures": []',
              '}',
              '',
          ]
          completed = prefix + '\n'.join(lines)
          data = json.loads(completed)

          assert len(data['sections']) == 4, len(data['sections'])
          assert data['sections'][0]['paragraphs'][0].startswith('Much has changed over the last three decades')
          assert data['sections'][-1]['title'] == 'Review and Discussion'
          assert len(data['sections'][-1]['paragraphs']) == 3
          assert len(data['references']) == 49
          assert not any('MUCH HAS CHANGED OVER THE LAST imperialism' in p for s in data['sections'] for p in s.get('paragraphs', []))
          assert not any(s['title'].startswith('19 NAFTA disputes') for s in data['sections'])

          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f tmp/gurcan-fulltext-1.b64 tmp/gurcan-fulltext-2.b64 tmp/gurcan-fulltext-3.b64 tmp/gurcan-fulltext-4.b64 tmp/gurcan-decoded-partial.json tmp/gurcan-diagnostics.json
          rm .github/workflows/finalize-gurcan-clean-fulltext.yml
          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'
          git add content/articles/amerika-sonrasi-donemde-adil-bir-dunya-duzeni-insa-etmek/fulltext/en-archive.json tmp .github/workflows/finalize-gurcan-clean-fulltext.yml
          git commit -m 'Repair Gürcan English full text and references'
          git push origin HEAD:main
