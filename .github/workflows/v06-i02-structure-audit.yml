name: Inspect extracted v06-i02 figure assets

on:
  push:
    branches:
      - chore/v06-i02-fulltext-canonical
    paths:
      - '.github/workflows/v06-i02-structure-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v06-i02-extracted-figures
          path: public/assets/article-figures/
          retention-days: 1
