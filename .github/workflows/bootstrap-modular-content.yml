name: Bootstrap modular content

on:
  push:
    branches:
      - architecture/modular-content
    paths:
      - .github/workflows/bootstrap-modular-content.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-modular-content
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Split canonical content
        run: node scripts/import-content-monoliths.mjs --all

      - name: Replace tracked monoliths
        shell: bash
        run: |
          set -euo pipefail
          git rm app/archive-data.json \
            app/article-fulltext-current.json \
            app/article-fulltext-en-archive.json \
            app/article-fulltext-saudi-en.json
          git rm .github/workflows/bootstrap-modular-content.yml
          git add content
          git config user.name "BRIQ Migration Bot"
          git config user.email "briq@briqjournal.com"
          git commit -m "Generate canonical modular journal content"
          git push origin HEAD:architecture/modular-content
