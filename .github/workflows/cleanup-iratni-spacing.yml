name: Clean Iratni extraction spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-iratni-spacing.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize residual line-break spacing
        run: |
          git pull --rebase origin main
          python <<'PY'
          import json, re
          from pathlib import Path

          p = Path('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          def clean(s):
              s = re.sub(r'(?<=[A-Za-z])-\s+(?=[A-Za-z])', '-', s)
              s = re.sub(r'\s*—\s*', '—', s)
              s = re.sub(r'\s+([,.;:?!])', r'\1', s)
              return s

          for section in data.get('sections', []):
              section['title'] = clean(section.get('title', ''))
              section['paragraphs'] = [clean(x) for x in section.get('paragraphs', [])]
          data['references'] = [clean(x) for x in data.get('references', [])]

          text = '\n'.join(p for s in data['sections'] for p in s['paragraphs'])
          assert not re.search(r'(?<=[A-Za-z])-\s+(?=[A-Za-z])', text)
          assert '— ' not in text and ' —' not in text
          for bad in ['pre-sence', 'effec- tively', 'co-lonial', 're-volutionary', 'pro-viding', 'suscep- tible']:
              assert bad not in text, bad
          assert len(data['sections']) == 7
          assert len(data['references']) == 32

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('sections', len(data['sections']))
          print('references', len(data['references']))
          print('words', len(text.split()))
          PY
          node -e "JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json','utf8'));"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json
          git commit -m 'Normalize Iratni full text spacing'
          git pull --rebase origin main
          git push origin HEAD:main
