name: Refresh PDF archive in Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: briq-r2-pdf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          aws --version

      - name: Materialize the generated archive
        run: node scripts/generate-archive-data.mjs

      - name: Download and verify the source archive
        run: python3 scripts/localize-pdf-archive.py

      - name: Persist refreshed metadata in modular sources
        run: node scripts/import-content-monoliths.mjs --archive

      - name: Upload PDFs to R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync public/assets "s3://$R2_BUCKET/assets" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.pdf" \
            --content-type application/pdf \
            --only-show-errors

      - name: Verify every manifest object in R2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("ops/pdf-archive-manifest.json").read_text(encoding="utf-8"))
          files = manifest.get("files", [])
          if manifest.get("unique_files") != len(files):
              raise SystemExit("Manifest file count is inconsistent.")

          for position, record in enumerate(files, start=1):
              key = record["local"].lstrip("/")
              command = [
                  "aws", "s3api", "head-object",
                  "--bucket", os.environ["R2_BUCKET"],
                  "--key", key,
                  "--endpoint-url", os.environ["R2_ENDPOINT"],
                  "--query", "ContentLength",
                  "--output", "text",
              ]
              remote_size = int(subprocess.check_output(command, text=True).strip())
              if remote_size != record["bytes"]:
                  raise SystemExit(f"R2 size mismatch for {key}: expected {record['bytes']}, received {remote_size}")
              if position % 50 == 0:
                  print(f"Verified {position}/{len(files)} objects", flush=True)

          print(f"Verified all {len(files)} PDF objects in R2.")
          PY

      - name: Open an inventory pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find public -type f -iname '*.pdf' -delete
          git add content ops/pdf-archive-manifest.json
          if git diff --cached --quiet; then
            echo "R2 and the repository inventory are already current."
            exit 0
          fi

          branch="automation/pdf-archive-${GITHUB_RUN_ID}"
          git config user.name "BRIQ Archive Bot"
          git config user.email "briq@briqjournal.com"
          git switch -c "$branch"
          git commit -m "Refresh R2 PDF archive inventory"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh R2 PDF archive inventory" \
            --body "Updates the lightweight PDF inventory after uploading and verifying every PDF in Cloudflare R2. No PDF binary is committed to Git."

