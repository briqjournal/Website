name: Probe v05-i03 page-14 figure composition

on:
  push:
    branches:
      - chore/v05-i03-fulltext-canonical
    paths:
      - '.github/workflows/v05-i03-page14-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - name: Capture page 14 image placement
        shell: bash
        run: |
          set -euo pipefail
          url=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("content/articles/cinin-uc-kuresel-girisimi-baglaminda-ortadogu-politikasinin-seyri/metadata.json")
          print(json.loads(p.read_text())["urls"]["pdfEn"])
          PY
          )
          mkdir -p tmp/v05-i03-page14-probe
          curl -L --fail --retry 3 "$url" -o /tmp/a.pdf
          pdftohtml -f 14 -l 14 -xml -hidden -nodrm /tmp/a.pdf /tmp/a.xml >/dev/null 2>&1
          python3 - <<'PY'
          import re, pathlib, subprocess, json
          xml=pathlib.Path("/tmp/a.xml").read_text(errors="replace")
          page=re.search(r'<page\b[^>]*>([\s\S]*?)</page>',xml)
          tags=re.findall(r'<image\b[^>]*/>', page.group(1) if page else "")
          out={"image_tags":tags}
          # compare the two stored page-14 candidates numerically without altering them
          a=pathlib.Path("tmp/v05-i03-figure-evidence/cinin-uc-kuresel-girisimi-baglaminda-ortadogu-politikasinin-seyri/images/p14-n008.jpg")
          b=pathlib.Path("tmp/v05-i03-figure-evidence/cinin-uc-kuresel-girisimi-baglaminda-ortadogu-politikasinin-seyri/images/p14-n009.jpg")
          for key,p in [("n008",a),("n009",b)]:
              out[key]=subprocess.check_output(["identify","-format","%w %h %[mean] %[standard-deviation]",str(p)],text=True).strip()
          pathlib.Path("tmp/v05-i03-page14-probe/report.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
          rm -f /tmp/a.pdf /tmp/a.xml
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tmp/v05-i03-page14-probe/report.json
          git commit -m 'Capture v05-i03 page-14 figure placement evidence'
          git pull --rebase origin chore/v05-i03-fulltext-canonical
          git push origin HEAD:chore/v05-i03-fulltext-canonical
