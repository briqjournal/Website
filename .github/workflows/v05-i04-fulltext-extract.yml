name: Finalize v05-i04 migration cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v05-i04-fulltext-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v05-i04-fulltext-canonical

      - name: Retire verified archives and restore reusable sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          archives=(
            'yukselen-kuresel-dogunun-yeni-caginda-cinin-genis-cevresel-diplomasisi'
            'yeni-asya-jeopolitigi-baglaminda-turk-devletleri-teskilati'
            'turk-devletleri-teskilati-rusya-cin-ve-irani-da-kapsamali'
            'kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi'
            'turkiyenin-turk-devletlerinin-butunlesmesindeki-etkin-rolu-baglam-uygulama-ve-etki'
            'orta-asyanin-tarimsal-gelisiminde-ve-ticaretinde-turkiyenin-aktif-oyun-kuruculugu'
            'turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin'
            'turkiyenin-afrika-icin-cok-boyutlu-stratejisi-ozellikler-temel-saikler-ve-gelecek-beklentileri'
            'yeni-bir-dunyanin-dogusu-tarihin-sonu-mu'
            'siir-vietnam-savasimiz'
            'siir-iki-kor'
            'hasat-2022'
          )
          for slug in "${archives[@]}"; do
            git rm "content/articles/$slug/fulltext/en-archive.json"
          done

          git rm -r --ignore-unmatch tmp/v05-i04-fidelity tmp/v05-i04-nonstandard-evidence
          git checkout origin/main -- scripts/extract-current-issue-fulltext.mjs

          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root=Path('.')
          issue=json.loads((root/'content/issues/v05-i04.json').read_text())
          slugs=issue['articles']
          archive_slugs={
            'yukselen-kuresel-dogunun-yeni-caginda-cinin-genis-cevresel-diplomasisi',
            'yeni-asya-jeopolitigi-baglaminda-turk-devletleri-teskilati',
            'turk-devletleri-teskilati-rusya-cin-ve-irani-da-kapsamali',
            'kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi',
            'turkiyenin-turk-devletlerinin-butunlesmesindeki-etkin-rolu-baglam-uygulama-ve-etki',
            'orta-asyanin-tarimsal-gelisiminde-ve-ticaretinde-turkiyenin-aktif-oyun-kuruculugu',
            'turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin',
            'turkiyenin-afrika-icin-cok-boyutlu-stratejisi-ozellikler-temel-saikler-ve-gelecek-beklentileri',
            'yeni-bir-dunyanin-dogusu-tarihin-sonu-mu',
            'siir-vietnam-savasimiz',
            'siir-iki-kor',
            'hasat-2022'
          }

          catalog_path=root/'content/catalog.json'
          catalog=json.loads(catalog_path.read_text())
          full=catalog['fulltext']
          full['en_archive']=[s for s in full.get('en_archive',[]) if s not in archive_slugs]
          full['current']=[s for s in full.get('current',[]) if s not in set(slugs)]
          localized=full.setdefault('localized',[])
          for slug in slugs:
              if slug not in localized:
                  localized.append(slug)
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')

          main_worklog=subprocess.check_output(
              ['git','show','origin/main:docs/WORKLOG.md'], text=True
          )
          replacement='''## Canonical full-text migration

**Status:** in progress

- Repository checkpoint: 91 canonical `fulltext/en.json` + `fulltext/tr.json` pairs remain alongside 152 legacy `en-archive.json` files; `current.json` and `saudi-en.json` are absent.
- Completed unit: `v06-i01`. All 15 records have validated canonical EN/TR pairs; the 14 legacy `en-archive.json` files are retired, and the visual-only Kızılçullu record remains explicitly empty.
- Completed unit: `v05-i04`. All 14 records have validated canonical EN/TR pairs; the 12 applicable legacy `en-archive.json` files are retired, and the poem, photograph, painting, and cartoon records preserve their published non-standard structures and verified visual assets.
- Next unit: `v05-i03`.
- Then continue issue-by-issue through the earlier issues. Rebuild corrupted English from the official English PDF; never substitute Turkish full text on English pages. Retire legacy files only after the canonical locale files are validated.
'''
          pattern=r'## Canonical full-text migration\n[\s\S]*?(?=\n## |\Z)'
          if not re.search(pattern,main_worklog):
              raise SystemExit('canonical worklog section not found on current main')
          updated=re.sub(pattern,replacement.rstrip(),main_worklog,count=1)
          (root/'docs/WORKLOG.md').write_text(updated)
          PY

          git rm .github/workflows/v05-i04-fulltext-extract.yml

      - name: Commit final migration cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/catalog.json docs/WORKLOG.md scripts/extract-current-issue-fulltext.mjs
          git diff --cached --check
          git commit -m 'Finalize v05-i04 canonical full-text migration'
          git push origin HEAD:chore/v05-i04-fulltext-canonical
