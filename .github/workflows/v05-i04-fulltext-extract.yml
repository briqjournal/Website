name: Recover missing v05-i04 first-nine figures

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v05-i04-fulltext-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v05-i04-fulltext-canonical

      - name: Install targeted image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Recover only the two confirmed missing first-nine figures
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          extract_largest_pdfimage() {
            local pdf="$1" page="$2" out="$3" prefix="$4"
            rm -f "$work/${prefix}"-*.png
            pdfimages -f "$page" -l "$page" -png "$pdf" "$work/${prefix}"
            local best="" best_area=0
            shopt -s nullglob
            for img in "$work/${prefix}"-*.png; do
              read -r width height < <(identify -format '%w %h' "$img")
              area=$((width * height))
              echo "$prefix candidate $(basename "$img"): ${width}x${height} area=${area} colorspace=$(identify -format '%[colorspace]' "$img")"
              if (( width >= 400 && height >= 250 && area > best_area )); then
                best="$img"
                best_area="$area"
              fi
            done
            test -n "$best"
            mkdir -p "$(dirname "$out")"
            convert "$best" -strip -quality 90 "$out"
            identify "$out"
          }

          tatar_url='https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/Ersin%20Tatar_C5S4.pdf'
          carbon_url='https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/B%C4%B0rol%20K%C4%B1lk%C4%B1%C5%9F_C5S4.pdf'
          curl -L --fail --retry 4 --retry-all-errors "$tatar_url" -o "$work/tatar.pdf"
          curl -L --fail --retry 4 --retry-all-errors "$carbon_url" -o "$work/carbon.pdf"

          extract_largest_pdfimage \
            "$work/tatar.pdf" 5 \
            'public/assets/article-figures/kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi/figure-02.jpg' \
            tatar

          extract_largest_pdfimage \
            "$work/carbon.pdf" 6 \
            'public/assets/article-figures/turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin/figure-03.jpg' \
            carbon

      - name: Commit recovered assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            public/assets/article-figures/kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi/figure-02.jpg \
            public/assets/article-figures/turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin/figure-03.jpg
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'Recover missing v05-i04 first-nine figure assets'
          git pull --rebase origin chore/v05-i04-fulltext-canonical
          git push origin HEAD:chore/v05-i04-fulltext-canonical
