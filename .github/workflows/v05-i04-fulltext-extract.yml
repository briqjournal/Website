name: Rebuild v05-i04 prose from individual PDFs

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v05-i04-fulltext-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v05-i04-fulltext-canonical

      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Rebuild nine prose records from official individual PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          issue = json.loads(Path("content/issues/v05-i04.json").read_text(encoding="utf-8"))
          slugs = issue["articles"][:9]
          assert len(slugs) == 9
          base_script = Path("scripts/extract-current-issue-fulltext.mjs").read_text(encoding="utf-8")
          tmp = Path("tmp")
          pdf_dir = tmp / "pdfs"
          pdf_dir.mkdir(parents=True, exist_ok=True)

          for slug in slugs:
              print(f"=== TARGET {slug} ===", flush=True)
              meta = json.loads((Path("content/articles") / slug / "metadata.json").read_text(encoding="utf-8"))
              en_url = meta["urls"]["pdfEn"]
              tr_url = meta["urls"]["pdfTr"]
              en_pdf = pdf_dir / "v5i4-en.pdf"
              tr_pdf = pdf_dir / "v5i4-tr.pdf"

              subprocess.run(["curl", "-L", "--fail", "--retry", "4", "--retry-all-errors", en_url, "-o", str(en_pdf)], check=True)
              subprocess.run(["curl", "-L", "--fail", "--retry", "4", "--retry-all-errors", tr_url, "-o", str(tr_pdf)], check=True)

              def pages(pdf):
                  out = subprocess.check_output(["pdfinfo", str(pdf)], text=True)
                  for line in out.splitlines():
                      if line.startswith("Pages:"):
                          return int(line.split(":", 1)[1].strip())
                  raise RuntimeError(f"No page count for {pdf}")

              last = max(pages(en_pdf), pages(tr_pdf))
              if slug == "turk-devletleri-teskilati-rusya-cin-ve-irani-da-kapsamali":
                  record = f'''{{
              slug: "{slug}",
              pages: [1, {last}],
              body: {{ tr: 1, en: 1 }},
              startContains: {{
                tr: "Son 10-15 yılda",
                en: "In the past 10-15 years",
              }},
              skipFirstPortrait: true,
            }}'''
              else:
                  record = f'''{{
              slug: "{slug}",
              pages: [1, {last}],
              body: {{ tr: 1, en: 1 }},
              start: {{ tr: "Giriş", en: "Introduction" }},
              skipFirstPortrait: true,
            }}'''

              pattern = r'const issueFiveFourRecords = \[[\s\S]*?\n\];\n\nconst issueConfigs = \{'
              replacement = "const issueFiveFourRecords = [\n  " + record + ",\n];\n\nconst issueConfigs = {"
              patched, count = re.subn(pattern, replacement, base_script, count=1)
              if count != 1:
                  raise RuntimeError("Could not patch issueFiveFourRecords")
              patched = patched.replace(
                  'records: issueFiveFourRecords,\n    sourceLocale: { tr: "tr", en: "en" },\n    extractImages: false,',
                  'records: issueFiveFourRecords,\n    sourceLocale: { tr: "tr", en: "en" },\n    extractImages: true,',
                  1,
              )

              target_script = tmp / "extract-v05-i04-target.mjs"
              target_script.write_text(patched, encoding="utf-8")
              subprocess.run(["node", str(target_script), "5-4"], check=True)

              root = Path("content/articles") / slug / "fulltext"
              current = root / "current.json"
              data = json.loads(current.read_text(encoding="utf-8"))
              for locale in ("en", "tr"):
                  payload = data[locale]
                  (root / f"{locale}.json").write_text(
                      json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
              current.unlink()
              subprocess.run(["git", "checkout", "--", "content/catalog.json"], check=True)

          shutil.rmtree(pdf_dir, ignore_errors=True)
          (tmp / "extract-v05-i04-target.mjs").unlink(missing_ok=True)
          PY

      - name: Validate rebuilt prose candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          issue = json.loads(Path("content/issues/v05-i04.json").read_text(encoding="utf-8"))
          required = {"sections", "keywords", "footnotes", "references", "acknowledgements", "figures"}
          for slug in issue["articles"][:9]:
              for locale in ("en", "tr"):
                  path = Path("content/articles") / slug / "fulltext" / f"{locale}.json"
                  data = json.loads(path.read_text(encoding="utf-8"))
                  assert required.issubset(data), (slug, locale, set(data))
                  assert isinstance(data["sections"], list) and data["sections"], (slug, locale)
                  body = " ".join(p for s in data["sections"] for p in s.get("paragraphs", []))
                  assert len(body) > 700, (slug, locale, len(body))
                  for i, section in enumerate(data["sections"], 1):
                      assert section["id"] == f"{locale}-section-{i}", (slug, locale, section["id"])
                  assert not (Path("content/articles") / slug / "fulltext" / "current.json").exists()
              print(slug, "OK")
          PY

      - name: Commit rebuilt prose candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          issue = json.loads(Path("content/issues/v05-i04.json").read_text(encoding="utf-8"))
          paths = []
          for slug in issue["articles"][:9]:
              paths.extend([
                  f"content/articles/{slug}/fulltext/en.json",
                  f"content/articles/{slug}/fulltext/tr.json",
              ])
              fig = Path("public/assets/article-figures") / slug
              if fig.exists():
                  paths.append(str(fig))
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
          git commit -m 'Rebuild v05-i04 prose from individual official PDFs'
          git pull --rebase origin chore/v05-i04-fulltext-canonical
          git push origin HEAD:chore/v05-i04-fulltext-canonical
