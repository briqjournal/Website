name: Extract v05-i04 nonstandard visuals

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v05-i04-fulltext-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v05-i04-fulltext-canonical

      - name: Install PDF and image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Extract only the three nonstandard visual records
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          evidence='tmp/v05-i04-nonstandard-evidence'
          rm -rf "$evidence"
          mkdir -p "$evidence"

          extract_one() {
            local slug="$1" url="$2"
            local pdf="$work/$slug.pdf"
            local raw="$work/$slug-images"
            local out="public/assets/article-figures/$slug"
            mkdir -p "$raw" "$out"
            curl -L --fail --retry 4 --retry-all-errors "$url" -o "$pdf"
            pdfinfo "$pdf" > "$evidence/$slug.pdfinfo.txt"
            pdftotext -layout "$pdf" "$evidence/$slug.txt"
            pdfimages -list "$pdf" > "$evidence/$slug-images.txt"
            pdfimages -png "$pdf" "$raw/image"

            local best="" best_score=-1
            : > "$evidence/$slug-candidates.txt"
            while IFS= read -r file; do
              local width height colorspace area color_bonus score
              read -r width height <<< "$(identify -format '%w %h' "$file")"
              colorspace="$(identify -format '%[colorspace]' "$file")"
              area=$((width * height))
              color_bonus=0
              if [[ ! "$colorspace" =~ ^Gray ]]; then color_bonus=1000000000; fi
              score=$((area + color_bonus))
              printf '%s | %sx%s | %s | score=%s\n' "$(basename "$file")" "$width" "$height" "$colorspace" "$score" >> "$evidence/$slug-candidates.txt"
              if (( width >= 500 && height >= 300 && score > best_score )); then
                best="$file"; best_score="$score"
              fi
            done < <(find "$raw" -maxdepth 1 -type f -name '*.png' | sort)

            test -n "$best"
            rm -rf "$out"
            mkdir -p "$out"
            convert "$best" -strip -quality 90 "$out/figure-01.jpg"
            printf 'selected=%s\n' "$(basename "$best")" >> "$evidence/$slug-candidates.txt"
            identify -verbose "$out/figure-01.jpg" | sed -n '1,35p' > "$evidence/$slug-selected.txt"
          }

          extract_one 'erzurum-sokaklari-1916' 'https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/PHOTOGRAPH%20ENG.pdf'
          extract_one 'hasat-2022' 'https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/PAINTING%20ENG.pdf'
          extract_one 'karikatur-molla-nasraddin-dergisinin-7-nisan-1906-tarihli-ilk-kapagi' 'https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/CARTOON%20ENG.pdf'

      - name: Commit targeted image evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i04-nonstandard-evidence public/assets/article-figures/erzurum-sokaklari-1916 public/assets/article-figures/hasat-2022 public/assets/article-figures/karikatur-molla-nasraddin-dergisinin-7-nisan-1906-tarihli-ilk-kapagi
          git diff --cached --quiet && exit 0
          git commit -m 'Extract v05-i04 nonstandard visual assets'
          git push origin HEAD:chore/v05-i04-fulltext-canonical
