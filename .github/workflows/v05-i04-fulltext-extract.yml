name: Recover missing v05-i04 first-nine figures

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v05-i04-fulltext-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v05-i04-fulltext-canonical

      - name: Install targeted image tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Recover only the two confirmed missing first-nine figures
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          crop_render() {
            local pdf="$1" page="$2" x_pct="$3" y_pct="$4" w_pct="$5" h_pct="$6" out="$7" tag="$8"
            pdftoppm -f "$page" -l "$page" -singlefile -jpeg -r 180 "$pdf" "$work/$tag"
            read -r width height < <(identify -format '%w %h' "$work/$tag.jpg")
            x=$((width * x_pct / 100))
            y=$((height * y_pct / 100))
            cw=$((width * w_pct / 100))
            ch=$((height * h_pct / 100))
            echo "$tag page render: ${width}x${height}; crop=${cw}x${ch}+${x}+${y}"
            mkdir -p "$(dirname "$out")"
            convert "$work/$tag.jpg" -crop "${cw}x${ch}+${x}+${y}" +repage -strip -quality 90 "$out"
            identify "$out"
          }

          tatar_url='https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/Ersin%20Tatar_C5S4.pdf'
          carbon_url='https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2024-09/B%C4%B0rol%20K%C4%B1lk%C4%B1%C5%9F%20ENG.pdf'
          curl -L --fail --retry 4 --retry-all-errors "$tatar_url" -o "$work/tatar.pdf"
          curl -L --fail --retry 4 --retry-all-errors "$carbon_url" -o "$work/carbon.pdf"

          # Physical page 5: map itself, excluding surrounding prose and the separate caption box.
          crop_render "$work/tatar.pdf" 5 6 43 88 42 \
            'public/assets/article-figures/kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi/figure-02.jpg' \
            tatar

          # Physical page 6: Figure 3 chart itself, excluding surrounding prose and the separate caption box.
          crop_render "$work/carbon.pdf" 6 15 14 70 35 \
            'public/assets/article-figures/turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin/figure-03.jpg' \
            carbon

      - name: Commit recovered assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            public/assets/article-figures/kuzey-kibris-turk-cumhuriyetinin-turk-devletleri-teskilatina-katiliminin-islevi/figure-02.jpg \
            public/assets/article-figures/turk-devletleri-teskilati-ve-kusak-yol-birlikteliginde-yeni-bir-karbon-piyasasinin-olusturulmasinin/figure-03.jpg
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'Recover missing v05-i04 first-nine figure assets'
          git pull --rebase origin chore/v05-i04-fulltext-canonical
          git push origin HEAD:chore/v05-i04-fulltext-canonical
