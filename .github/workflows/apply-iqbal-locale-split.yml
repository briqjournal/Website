name: Apply Iqbal locale split
on:
  push:
    branches: [automation/v7i4-iqbal]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean canonical full text, validate, and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main automation/v7i4-iqbal

          cat > /tmp/cleanup-v7i4.py <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          slugs = [
              "mao-zedungun-diyalektik-anlayisi-ekonomik-determinizm-elestirisi-siyasal-ozne-ve-cin-dusunce",
              "filistinciligin-zirve-paradoksu-transatlantik-kamuoyu-stratejik-realizm-ve-iki-devletli-cozumun",
          ]
          embedded_page = re.compile(r"(?<=[A-Za-z])\d{3}\s+(?=[A-Za-z])")

          for slug in slugs:
              path = root / "content" / "articles" / slug / "fulltext" / "en.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              for section in data.get("sections", []):
                  section["title"] = embedded_page.sub("", section.get("title", ""))
                  section["paragraphs"] = [embedded_page.sub("", paragraph) for paragraph in section.get("paragraphs", [])]
              for figure in data.get("figures", []):
                  caption = figure.get("caption")
                  if isinstance(caption, str):
                      figure["caption"] = embedded_page.sub("", caption)
              searchable = "\n".join(
                  [section.get("title", "") for section in data.get("sections", [])]
                  + [paragraph for section in data.get("sections", []) for paragraph in section.get("paragraphs", [])]
                  + [figure.get("caption", "") for figure in data.get("figures", [])]
              )
              assert not embedded_page.search(searchable), f"embedded PDF page number remains in {slug}"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          apply_cleanup() {
            python /tmp/cleanup-v7i4.py
            node scripts/generate-archive-data.mjs
            node scripts/generate-fulltext-modules.mjs
            node scripts/generate-runtime-data.mjs
            node --test tests/keyword-case.test.mjs tests/comak-english-fulltext.test.mjs tests/jordan-english-fulltext.test.mjs tests/koshy-english-fulltext.test.mjs tests/mao-english-fulltext.test.mjs tests/iqbal-english-fulltext.test.mjs
            git diff --check
          }

          BASE="$(git rev-parse origin/main)"
          git checkout -B v7i4-iqbal-validate "$BASE"
          apply_cleanup
          npm ci --no-audit --no-fund
          npm run build

          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'

          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            FINAL_BASE="$(git rev-parse origin/main)"
            git checkout -B v7i4-iqbal-final "$FINAL_BASE"
            apply_cleanup

            if git diff --quiet; then
              echo 'Canonical Iqbal/Mao English full text already clean on latest main.'
              exit 0
            fi

            git add content tests app
            git commit -m 'Clean V7I4 English full-text page artifacts'
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$FINAL_BASE" ]; then
              git push origin HEAD:main
              exit 0
            fi
            echo "main advanced during attempt $ATTEMPT; reapplying cleanup to latest main"
          done

          echo 'main kept advancing; refusing unsafe push after eight attempts'
          exit 1
