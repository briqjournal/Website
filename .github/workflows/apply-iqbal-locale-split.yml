name: Apply Iqbal locale split
on:
  push:
    branches: [automation/v7i4-iqbal]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild, validate, and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          URL='https://briqjournal.com/sites/default/files/yazi-ici-dosyalar/2026-08/Iqbal%20Akhtar_The%20Paradox%20of%20Peak%20Palestinianism%20Transatlantic%20Public.pdf'
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 120 "$URL" -o /tmp/iqbal.pdf
          pdftotext -nopgbrk /tmp/iqbal.pdf /tmp/iqbal-flow.txt
          git fetch origin main automation/v7i4-iqbal
          git show origin/automation/v7i4-iqbal:scripts/repair-iqbal-fulltext.py > /tmp/repair-iqbal.py
          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'

          BASE="$(git rev-parse origin/main)"
          git checkout -B v7i4-iqbal-repair "$BASE"
          git show origin/automation/v7i4-iqbal:tests/iqbal-english-fulltext.test.mjs > tests/iqbal-english-fulltext.test.mjs
          python /tmp/repair-iqbal.py
          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs
          node --test tests/keyword-case.test.mjs tests/comak-english-fulltext.test.mjs tests/jordan-english-fulltext.test.mjs tests/koshy-english-fulltext.test.mjs tests/mao-english-fulltext.test.mjs tests/iqbal-english-fulltext.test.mjs
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          git add content tests app
          git commit -m 'Repair and split Iqbal bilingual full text'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
            git push origin HEAD:main
            exit 0
          fi

          echo 'main advanced during full build; reapplying the already validated migration to latest main'
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            git fetch origin main automation/v7i4-iqbal
            BASE="$(git rev-parse origin/main)"
            git checkout -B v7i4-iqbal-repair "$BASE"
            git show origin/automation/v7i4-iqbal:tests/iqbal-english-fulltext.test.mjs > tests/iqbal-english-fulltext.test.mjs
            python /tmp/repair-iqbal.py
            node scripts/generate-archive-data.mjs
            node scripts/generate-fulltext-modules.mjs
            node scripts/generate-runtime-data.mjs
            node --test tests/keyword-case.test.mjs tests/comak-english-fulltext.test.mjs tests/jordan-english-fulltext.test.mjs tests/koshy-english-fulltext.test.mjs tests/mao-english-fulltext.test.mjs tests/iqbal-english-fulltext.test.mjs
            git diff --check
            git add content tests app
            git commit -m 'Repair and split Iqbal bilingual full text'
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
              git push origin HEAD:main
              exit 0
            fi
            echo "main advanced during quick attempt $ATTEMPT; retrying on latest main"
          done
          echo 'main kept advancing; refusing unsafe push after eight quick attempts'
          exit 1
