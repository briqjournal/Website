name: Fix Iratni section hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-iratni-section-levels.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct section levels
        run: |
          git pull --rebase origin main
          python <<'PY'
          import json
          from pathlib import Path

          p = Path('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          expected = [
              'Introduction',
              'The “Mecca” of the Revolutionaries',
              'Diplomatic support',
              'Arms and military training for African freedom fighters',
              'The Arduous Quest for a Militant Non-Aligned Movement',
              'Adapting the Non-Aligned Movement to an Evolving Global Landscape',
              'Conclusion',
          ]
          assert [s['title'] for s in data['sections']] == expected
          for i, section in enumerate(data['sections'], 1):
              section['level'] = 'subsection' if i in (3, 4) else 'section'
          body = '\n'.join(x for s in data['sections'] for x in s.get('paragraphs', []))
          assert len(body.split()) > 6500
          assert len(data.get('references', [])) == 32
          for bad in ['pre-sence', 'effec- tively', 'colle- ctively', 'co-lonial', 're-volutionary', 'pro-viding', 'suscep- tible']:
              assert bad not in body, bad
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node -e "JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json','utf8'));"
          rm .github/workflows/fix-iratni-section-levels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json .github/workflows/fix-iratni-section-levels.yml
          git commit -m 'Fix Iratni section hierarchy'
          git pull --rebase origin main
          git push origin HEAD:main
