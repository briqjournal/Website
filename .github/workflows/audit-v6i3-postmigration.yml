name: Audit V6I3 postmigration
on:
  push:
    branches: [audit/v6i3-postmigration]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-verified fidelity finalizer
        run: python3 scripts/finalize-v6i3-pdf-fidelity-v2.py
      - name: Inspect finalized canonical structure
        run: |
          python3 <<'PY'
          import json,re,pathlib
          issue=json.load(open('content/issues/v06-i03.json'))
          for slug in issue['articles']:
            print('\n###',slug)
            for loc in ('en','tr'):
              p=pathlib.Path('content/articles')/slug/'fulltext'/f'{loc}.json'
              d=json.load(open(p))
              print(loc,'sections=',len(d.get('sections',[])),'refs=',len(d.get('references',[])),'figs=',len(d.get('figures',[])))
              for s in d.get('sections',[]): print('  H',s.get('level','section'),repr(s['title']),'paras',len(s.get('paragraphs',[])))
              paras=[x for s in d.get('sections',[]) for x in s.get('paragraphs',[])]
              broken=[]
              for s in d.get('sections',[]):
                ps=s.get('paragraphs',[])
                for x,y in zip(ps,ps[1:]):
                  if re.search(r'[A-Za-zÇĞİÖŞÜçğıöşü]-$',x) and re.match(r'^[a-zçğıöşü]',y): broken.append((x[-80:],y[:80]))
              print('  broken_hyphen_boundaries=',len(broken))
              print('  repeated_page_numbers=',sum(1 for x in paras if re.fullmatch(r'(\d{3})\1',x)))
              print('  exact_long_duplicates=',len(paras)-len({x for x in paras if len(x)>=80})-sum(1 for x in paras if len(x)<80))
          PY
      - name: Show source diff
        run: git diff --stat && git diff --check
