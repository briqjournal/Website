name: One-time Gurcan staged-payload inspection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-gurcan-fulltext.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged payload for inspection
        run: |
          set -euo pipefail
          : > tmp/gurcan-decoded-partial.json
          for f in tmp/gurcan-fulltext-1.b64 tmp/gurcan-fulltext-2.b64 tmp/gurcan-fulltext-3.b64 tmp/gurcan-fulltext-4.b64; do
            base64 --decode "$f" >> tmp/gurcan-decoded-partial.json
          done
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('tmp/gurcan-decoded-partial.json')
          raw = p.read_text(encoding='utf-8')
          diag = {
              'bytes': len(raw.encode('utf-8')),
              'characters': len(raw),
              'starts_with': raw[:160],
              'ends_with': raw[-500:],
          }
          try:
              data = json.loads(raw)
              diag['valid_json'] = True
              diag['section_titles'] = [s.get('title', '') for s in data.get('sections', [])]
              diag['reference_count'] = len(data.get('references', []))
          except Exception as exc:
              diag['valid_json'] = False
              diag['json_error'] = str(exc)
          Path('tmp/gurcan-diagnostics.json').write_text(json.dumps(diag, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          rm .github/workflows/finalize-gurcan-fulltext.yml
          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'
          git add tmp/gurcan-decoded-partial.json tmp/gurcan-diagnostics.json .github/workflows/finalize-gurcan-fulltext.yml
          git commit -m 'Inspect decoded Gürcan staged payload'
          git push origin HEAD:main
