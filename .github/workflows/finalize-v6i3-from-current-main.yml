name: Finalize V6I3 against current main
on:
  push:
    branches: [migration/v6i3-canonical]
    paths:
      - '.github/workflows/finalize-v6i3-from-current-main.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare current main and audited migration tools
        run: |
          cp scripts/migrate-v6i3-canonical.py /tmp/migrate.py
          cp scripts/postprocess-v6i3.py /tmp/postprocess.py
          cp tests/v6i3-content-integrity.test.mjs /tmp/integrity.mjs
          cp tests/v6i3-source-fidelity.test.mjs /tmp/fidelity.mjs
          git fetch origin main
          BASE=$(git rev-parse origin/main)
          echo "$BASE" > /tmp/v6i3-base
          git show origin/main:content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json > /tmp/iratni-en.json
          git checkout -B finalize/v6i3-current origin/main
          cp /tmp/migrate.py scripts/migrate-v6i3-canonical.py
          cp /tmp/postprocess.py scripts/postprocess-v6i3.py
          cp /tmp/integrity.mjs tests/v6i3-content-integrity.test.mjs
          cp /tmp/fidelity.mjs tests/v6i3-source-fidelity.test.mjs
      - name: Support both canonical reference representations
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/postprocess-v6i3.py'); s=p.read_text()
          old="""  for r in d.get('references',[]):\n   txt=r.get('text','')\n   txt=re.sub(r'(https?://\\S*?)\\s+(?=[A-Za-z0-9/?#._=&%-])',lambda m:m.group(1),txt)\n   r['text']=txt\n"""
          new="""  for i,r in enumerate(d.get('references',[])):\n   if isinstance(r,str):\n    txt=r\n    txt=re.sub(r'(https?://\\S*?)\\s+(?=[A-Za-z0-9/?#._=&%-])',lambda m:m.group(1),txt)\n    d['references'][i]=txt\n   else:\n    txt=r.get('text','')\n    txt=re.sub(r'(https?://\\S*?)\\s+(?=[A-Za-z0-9/?#._=&%-])',lambda m:m.group(1),txt)\n    r['text']=txt\n"""
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Install PDF extraction dependencies
        run: python3 -m pip install --quiet pymupdf pymupdf4llm
      - name: Rebuild and source-audit Volume 6 Issue 3
        run: |
          for slug in china-reconstructs hendra-gunawan endonezya-posta-pulu; do mkdir -p "content/articles/$slug/fulltext"; done
          python3 scripts/migrate-v6i3-canonical.py
          cp /tmp/iratni-en.json content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en.json
          python3 scripts/postprocess-v6i3.py
          node scripts/generate-archive-data.mjs
          node scripts/generate-fulltext-modules.mjs
          node scripts/generate-runtime-data.mjs
      - name: Run V6I3 source fidelity tests
        run: node --test tests/v6i3-content-integrity.test.mjs tests/v6i3-source-fidelity.test.mjs
      - name: Install node dependencies
        run: npm ci
      - name: Run complete repository test and production build suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Verify main stayed unchanged during validation
        run: |
          git fetch origin main
          test "$(cat /tmp/v6i3-base)" = "$(git rev-parse origin/main)"
      - name: Commit audited V6I3 content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content app public/assets/article-figures tests/v6i3-content-integrity.test.mjs tests/v6i3-source-fidelity.test.mjs
          git status --short
          git commit -m "Finalize Volume 6 Issue 3 canonical full text"
          git push origin HEAD:main
