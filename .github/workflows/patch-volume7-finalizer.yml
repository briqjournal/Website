name: Patch Volume 7 Finalizer
on:
  push:
    branches: [fix/volume7-canonical-finalization]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/volume7-canonical-finalization
      - name: Fix test import
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/finalize-volume7-canonical.yml')
          s=p.read_text()
          old="import { bilingualKeywordParityOverrides } from './scripts/content-store.mjs';"
          new="import { bilingualKeywordParityOverrides } from '../scripts/content-store.mjs';"
          if old not in s:
              print('Already patched')
          else:
              p.write_text(s.replace(old,new))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'BRIQ Journal'
          git config user.email 'briq@briqjournal.com'
          git add .github/workflows/finalize-volume7-canonical.yml
          git commit -m 'Fix Volume 7 canonical test import path'
          git push origin HEAD:fix/volume7-canonical-finalization
