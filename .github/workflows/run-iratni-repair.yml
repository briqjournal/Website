name: Run Iratni full-text repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-iratni-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild from source PDF
        run: |
          git pull --rebase origin main
          python -m pip install --quiet pymupdf
          curl -L --fail --retry 3 'https://www.briqjournal.com/sites/default/files/yazi-ici-dosyalar/2025-06/Belkacem%20Iratni_ENG.pdf' -o /tmp/iratni.pdf
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/fix-iratni-fulltext.yml').read_text(encoding='utf-8')
          body = src.split("python <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          old = "heading_lookup = {re.sub(r'\\s+', ' ', h).strip(): h for h in headings}"
          new = "def canon_heading(s):\n    s = unicodedata.normalize('NFKD', s).replace('“', '').replace('”', '').replace('’', \"'\")\n    return re.sub(r'[^a-z0-9]+', '', s.lower())\nheading_lookup = {canon_heading(h): h for h in headings}"
          assert old in body
          body = body.replace(old, new, 1)
          body = body.replace('ref_blocks = []', 'ref_blocks = []\nmanual_started = set()', 1)
          body = body.replace('if nt in heading_lookup:', 'hkey = canon_heading(nt)\n        if hkey in heading_lookup:', 1)
          body = body.replace('current = start_section(heading_lookup[nt])', 'current = start_section(heading_lookup[hkey])', 1)
          needle = "for b in blocks:\n        t = b['text']"
          replacement = "for b in blocks:\n        manual = {11: ('The Arduous Quest for a Militant Non-Aligned Movement', 'R', 108.1), 18: ('Adapting the Non-Aligned Movement to an Evolving Global Landscape', 'L', 108.7)}\n        if pno in manual:\n            title, col, y = manual[pno]\n            in_col = (b['x0'] >= 285) if col == 'R' else (b['x0'] < 285)\n            if in_col and b['y0'] >= y - 3 and pno not in manual_started:\n                started = True\n                current = start_section(title)\n                manual_started.add(pno)\n            if in_col and y - 3 <= b['y0'] <= y + 30 and any('MinionPro-Bold' in f for f in b['fonts']):\n                continue\n        t = b['text']"
          assert needle in body
          body = body.replace(needle, replacement, 1)
          body = body.replace('assert len(body_text.split()) > 7500, len(body_text.split())', 'assert len(body_text.split()) > 6500, len(body_text.split())', 1)
          exec(compile(body, '<iratni-repair>', 'exec'), {})
          PY
          node -e "JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json','utf8')); JSON.parse(require('fs').readFileSync('content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/metadata.json','utf8'));"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/fulltext/en-archive.json content/articles/cezayir-devrimci-diplomasisi-bandung-temel-girisiminden-yeni-bir-baglantisizlar-konseptine/metadata.json
          git commit -m 'Rebuild Iratni English full text from source PDF'
          git pull --rebase origin main
          git push origin HEAD:main
