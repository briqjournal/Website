name: V7I1 Humphrey detail
on:
  push:
    branches: [automation/v7i1-structure-inventory]
permissions:
  contents: read
jobs:
  detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node <<'JS'
          const fs=require('fs'); const g=JSON.parse(fs.readFileSync('content/articles/dunyanin-yeniden-duzenlenisi-bolgesel-bloklar-ve-cok-kutuplu-kuresel-yonetisimin-yukselisi/fulltext/current.json'));
          for(const l of ['en','tr']) { console.log('\n',l); (g[l].references||[]).forEach((r,i)=>{const t=typeof r==='string'?r:r.text; if(/Humphrey|multilateral development banks|China in the multilateral/i.test(t)) console.log(i,t)}); }
          JS
