name: Verify published PDF directly in R2
on:
  push:
    branches: [diagnostic/site-access-2026-10-10]
    paths: [.github/workflows/repair-r2-pdf-title.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PDF reader
        run: python3 -m pip install --quiet pymupdf
      - name: Verify the stored production PDF without further writes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import fitz
          key="assets/archive/pdfs/issues/cilt-6-sayi-4-en.pdf"
          command=["aws","s3api","get-object","--bucket",os.environ["R2_BUCKET"],"--key",key,"--endpoint-url",os.environ["R2_ENDPOINT"],"verified-live-r2.pdf","--query","ContentLength","--output","text"]
          subprocess.run(command,check=True)
          p=Path("verified-live-r2.pdf")
          doc=fitz.open(p)
          hits=[i+1 for i,page in enumerate(doc) if "BURADA KAPAK OLACAK" in " ".join(page.get_text().split())]
          report={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size,"pages":len(doc),"title":doc.metadata["title"],"placeholder_pages":hits}
          print("R2_FINAL_VERIFICATION="+json.dumps(report,ensure_ascii=False))
          assert report["sha256"]=="b0f75196a42d1d096e98a01209aea901f64298250c1478f676527a62e64a63a1"
          assert len(doc)==114 and not hits
          assert report["title"]=="BRIQ — Volume 6, Issue 4 — Autumn 2025"
          
          PY
