name: v05-i01 evidence capture

on:
  push:
    branches:
      - chore/v05-i01-fulltext-canonical
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/v05-i01-evidence.yml'
      - 'content/articles/**'
      - 'content/issues/v05-i01.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Capture v05-i01 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/v05-i01-evidence
          mkdir -p tmp/v05-i01-evidence
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.request, shutil, re, os

          root = pathlib.Path(".")
          issue = json.loads((root/"content/issues/v05-i01.json").read_text())
          outroot = root/"tmp/v05-i01-evidence"
          inventory = []

          def stats(path):
              if not path.exists():
                  return {"exists": False}
              try:
                  data = json.loads(path.read_text())
              except Exception as e:
                  return {"exists": True, "parse_error": str(e), "bytes": path.stat().st_size}
              sections = data.get("sections") if isinstance(data, dict) else None
              paragraphs = 0
              if isinstance(sections, list):
                  for sec in sections:
                      ps = sec.get("paragraphs", []) if isinstance(sec, dict) else []
                      if isinstance(ps, list):
                          paragraphs += len(ps)
              def n(key):
                  v = data.get(key, []) if isinstance(data, dict) else []
                  return len(v) if isinstance(v, list) else (1 if v else 0)
              return {
                  "exists": True,
                  "bytes": path.stat().st_size,
                  "sections": len(sections) if isinstance(sections, list) else None,
                  "paragraphs": paragraphs,
                  "references": n("references"),
                  "footnotes": n("footnotes"),
                  "figures": n("figures"),
                  "keywords": n("keywords"),
              }

          for slug in issue["articles"]:
              art = root/"content/articles"/slug
              meta = json.loads((art/"metadata.json").read_text())
              recdir = outroot/slug
              recdir.mkdir(parents=True, exist_ok=True)
              row = {
                  "slug": slug,
                  "title": meta.get("title"),
                  "type": meta.get("articleType"),
                  "pages": meta.get("pages"),
                  "urls": meta.get("urls"),
                  "files": {
                      "en": stats(art/"fulltext/en.json"),
                      "tr": stats(art/"fulltext/tr.json"),
                      "archive": stats(art/"fulltext/en-archive.json"),
                  },
              }
              (recdir/"metadata-summary.json").write_text(json.dumps({
                  "slug": slug,
                  "title": meta.get("title"),
                  "type": meta.get("articleType"),
                  "pages": meta.get("pages"),
                  "urls": meta.get("urls"),
                  "contributors": meta.get("contributors"),
                  "language": meta.get("language"),
              }, ensure_ascii=False, indent=2)+"\n")

              for locale, key in (("en","pdfEn"),("tr","pdfTr")):
                  url = (meta.get("urls") or {}).get(key)
                  row.setdefault("pdf", {})[locale] = {"url": url}
                  if not url:
                      row["pdf"][locale]["missing_url"] = True
                      continue
                  pdf = pathlib.Path("/tmp")/f"v05-i01-{slug}-{locale}.pdf"
                  try:
                      subprocess.run(["curl","-L","--fail","--retry","3","--retry-delay","2","-o",str(pdf),url], check=True)
                      for mode, args in (
                          ("layout", ["pdftotext","-layout",str(pdf),str(recdir/f"{locale}.layout.txt")]),
                          ("raw", ["pdftotext","-raw",str(pdf),str(recdir/f"{locale}.raw.txt")]),
                      ):
                          subprocess.run(args, check=True)
                      with open(recdir/f"{locale}.pdfinfo.txt","w") as fh:
                          subprocess.run(["pdfinfo",str(pdf)], check=True, stdout=fh, text=True)
                      with open(recdir/f"{locale}.images.txt","w") as fh:
                          subprocess.run(["pdfimages","-list",str(pdf)], check=True, stdout=fh, text=True)
                      txt = (recdir/f"{locale}.layout.txt").read_text(errors="replace")
                      row["pdf"][locale].update({
                          "downloaded": True,
                          "bytes": pdf.stat().st_size,
                          "text_chars": len(txt),
                          "formfeeds": txt.count("\f"),
                      })
                  except Exception as e:
                      row["pdf"][locale]["error"] = repr(e)
                  finally:
                      try: pdf.unlink()
                      except Exception: pass

              inventory.append(row)

          (outroot/"inventory.json").write_text(json.dumps(inventory, ensure_ascii=False, indent=2)+"\n")
          PY

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/v05-i01-evidence
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "Capture v05-i01 authoritative PDF evidence"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
