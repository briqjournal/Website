name: Fix Jian heading hierarchy

on:
  push:
    paths:
      - '.github/workflows/fix-jian-heading-hierarchy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct section hierarchy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis"
          base = Path("content/articles") / slug / "fulltext"

          config = {
              "en": {
                  "parent": "The Research Object and Definitions of Socialist Political Economy with Chinese Characteristics",
                  "child": "Multiple Definitions of the Research Object and Connotation of Socialist Political Economy with Chinese Characteristics",
              },
              "tr": {
                  "parent": "Çin’e Özgü Sosyalist Politik Ekonominin Araştırma Nesnesi ve Tanımları",
                  "child": "Çin’e Özgü Sosyalist Politik Ekonominin Araştırma Nesnesinin Çoklu Tanımları ve Anlamı",
              },
          }

          for lang, labels in config.items():
              path = base / f"{lang}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              sections = data["sections"]
              by_id = {section["id"]: section for section in sections}
              second_id = f"{lang}-section-2"
              child_id = f"{lang}-section-2a"

              if child_id not in by_id:
                  second = by_id[second_id]
                  combined = f'{labels["parent"]} {labels["child"]}'
                  if second["title"] != combined:
                      raise RuntimeError(f"Unexpected {lang} section 2 title: {second['title']}")
                  child = {
                      "id": child_id,
                      "title": labels["child"],
                      "paragraphs": second["paragraphs"],
                      "level": "subsection",
                  }
                  second["title"] = labels["parent"]
                  second["paragraphs"] = []
                  insert_at = sections.index(second) + 1
                  sections.insert(insert_at, child)

              section_ids = {f"{lang}-section-{n}" for n in (1, 2, 5, 10, 11, 12)}
              subsection_ids = {f"{lang}-section-{n}" for n in (3, 4, 6, 7, 8, 9)} | {child_id}
              for section in sections:
                  if section["id"] in section_ids:
                      section["level"] = "section"
                  elif section["id"] in subsection_ids:
                      section["level"] = "subsection"

              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit correction
        run: |
          if git diff --quiet -- content/articles/cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis/fulltext/en.json content/articles/cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis/fulltext/tr.json; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add content/articles/cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis/fulltext/en.json content/articles/cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis/fulltext/tr.json
          git commit -m "Correct Jian article heading hierarchy"
          git pull --rebase origin main
          git push origin HEAD:main
