name: Verify reference renderer

on:
  push:
    paths:
      - ".github/workflows/verify-reference-renderer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Re-audit reference links
        run: |
          python3 scripts/normalize-reference-links.py
          git diff --exit-code
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
