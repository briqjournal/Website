name: Final validate v07-i02 full-text fidelity

on:
  push:
    branches:
      - audit/v07-i02-fulltext-fidelity
    paths:
      - tmp/v07-i02-final-trigger.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audit/v07-i02-fulltext-fidelity
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run complete issue fidelity audit
        run: python3 scripts/audit-fulltext-fidelity.py v07-i02
      - name: Check issue-wide hard failures
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path(".audit/fulltext-fidelity/v07-i02/report.json")
          data=json.loads(p.read_text())
          failures=[]
          summary=[]
          for r in data["locales"]:
              if r.get("status") == "article_pdf_unavailable":
                  summary.append({"slug":r["slug"],"locale":r["locale"],"status":r["status"]})
                  continue
              hard={
                "duplicate_paragraphs":r.get("duplicate_paragraphs") or [],
                "duplicate_footnote_ids":r.get("duplicate_footnote_ids") or [],
                "metadata_leakage_candidates":r.get("metadata_leakage_candidates") or [],
                "turkish_contamination_candidates":r.get("turkish_contamination_candidates") or [],
                "cross_record_title_candidates":r.get("cross_record_title_candidates") or [],
                "figure_captions_low_match":r.get("figure_captions_low_match") or [],
                "missing_figure_assets":r.get("missing_figure_assets") or [],
              }
              for key,value in hard.items():
                  if value: failures.append((r["slug"],r["locale"],key,value))
              summary.append({
                "slug":r["slug"],"locale":r["locale"],
                "figures":r.get("canonical_figures"),
                "figure_caption_match_ratio":r.get("figure_caption_match_ratio"),
                "references_low_match":len(r.get("references_low_match") or []),
                "nonmonotonic":len(r.get("nonmonotonic_assignments") or []),
                "empty_sections":len(r.get("empty_sections") or []),
              })
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if failures:
              print(json.dumps(failures,ensure_ascii=False,indent=2))
              raise SystemExit("hard fidelity audit failures remain")
          PY
      - name: Run v07-i02 regression test
        run: node --test tests/v7i2-content-integrity.test.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Lint
        run: npm run lint
