name: Extract v07-i02 verified figure assets

on:
  push:
    branches:
      - audit/v07-i02-fulltext-fidelity
    paths:
      - tmp/v07-i02-assets-trigger.txt

permissions:
  contents: write

jobs:
  extract-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audit/v07-i02-fulltext-fidelity
      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --user pillow
      - name: Extract verified published visuals
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess, tempfile, urllib.request
          from PIL import Image

          root=pathlib.Path(".")
          mapping={
            "sovyet-reformunun-tarihi-trajedisinden-bizi-kurtaran-ne-oldu-cinin-ekonomik-cagdaslasmasina-yon-0":
              [("en",4),("en",6),("en",8),("en",10),("en",12)],
            "cine-ozgu-sosyalist-politik-ekonomiye-genel-bakis":
              [("en",4),("en",6),("en",8),("en",10),("en",14),("en",16),("en",18),("en",20),("tr",22)],
            "afrikada-yabanci-guclerin-mudahaleleri-elestirel-bir-degerlendirme":
              [("en",4),("en",6),("en",8),("en",10),("en",12),("en",14),("en",16),("en",18),("en",20),("en",22)],
            "uluslararasi-kalkinma-isbirliginin-ic-siyasal-mantigi-guneydogu-asyada-kusak-ve-yol-girisiminin":
              [("en",4),("en",6),("en",8),("en",10),("en",12),("en",13),("en",16),("en",18),("en",20),("en",22),("en",24),("en",26)],
            "hitlerin-sovyetler-birligine-karsi-savasi-ayni-zamanda-abd-icin-bir-vekalet-savasiydi":
              [("en",5),("en",10),("en",12)],
            "japonyadaki-abd-isgaline-karsi-sag-ve-sol-arasinda-olasi-ittifak":
              [("en",4),("en",5),("en",7)],
          }

          cache={}
          def get_pdf(slug,loc):
              key=(slug,loc)
              if key in cache: return cache[key]
              meta=json.loads((root/"content/articles"/slug/"metadata.json").read_text())
              url=(meta.get("urls") or {}).get("pdfEn" if loc=="en" else "pdfTr")
              if not url: raise RuntimeError(f"missing PDF URL: {slug} {loc}")
              dest=pathlib.Path("/tmp")/f"{slug}-{loc}.pdf"
              req=urllib.request.Request(url,headers={"User-Agent":"BRIQ-v07-i02-fidelity-assets/1.0"})
              with urllib.request.urlopen(req,timeout=90) as r, open(dest,"wb") as out:
                  shutil.copyfileobj(r,out)
              cache[key]=dest
              return dest

          for slug,specs in mapping.items():
              outdir=root/"public/assets/article-figures"/slug
              outdir.mkdir(parents=True,exist_ok=True)
              for idx,(loc,page) in enumerate(specs,1):
                  pdf=get_pdf(slug,loc)
                  with tempfile.TemporaryDirectory() as td:
                      prefix=pathlib.Path(td)/"img"
                      subprocess.run(["pdfimages","-png","-f",str(page),"-l",str(page),str(pdf),str(prefix)],
                                     check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
                      candidates=[]
                      for p in pathlib.Path(td).glob("img-*"):
                          try:
                              with Image.open(p) as im:
                                  area=im.width*im.height
                                  is_color=im.mode not in ("1","L","LA")
                                  candidates.append((1 if is_color else 0,area,p,im.width,im.height,im.mode))
                          except Exception:
                              pass
                      if not candidates: raise RuntimeError(f"no embedded image: {slug} {loc} p{page}")
                      candidates.sort(reverse=True,key=lambda x:(x[0],x[1]))
                      _,_,chosen,w,h,mode=candidates[0]
                      with Image.open(chosen) as im:
                          im=im.convert("RGB")
                          im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
                          dest=outdir/f"figure-{idx:02}.jpg"
                          im.save(dest,"JPEG",quality=88,optimize=True,progressive=True)
                          print(f"{slug} figure-{idx:02} <- {loc} p{page}: {w}x{h} {mode} -> {im.width}x{im.height} {dest.stat().st_size} bytes")
          PY
      - name: Validate canonical asset references
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          issue=json.loads((root/"content/issues/v07-i02.json").read_text())
          missing=[]
          for slug in issue["articles"]:
              for loc in ("en","tr"):
                  j=json.loads((root/"content/articles"/slug/"fulltext"/f"{loc}.json").read_text())
                  for fig in j.get("figures") or []:
                      src=fig.get("src")
                      if src and src.startswith("/") and not (root/"public"/src.lstrip("/")).exists():
                          missing.append((slug,loc,src))
          if missing: raise SystemExit(f"missing figure assets: {missing}")
          print("All canonical figure assets resolve.")
          PY
      - name: Commit verified figure assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/article-figures
          git commit -m "fix: restore v07-i02 published figure assets"
          git pull --rebase origin audit/v07-i02-fulltext-fidelity
          git push
