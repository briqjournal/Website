name: One-time Mongolia funding fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mongolia-funding.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move acknowledgement text to funding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim"
          base = Path("content/articles") / slug / "fulltext"
          expected = {
              "tr": "Bu makale, “Ulusal Sosyal Bilimler Vakfı Gençlik Programı” (21CGJ037) tarafından desteklenmektedir.",
              "en": "This article is supported by funding from the “National Social Science Foundation Youth Program” (21CGJ037).",
          }

          for locale in ("tr", "en"):
              path = base / f"{locale}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              acknowledgement = (data.get("acknowledgements") or "").strip()
              if acknowledgement and acknowledgement != expected[locale]:
                  raise SystemExit(f"Unexpected acknowledgement in {path}: {acknowledgement!r}")
              declarations = data.setdefault("declarations", {})
              declarations["funding"] = expected[locale]
              declarations.pop("acknowledgements", None)
              data["acknowledgements"] = ""
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git rm .github/workflows/fix-mongolia-funding.yml
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add content/articles/mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim/fulltext/tr.json
          git add content/articles/mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim/fulltext/en.json
          git commit -m "Move Mongolia article acknowledgement to funding"
          git pull --rebase origin main
          git push origin HEAD:main
