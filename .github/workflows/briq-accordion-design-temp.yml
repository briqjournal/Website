name: Refine article accordion design

on:
  push:
    paths:
      - '.github/workflows/briq-accordion-design-temp.yml'

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch accordion styles
        run: python3 scripts/patch-article-accordion-design.py
      - name: Commit accordion design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Unify article accordions and stack author declarations"
          git push
