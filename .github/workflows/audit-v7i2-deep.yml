name: Deep audit V7I2
on:
  push:
    branches: [automation/v7i2-deep-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Audit repository records and source PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, tempfile, urllib.request, unicodedata
          from pathlib import Path
          from collections import Counter

          root=Path('.')
          issue=json.loads((root/'content/issues/v07-i02.json').read_text())
          catalog=json.loads((root/'content/catalog.json').read_text())
          slugs=issue['articles']
          print('BASE ISSUE:', issue['volume'], issue['issue'], issue['season_tr'], issue['year'])
          print('CONTRIBUTIONS:', len(slugs))
          print()

          errors=[]; warnings=[]; notes=[]
          meta_rows=[]

          def norm(s):
              s=unicodedata.normalize('NFKC', str(s or '')).lower()
              s=s.replace('–','-').replace('—','-').replace('’',"'").replace('“','"').replace('”','"')
              s=re.sub(r'-\s*\n\s*','',s)
              s=re.sub(r'\s+',' ',s)
              s=re.sub(r'[^\w\s:/\.\-\'"()]',' ',s, flags=re.UNICODE)
              return re.sub(r'\s+',' ',s).strip()

          def shingles(text,n=4):
              toks=norm(text).split()
              return {' '.join(toks[i:i+n]) for i in range(max(0,len(toks)-n+1))}

          def pdf_coverage(canonical,pdftext):
              a=shingles(canonical,4); b=shingles(pdftext,4)
              if not a: return None
              return len(a & b)/len(a)

          def all_text(ft):
              parts=[]
              for s in ft.get('sections',[]):
                  parts.append(s.get('title',''))
                  parts.extend(s.get('paragraphs',[]) or [])
              for x in ft.get('footnotes',[]) or []: parts.append(x.get('text',''))
              for x in ft.get('references',[]) or []: parts.append(x.get('text',''))
              return '\n'.join(p for p in parts if p)

          def body_text(ft):
              parts=[]
              for s in ft.get('sections',[]):
                  parts.append(s.get('title',''))
                  parts.extend(s.get('paragraphs',[]) or [])
              return '\n'.join(p for p in parts if p)

          def get_meta_value(m, legacy, nested=None):
              if legacy in m: return m.get(legacy)
              if nested:
                  cur=m
                  for k in nested:
                      if not isinstance(cur,dict): return None
                      cur=cur.get(k)
                  return cur
              return None

          tmp=Path(tempfile.mkdtemp(prefix='v7i2-audit-'))
          for idx,slug in enumerate(slugs,1):
              base=root/'content/articles'/slug
              m=json.loads((base/'metadata.json').read_text())
              en=json.loads((base/'fulltext/en.json').read_text())
              tr=json.loads((base/'fulltext/tr.json').read_text())
              files=sorted(p.name for p in (base/'fulltext').iterdir() if p.is_file())
              schema='v2' if m.get('schemaVersion')==2 or 'articleType' in m else 'legacy'
              title_tr=get_meta_value(m,'title_tr',['title','tr'])
              title_en=get_meta_value(m,'title_en',['title','en'])
              author=get_meta_value(m,'author') or ', '.join(' '.join(filter(None,[a.get('givenName'),a.get('familyName')])) for a in m.get('authors',[]))
              ptype_tr=get_meta_value(m,'publication_type_tr',['articleType','tr'])
              ptype_en=get_meta_value(m,'publication_type_en',['articleType','en'])
              pages=get_meta_value(m,'pages',['publication','pages'])
              received=get_meta_value(m,'received_date',['dates','received'])
              revised=get_meta_value(m,'revised_date',['dates','revised'])
              accepted=get_meta_value(m,'accepted_date',['dates','accepted'])
              published=get_meta_value(m,'published_online_date',['dates','published'])
              pdfs={'tr':get_meta_value(m,'pdf_tr_source',['pdf','tr','source']), 'en':get_meta_value(m,'pdf_en_source',['pdf','en','source'])}
              abstracts={'tr':get_meta_value(m,'abstract_tr',['abstract','tr']), 'en':get_meta_value(m,'abstract_en',['abstract','en'])}
              citations={'tr':get_meta_value(m,'citation_tr',['citation','tr']), 'en':get_meta_value(m,'citation_en',['citation','en'])}

              meta_rows.append((idx,slug,schema,author,ptype_tr,ptype_en,pages,received,revised,accepted,published))
              if files != ['en.json','tr.json']: errors.append(f'{slug}: fulltext files {files}')
              if slug not in catalog.get('fulltext',{}).get('localized',[]): errors.append(f'{slug}: not localized in catalog')
              if slug in catalog.get('fulltext',{}).get('current',[]): errors.append(f'{slug}: still in current catalog')
              if slug in catalog.get('fulltext',{}).get('en_archive',[]): errors.append(f'{slug}: still in en_archive catalog')
              if m.get('volume') not in (None,7) or m.get('issue') not in (None,2): errors.append(f'{slug}: wrong volume/issue')
              if published != '2026-03-01': errors.append(f'{slug}: published={published!r}')
              ds=[d for d in [received,revised,accepted,published] if d]
              if ds != sorted(ds): errors.append(f'{slug}: date chronology {received},{revised},{accepted},{published}')
              if norm(json.dumps(en,ensure_ascii=False)) == norm(json.dumps(tr,ensure_ascii=False)): errors.append(f'{slug}: identical locale data')
              for locale,ft in [('tr',tr),('en',en)]:
                  ids=[s.get('id') for s in ft.get('sections',[])]
                  if len(ids)!=len(set(ids)): errors.append(f'{slug}/{locale}: duplicate section ids')
                  if not ft.get('sections'): errors.append(f'{slug}/{locale}: no sections')
                  if any((sid and not sid.startswith(locale+'-')) for sid in ids): warnings.append(f'{slug}/{locale}: section ids not locale-prefixed')
                  raw=json.dumps(ft,ensure_ascii=False)
                  if re.search(r'�|Ã.|Â.|â€|â€™',raw): errors.append(f'{slug}/{locale}: mojibake')
                  if re.search(r'(?<=[A-Za-zÀ-ž])\d{3}\s+(?=[A-Za-zÀ-ž])', body_text(ft)): warnings.append(f'{slug}/{locale}: possible embedded page token')
                  refids=[r.get('id') for r in ft.get('references',[]) or []]
                  if len(refids)!=len(set(refids)): errors.append(f'{slug}/{locale}: duplicate reference ids')
                  for r in (ft.get('references',[]) or [])+(ft.get('footnotes',[]) or []):
                      txt=str(r.get('text',''))
                      # obvious PDF line break inside URLs/DOIs
                      for u in re.findall(r'https?://[^\s<>]+(?:\s+[^\s<>]+)*', txt):
                          if re.search(r'https?://\s|https?://[^\s]+\s+[\w./-]+',u): warnings.append(f'{slug}/{locale}/{r.get("id")}: possible split URL')
                      if re.search(r'https://10\.',txt): warnings.append(f'{slug}/{locale}/{r.get("id")}: malformed DOI URL')
              for locale,val in abstracts.items():
                  if val and re.match(r'^\s*(abstract|özet)\b',val,re.I): warnings.append(f'{slug}: {locale} abstract contains display label')
              for locale,val in citations.items():
                  if val and re.match(r'^\s*(citation|atıf)\b',val,re.I): warnings.append(f'{slug}: {locale} citation contains display label')
              if schema=='legacy': warnings.append(f'{slug}: legacy metadata schema')
              if ptype_tr=='Hakemli Araştırma Makalesi' or ptype_en=='Peer-reviewed Research Article': errors.append(f'{slug}: deprecated publication type')

              # PDF source verification
              for locale,ft in [('tr',tr),('en',en)]:
                  url=pdfs[locale]
                  if not url:
                      warnings.append(f'{slug}/{locale}: no source PDF')
                      continue
                  pdf=tmp/f'{idx:02d}-{locale}.pdf'; txt=tmp/f'{idx:02d}-{locale}.txt'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=35) as r: pdf.write_bytes(r.read())
                      subprocess.run(['pdftotext','-layout',str(pdf),str(txt)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      pdftext=txt.read_text(errors='ignore')
                      info=subprocess.run(['pdfinfo',str(pdf)],capture_output=True,text=True,check=True).stdout
                      mm=re.search(r'^Pages:\s+(\d+)',info,re.M); physical=int(mm.group(1)) if mm else None
                      coverage=pdf_coverage(body_text(ft),pdftext)
                      title=title_tr if locale=='tr' else title_en
                      title_cov=None
                      if title:
                          tt=set(norm(title).split()); pp=set(norm(pdftext[:12000]).split()); title_cov=len(tt&pp)/max(1,len(tt))
                      print(f'PDFCHECK {idx:02d} {locale.upper()} pages={physical} body4gram={coverage:.3f} titleToken={title_cov:.3f} bytes={pdf.stat().st_size}')
                      if coverage is not None and coverage < 0.55:
                          warnings.append(f'{slug}/{locale}: low canonical/PDF body coverage {coverage:.3f}')
                      if title_cov is not None and title_cov < 0.70:
                          warnings.append(f'{slug}/{locale}: title weakly matched in PDF {title_cov:.3f}')
                  except Exception as e:
                      errors.append(f'{slug}/{locale}: PDF verification failed: {e}')

              # Visual-content diagnostics
              if slug in {'zhang-yaxin','liu-chunhua','sanghay-halk-guzel-sanatlar-yayinevi-propaganda-afis-grubu'}:
                  for locale,ft in [('tr',tr),('en',en)]:
                      figs=ft.get('figures',[]) or []
                      print(f'VISUAL {slug}/{locale}: figures={len(figs)}, sections={len(ft.get("sections",[]))}, bodychars={len(body_text(ft))}')
                      if not figs: warnings.append(f'{slug}/{locale}: visual contribution has no figures in fulltext data')

          print('\nMETADATA SUMMARY')
          for row in meta_rows:
              print(' | '.join(str(x or '-') for x in row))
          print('\nERRORS',len(errors))
          for x in errors: print('E:',x)
          print('\nWARNINGS',len(warnings))
          for x in warnings: print('W:',x)
          print('\nNOTES',len(notes))
          for x in notes: print('N:',x)
          if errors:
              raise SystemExit(2)
          PY