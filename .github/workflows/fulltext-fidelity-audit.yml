name: Full-text fidelity audit

on:
  pull_request:
    paths:
      - "content/articles/**/fulltext/*.json"
      - "public/assets/article-figures/**"
      - "scripts/audit-fulltext-fidelity.py"
      - "tests/v*i*-fidelity-regression.test.mjs"
      - ".github/workflows/fulltext-fidelity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit official locale PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve fidelity unit
        id: unit
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF}"
          if [[ "$branch" =~ ^audit/(v[0-9]{2}-i[0-9]{2})-fulltext-fidelity$ ]]; then
            echo "issue=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.unit.outputs.issue != ''
        uses: actions/checkout@v4

      - name: Install PDF tools
        if: steps.unit.outputs.issue != ''
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null

      - name: Audit full-text fidelity
        if: steps.unit.outputs.issue != ''
        run: python3 scripts/audit-fulltext-fidelity.py "${{ steps.unit.outputs.issue }}"

      - name: Upload audit report
        if: steps.unit.outputs.issue != ''
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-fidelity-${{ steps.unit.outputs.issue }}
          path: .audit/fulltext-fidelity/${{ steps.unit.outputs.issue }}
          if-no-files-found: error
          retention-days: 7

      - name: Skip non-fidelity branch
        if: steps.unit.outputs.issue == ''
        run: echo "Not a full-text fidelity branch; audit skipped."
