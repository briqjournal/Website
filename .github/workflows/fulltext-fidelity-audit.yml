name: Full-text fidelity audit

on:
  pull_request:
    paths:
      - "content/articles/**/fulltext/*.json"
      - "public/assets/article-figures/**"
      - "scripts/audit-fulltext-fidelity.py"
      - "scripts/audit-fulltext-fidelity-ci.py"
      - "docs/FULLTEXT-FIDELITY-WORKLOG.md"
      - ".github/workflows/fulltext-fidelity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit official locale PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve fidelity unit
        id: unit
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF}"
          if [[ "$branch" =~ ^audit/(v[0-9]{2}-i[0-9]{2})-fulltext-fidelity$ ]]; then
            echo "issue=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.unit.outputs.issue != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Check out pinned official PDF archive
        if: steps.unit.outputs.issue == 'v04-i03'
        uses: actions/checkout@v4
        with:
          ref: 8c5e5252bb6f6cfbd8dd0569702047cdb3486fd1
          fetch-depth: 1
          lfs: false
          path: .audit/official-pdf-archive

      - name: Restore pinned official v04-i03 issue PDFs
        if: steps.unit.outputs.issue == 'v04-i03'
        shell: bash
        run: |
          set -euo pipefail
          en="public/assets/archive/pdfs/issues/cilt-4-sayi-3-en.pdf"
          tr="public/assets/archive/pdfs/issues/cilt-4-sayi-3-tr.pdf"
          source_root="$GITHUB_WORKSPACE/.audit/official-pdf-archive"

          cd "$source_root"
          git lfs install --local
          git lfs pull --include="$en,$tr" --exclude=""
          test "$(sha256sum "$en" | cut -d' ' -f1)" = "50f832fc08811fcd88cbea777176bccf2f4078e6ba29608a357323fdae12d3f7"
          test "$(sha256sum "$tr" | cut -d' ' -f1)" = "a8f33f0e6ee2b7727d51bc97ef48910d1be877bedd90ce7a4aa0ceeef9b66698"

          cd "$GITHUB_WORKSPACE"
          mkdir -p public/assets/archive/pdfs/issues
          cp "$source_root/$en" "$en"
          cp "$source_root/$tr" "$tr"

      - name: Install PDF tools
        if: steps.unit.outputs.issue != ''
        run: sudo apt-get update >/dev/null && sudo apt-get install -y poppler-utils >/dev/null

      - name: Run fidelity audit
        if: steps.unit.outputs.issue != ''
        shell: bash
        run: |
          mkdir -p .audit/diagnostics
          set +e
          python3 scripts/audit-fulltext-fidelity-ci.py "${{ steps.unit.outputs.issue }}" > .audit/diagnostics/audit.log 2>&1
          status=$?
          echo "$status" > .audit/diagnostics/audit.status
          cat .audit/diagnostics/audit.log
          exit 0

      - name: Upload audit report
        if: always() && steps.unit.outputs.issue != ''
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-fidelity-${{ steps.unit.outputs.issue }}
          path: |
            .audit/fulltext-fidelity/${{ steps.unit.outputs.issue }}
            .audit/diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce audit result
        if: steps.unit.outputs.issue != ''
        shell: bash
        run: |
          status="$(cat .audit/diagnostics/audit.status)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Skip non-fidelity branch
        if: steps.unit.outputs.issue == ''
        run: echo "Not a full-text fidelity branch; audit skipped."
