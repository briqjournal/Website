name: Full-text fidelity audit

on:
  pull_request:
    paths:
      - "content/articles/**/fulltext/*.json"
      - "public/assets/article-figures/**"
      - "scripts/audit-fulltext-fidelity.py"
      - "tests/v*i*-fidelity-regression.test.mjs"
      - ".github/workflows/fulltext-fidelity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit official locale PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Resolve fidelity unit
        id: unit
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF}"
          if [[ "$branch" =~ ^audit/(v[0-9]{2}-i[0-9]{2})-fulltext-fidelity$ ]]; then
            issue="${BASH_REMATCH[1]}"
            test_id="$(echo "$issue" | sed -E 's/^v0*([0-9]+)-i0*([0-9]+)$/v\1i\2/')"
            echo "issue=$issue" >> "$GITHUB_OUTPUT"
            echo "test_id=$test_id" >> "$GITHUB_OUTPUT"
          else
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "test_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.unit.outputs.issue != ''
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.unit.outputs.issue != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies and PDF tools
        if: steps.unit.outputs.issue != ''
        run: |
          npm ci
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null

      - name: Run focused fidelity regression
        if: steps.unit.outputs.issue != ''
        shell: bash
        run: |
          mkdir -p .audit/diagnostics
          set +e
          node --test "tests/${{ steps.unit.outputs.test_id }}-fidelity-regression.test.mjs" > .audit/diagnostics/regression.log 2>&1
          status=$?
          echo "$status" > .audit/diagnostics/regression.status
          cat .audit/diagnostics/regression.log
          exit 0

      - name: Audit full-text fidelity
        if: steps.unit.outputs.issue != ''
        shell: bash
        run: |
          mkdir -p .audit/diagnostics
          set +e
          python3 scripts/audit-fulltext-fidelity.py "${{ steps.unit.outputs.issue }}" > .audit/diagnostics/audit.log 2>&1
          status=$?
          echo "$status" > .audit/diagnostics/audit.status
          cat .audit/diagnostics/audit.log
          exit 0

      - name: Upload audit report and diagnostics
        if: always() && steps.unit.outputs.issue != ''
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-fidelity-${{ steps.unit.outputs.issue }}
          path: |
            .audit/fulltext-fidelity/${{ steps.unit.outputs.issue }}
            .audit/diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce verification result
        if: steps.unit.outputs.issue != ''
        shell: bash
        run: |
          regression="$(cat .audit/diagnostics/regression.status)"
          audit="$(cat .audit/diagnostics/audit.status)"
          if [ "$regression" -ne 0 ] || [ "$audit" -ne 0 ]; then
            echo "Focused regression status: $regression"
            echo "PDF audit status: $audit"
            exit 1
          fi

      - name: Skip non-fidelity branch
        if: steps.unit.outputs.issue == ''
        run: echo "Not a full-text fidelity branch; audit skipped."
