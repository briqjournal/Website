name: One-time Efe Can Gurcan profile repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-efe-can-gurcan-profile.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair profile and clean temporary files
        run: |
          python scripts/fix-efe-can-gurcan-profile.py
          rm scripts/fix-efe-can-gurcan-profile.py
          rm .github/workflows/fix-efe-can-gurcan-profile.yml
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add app/authors.ts scripts/fix-efe-can-gurcan-profile.py .github/workflows/fix-efe-can-gurcan-profile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Correct Efe Can Gürcan author profile"
          git push origin HEAD:main
