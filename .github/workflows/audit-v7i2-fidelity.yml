name: Paragraph fidelity audit V7I2
on:
  push:
    branches: [automation/v7i2-deep-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Compare canonical paragraphs with source PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,re,tempfile,urllib.request,subprocess,unicodedata
          from pathlib import Path

          issue=json.loads(Path('content/issues/v07-i02.json').read_text())
          slugs=issue['articles'][:6]
          tmp=Path(tempfile.mkdtemp())

          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).lower()
              s=s.replace('’',"'").replace('“','"').replace('”','"').replace('–','-').replace('—','-')
              s=re.sub(r'-\s*\n\s*','',s)
              s=re.sub(r'\s+',' ',s)
              s=re.sub(r'[^\w\s\'\-]',' ',s,flags=re.UNICODE)
              return re.sub(r'\s+',' ',s).strip()

          def shingles(text,n=3):
              t=norm(text).split()
              return {' '.join(t[i:i+n]) for i in range(max(0,len(t)-n+1))}

          def cov(text,pdf):
              a=shingles(text,3); b=shingles(pdf,3)
              if not a: return 1.0
              return len(a&b)/len(a)

          def meta_pdf(m,locale):
              if 'urls' in m: return m['urls'].get('pdfTr' if locale=='tr' else 'pdfEn')
              return m.get('pdf_tr_source' if locale=='tr' else 'pdf_en_source')

          bad=[]
          for si,slug in enumerate(slugs,1):
              m=json.loads(Path('content/articles',slug,'metadata.json').read_text())
              for locale in ['tr','en']:
                  ft=json.loads(Path('content/articles',slug,'fulltext',locale+'.json').read_text())
                  url=meta_pdf(m,locale)
                  pdf=tmp/f'{si}-{locale}.pdf'; raw=tmp/f'{si}-{locale}.txt'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=40) as r: pdf.write_bytes(r.read())
                  subprocess.run(['pdftotext','-raw',str(pdf),str(raw)],check=True)
                  pt=raw.read_text(errors='ignore')
                  rows=[]
                  for sec_i,sec in enumerate(ft.get('sections',[]),1):
                      title=sec.get('title','') or ''
                      if len(norm(title).split())>=2:
                          rows.append((cov(title,pt),'TITLE',sec_i,title[:120]))
                      for par_i,p in enumerate(sec.get('paragraphs',[]) or [],1):
                          words=len(norm(p).split())
                          if words>=8:
                              rows.append((cov(p,pt),f'P{par_i}',sec_i,p[:140].replace('\n',' ')))
                  rows.sort(key=lambda x:x[0])
                  scores=[r[0] for r in rows if r[1].startswith('P')]
                  severe=[r for r in rows if r[1].startswith('P') and r[0] < 0.55]
                  weak=[r for r in rows if r[1].startswith('P') and r[0] < 0.75]
                  print(f'ARTICLE {si} {locale.upper()} {slug}')
                  print(f' paragraphs={len(scores)} mean={sum(scores)/len(scores):.3f} min={min(scores):.3f} weak<.75={len(weak)} severe<.55={len(severe)}')
                  for r in rows[:12]: print(f'   {r[0]:.3f} S{r[2]} {r[1]} {r[3]}')
                  if len(severe)>max(2,round(len(scores)*0.08)):
                      bad.append(f'{slug}/{locale}: {len(severe)}/{len(scores)} paragraphs below .55')
          print('\nAUDIT FLAGS')
          for x in bad: print('FLAG',x)
          PY