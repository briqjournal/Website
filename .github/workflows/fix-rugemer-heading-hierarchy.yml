name: Fix Rügemer heading hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rugemer-heading-hierarchy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct EN/TR heading levels
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'content/articles/hitlerin-sovyetler-birligine-karsi-savasi-ayni-zamanda-abd-icin-bir-vekalet-savasiydi/fulltext';
          const mainSections = new Set([1, 2, 11, 18, 26, 32, 33, 39]);
          const expectedMainTitles = {
            en: {
              1: 'Introduction',
              2: 'Versailles: A Counter-plan to the “Communist World Revolution”',
              11: 'The US Promotes All Fascist Dictatorships in Europe',
              18: 'The US Promotes Hitler and Arms the Wehrmacht',
              26: 'Hitler’s European War Bank – Led by Wall Street',
              32: 'From 1942: Short and Small Aid Also for the Soviet Union',
              33: 'After the War: The Soviet Union is Again the Main Enemy',
              39: 'Conclusion'
            },
            tr: {
              1: 'Giriş',
              2: 'Versay: “Komünist Dünya Devrimi”ne Karşı Bir Plan'
            }
          };

          for (const lang of ['en', 'tr']) {
            const path = `${root}/${lang}.json`;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(data.sections) || data.sections.length !== 39) {
              throw new Error(`${lang}: expected 39 sections, found ${data.sections?.length}`);
            }
            data.sections.forEach((section, idx) => {
              const n = idx + 1;
              const expectedId = `${lang}-section-${n}`;
              if (section.id !== expectedId) {
                throw new Error(`${lang}: expected ${expectedId}, found ${section.id}`);
              }
              const expectedTitle = expectedMainTitles[lang]?.[n];
              if (expectedTitle && section.title !== expectedTitle) {
                throw new Error(`${lang}: unexpected title at section ${n}: ${section.title}`);
              }
              section.level = mainSections.has(n) ? 'section' : 'subsection';
            });
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }
          NODE
      - name: Commit hierarchy fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-rugemer-heading-hierarchy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/hitlerin-sovyetler-birligine-karsi-savasi-ayni-zamanda-abd-icin-bir-vekalet-savasiydi/fulltext/en.json \
                  content/articles/hitlerin-sovyetler-birligine-karsi-savasi-ayni-zamanda-abd-icin-bir-vekalet-savasiydi/fulltext/tr.json \
                  .github/workflows/fix-rugemer-heading-hierarchy.yml
          git commit -m 'Fix Rügemer article heading hierarchy'
          git pull --rebase origin main
          git push origin HEAD:main
