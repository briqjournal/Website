name: Sync PDF archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briq-pdf-archive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git LFS
        run: |
          git lfs install --local
          git lfs track "*.pdf"

      - name: Download and verify the complete archive
        run: python3 scripts/localize-pdf-archive.py

      - name: Commit archive changes
        run: |
          git config user.name "BRIQ Archive Bot"
          git config user.email "briq@briqjournal.com"
          git add .gitattributes app/archive-data.json public scripts/localize-pdf-archive.py
          if git diff --cached --quiet; then
            echo "The PDF archive is already current."
            exit 0
          fi
          git commit -m "Update complete BRIQ PDF archive"
          git push origin HEAD:main
