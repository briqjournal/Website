name: One-time Mongolia heading hierarchy fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mongolia-heading-hierarchy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore heading hierarchy in both locales
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim"
          base = Path("content/articles") / slug / "fulltext"
          subsection_ids = {
              "tr": {
                  "tr-section-4", "tr-section-5",
                  "tr-section-7", "tr-section-8", "tr-section-9", "tr-section-10",
                  "tr-section-12", "tr-section-13", "tr-section-14",
              },
              "en": {
                  "en-section-4", "en-section-5",
                  "en-section-7", "en-section-8", "en-section-9", "en-section-10",
                  "en-section-12", "en-section-13", "en-section-14",
              },
          }
          main_ids = {
              "tr": {"tr-section-1", "tr-section-2", "tr-section-3", "tr-section-6", "tr-section-11", "tr-section-15"},
              "en": {"en-section-1", "en-section-2", "en-section-3", "en-section-6", "en-section-11", "en-section-15"},
          }

          for locale in ("tr", "en"):
              path = base / f"{locale}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              ids = {section.get("id") for section in data.get("sections", [])}
              expected = subsection_ids[locale] | main_ids[locale]
              missing = expected - ids
              if missing:
                  raise SystemExit(f"{path}: expected section ids missing: {sorted(missing)}")
              for section in data["sections"]:
                  sid = section.get("id")
                  if sid in subsection_ids[locale]:
                      section["level"] = "subsection"
                  elif sid in main_ids[locale]:
                      section.pop("level", None)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git rm .github/workflows/fix-mongolia-heading-hierarchy.yml
          git config user.name "BRIQ Journal"
          git config user.email "briq@briqjournal.com"
          git add content/articles/mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim/fulltext/tr.json
          git add content/articles/mogolistanin-ucuncu-komsu-diplomasisinde-kurumsal-dengeleme-sanghay-isbirligi-orgutu-ile-etkilesim/fulltext/en.json
          git commit -m "Restore Mongolia article heading hierarchy"
          git pull --rebase origin main
          git push origin HEAD:main
