name: Temporary v03-i01 canonical assembly

on:
  push:
    branches:
      - chore/v03-i01-fulltext-canonical
    paths:
      - .github/workflows/tmp-v03-i01-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v03-i01-fulltext-canonical
          fetch-depth: 1

      - name: Install PDF tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null

      - name: Download authoritative PDFs and extract exact embedded images
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v03-i01-images/en /tmp/v03-i01-images/tr
          curl -fL --retry 3 --retry-delay 2 -A "BRIQ-v03-i01-migration/1.0" \
            'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-12/BRIQ%20Vol.3%20Issue1_Site.pdf' \
            -o /tmp/v03-i01-en.pdf
          curl -fL --retry 3 --retry-delay 2 -A "BRIQ-v03-i01-migration/1.0" \
            'https://briqjournal.com/sites/default/files/dergi-sayilari/2025-12/BRIQ%203.%20Cilt%201.%20Say%C4%B1_Site.pdf' \
            -o /tmp/v03-i01-tr.pdf
          pdfimages -all /tmp/v03-i01-en.pdf /tmp/v03-i01-images/en/image
          pdfimages -all /tmp/v03-i01-tr.pdf /tmp/v03-i01-images/tr/image

      - name: Assemble canonical bilingual records
        run: |
          set -euxo pipefail
          python3 scripts/.v03-i01-assemble.py "$GITHUB_WORKSPACE" /tmp/v03-i01-images/en /tmp/v03-i01-images/tr

      - name: Validate canonical record count
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          issue=json.loads(Path('content/issues/v03-i01.json').read_text())
          assert len(issue['articles']) == 14
          for slug in issue['articles']:
              for lang in ('en','tr'):
                  p=Path('content/articles')/slug/'fulltext'/f'{lang}.json'
                  assert p.exists(), p
                  o=json.loads(p.read_text())
                  assert o['sections'] and any(s.get('paragraphs') for s in o['sections']), p
          cat=json.loads(Path('content/catalog.json').read_text())
          assert all(s in cat['fulltext']['localized'] for s in issue['articles'])
          print('validated 14/14 EN + 14/14 TR and localized registration')
          PY

      - name: Commit canonical assembly
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/catalog.json public/assets/article-figures .migration/v03-i01-evidence/assembly-summary.json
          git commit -m 'content(v03-i01): add canonical bilingual implementation'
          git push origin HEAD:chore/v03-i01-fulltext-canonical
