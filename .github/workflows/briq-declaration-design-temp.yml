name: Refine author declarations design

on:
  push:
    paths:
      - '.github/workflows/briq-declaration-design-temp.yml'

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch declaration styles
        run: python3 scripts/patch-author-declarations-design.py
      - name: Commit declaration design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Refine author declarations design"
          git push
