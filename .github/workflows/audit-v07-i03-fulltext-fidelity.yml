name: Audit v07-i03 full-text fidelity

on:
  push:
    branches:
      - audit/v07-i03-fulltext-fidelity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run fidelity audit
        run: python3 scripts/audit-fulltext-fidelity.py v07-i03

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v07-i03-fidelity-audit
          if-no-files-found: error
          retention-days: 2
          path: |
            .audit/fulltext-fidelity/v07-i03/report.json
            .audit/fulltext-fidelity/v07-i03/report.md
            .audit/fulltext-fidelity/v07-i03/*/*/*.pdf
            .audit/fulltext-fidelity/v07-i03/*/*/raw.txt
            .audit/fulltext-fidelity/v07-i03/*/*/pages/*.txt
            .audit/fulltext-fidelity/v07-i03/*/*/renders/*.png
