name: Build v05-i03 article-PDF evidence

on:
  push:
    branches:
      - chore/v05-i03-fulltext-canonical
    paths:
      - '.github/workflows/v05-i03-fulltext-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download authoritative article PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess, urllib.parse, urllib.request

          root = pathlib.Path(".")
          issue = json.loads((root / "content/issues/v05-i03.json").read_text(encoding="utf-8"))
          prose = issue["articles"][:8]
          out = root / "tmp/v05-i03-pdfs"
          out.mkdir(parents=True, exist_ok=True)

          for slug in prose:
              meta = json.loads((root / "content/articles" / slug / "metadata.json").read_text(encoding="utf-8"))
              for locale, key in (("en", "pdfEn"), ("tr", "pdfTr")):
                  url = meta["urls"][key]
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme != "https" or parsed.hostname not in {"briqjournal.com", "www.briqjournal.com"}:
                      raise SystemExit(f"non-BRIQ PDF URL for {slug} {locale}: {url}")
                  target = out / f"{slug}-{locale}.pdf"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as response, target.open("wb") as fh:
                      fh.write(response.read())
                  subprocess.run(["pdfinfo", str(target)], check=True, stdout=subprocess.DEVNULL)
                  print(slug, locale, target.stat().st_size)
          PY

      - name: Extract isolated candidates from article PDFs
        run: node tmp/v05-i03-extractor.mjs 5-3

      - name: Persist candidate and raw evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess

          root = pathlib.Path(".")
          issue = json.loads((root / "content/issues/v05-i03.json").read_text(encoding="utf-8"))
          prose = issue["articles"][:8]
          candidate_root = root / "tmp/v05-i03-candidates"
          evidence_root = root / "tmp/v05-i03-evidence"
          candidate_root.mkdir(parents=True, exist_ok=True)
          evidence_root.mkdir(parents=True, exist_ok=True)
          summary = {}

          for slug in prose:
              fulltext = root / "content/articles" / slug / "fulltext"
              current = fulltext / "current.json"
              data = json.loads(current.read_text(encoding="utf-8"))
              summary[slug] = {}
              for locale in ("en", "tr"):
                  payload = data[locale]
                  outdir = candidate_root / slug
                  outdir.mkdir(parents=True, exist_ok=True)
                  (outdir / f"{locale}.json").write_text(
                      json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )

                  pdf = root / "tmp/v05-i03-pdfs" / f"{slug}-{locale}.pdf"
                  raw = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True, errors="replace")
                  edir = evidence_root / slug
                  edir.mkdir(parents=True, exist_ok=True)
                  (edir / f"{locale}-raw.txt").write_text(raw, encoding="utf-8")

                  paragraphs = [p for s in payload.get("sections", []) for p in s.get("paragraphs", [])]
                  body = " ".join(paragraphs)
                  flags = []
                  lowered = body.lower()
                  for marker in ("how to cite", "atıf:", "b r i q", "volume 5 issue 3", "cilt 5 sayı 3"):
                      if marker in lowered:
                          flags.append(marker)
                  summary[slug][locale] = {
                      "sections": [s.get("title", "") for s in payload.get("sections", [])],
                      "paragraph_count": len(paragraphs),
                      "body_chars": len(body),
                      "references": len(payload.get("references", [])),
                      "footnotes": len(payload.get("footnotes", [])),
                      "figures": len(payload.get("figures", [])),
                      "first": paragraphs[0][:500] if paragraphs else "",
                      "last": paragraphs[-1][-500:] if paragraphs else "",
                      "flags": flags,
                  }
              current.unlink()

          (evidence_root / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          subprocess.run(["git", "checkout", "--", "content/catalog.json"], check=True)
          PY
          rm -rf tmp/v05-i03-pdfs

      - name: Validate temporary candidate shape
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib

          root = pathlib.Path(".")
          issue = json.loads((root / "content/issues/v05-i03.json").read_text(encoding="utf-8"))
          required = {"sections", "keywords", "footnotes", "references", "acknowledgements", "figures"}
          for slug in issue["articles"][:8]:
              for locale in ("en", "tr"):
                  path = root / "tmp/v05-i03-candidates" / slug / f"{locale}.json"
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if not required.issubset(data):
                      raise SystemExit((slug, locale, sorted(data)))
                  if not isinstance(data["sections"], list) or not data["sections"]:
                      raise SystemExit((slug, locale, "empty sections"))
                  body = " ".join(p for s in data["sections"] for p in s.get("paragraphs", []))
                  if len(body) < 300:
                      raise SystemExit((slug, locale, "short body", len(body)))
          print("V05_I03_TEMP_CANDIDATES_OK")
          PY

      - name: Commit extraction evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tmp/v05-i03-candidates tmp/v05-i03-evidence
          git commit -m 'Capture v05-i03 article-PDF candidates'
          git pull --rebase origin chore/v05-i03-fulltext-canonical
          git push origin HEAD:chore/v05-i03-fulltext-canonical
